<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<style id="ch-css">
/* CRYPTO HUNTERS: the shared look of every tool.
   The colors are the ones of Heat Index (the main app), so all tools read as one product.
   Each tool maps its own variable names to these tokens in a small <style id="ch-skin"> block. */
:root{
  --ch-bg:#fff;--ch-s1:#f4f4f2;--ch-tx:#1b1f24;--ch-t2:#5f6368;--ch-t3:#8a8f96;--ch-bd:#e3e3e0;--ch-bd2:#c9c9c4;
  --ch-acb:#e6f1fb;--ch-act:#0c447c;--ch-acd:#85b7eb;--ch-ac:#378add;
  --ch-okb:#eaf3de;--ch-okt:#27500a;--ch-erb:#fcebeb;--ch-ert:#791f1f;--ch-warn:#ba7517;
  --ch-up:#1d9e75;--ch-dn:#e24b4a;--ch-upb:rgba(29,158,117,.12);--ch-dnb:rgba(226,75,74,.12);
  --ch-brand:#c9820f;--ch-w:760px;--ch-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}}
:root[data-theme=dark]{
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}

/* ---- suite bar: brand, Telegram channel and the tools ---- */
.ch-top{background:var(--ch-bg);border-bottom:0.5px solid var(--ch-bd);font:14px/1.4 var(--ch-font);color:var(--ch-tx);position:relative;z-index:3}
.ch-in{max-width:var(--ch-w);margin:0 auto;padding:0 14px}
.ch-row{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.ch-brand{display:inline-flex;align-items:center;gap:8px;color:var(--ch-tx);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.ch-brand img,.ch-logo,.ch-logo svg{width:26px;height:26px;border-radius:8px;display:block;flex:0 0 auto}
.ch-brand span b{color:var(--ch-brand);font-weight:600}
.ch-sp{flex:1}
.ch-tg{display:inline-flex;align-items:center;gap:6px;color:var(--ch-act);background:var(--ch-acb);border:0.5px solid var(--ch-acd);border-radius:14px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap;min-height:28px}
.ch-tg svg{width:15px;height:15px;flex:0 0 auto}
.ch-tg:hover{border-color:var(--ch-act)}
.ch-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.ch-nav::-webkit-scrollbar{display:none}
.ch-nav a,.ch-nav span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 10px;border-radius:8px;color:var(--ch-t2);text-decoration:none;font-size:13px}
.ch-nav a:hover{color:var(--ch-tx);background:var(--ch-s1)}
.ch-nav span{background:var(--ch-acb);color:var(--ch-act);font-weight:500}
.ch-nav svg,.ch-links svg{width:15px;height:15px;flex:0 0 auto}
.ch-top a:focus-visible,.ch-links a:focus-visible,.ch-foot a:focus-visible,.ch-cam:focus-visible,.ch-shot button:focus-visible,.ch-shot a:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:420px){.ch-brand{font-size:13px}.ch-tg span{display:none}.ch-tg{padding:4px 8px}}

/* ---- links from a coin card to the other tools ---- */
.ch-links{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font:12px/1.3 var(--ch-font)}
.ch-links>em{font-style:normal;color:var(--ch-t3);margin-right:2px}
.ch-links a{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);text-decoration:none;background:transparent;white-space:nowrap;min-height:26px}
.ch-links a:hover{border-color:var(--ch-acd);color:var(--ch-act);background:var(--ch-acb)}
.ch-links svg{width:13px;height:13px}
.ch-links:empty{display:none}

/* ---- screenshot: camera button and preview ---- */
:root .ch-cam{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--ch-bd2);background:var(--ch-bg);color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;white-space:nowrap}
:root .ch-cam:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-cam svg{width:16px;height:16px}
:root .ch-cam.ch-float{position:absolute;top:10px;right:10px;z-index:2}
.ch-shot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.5);font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-shot[hidden]{display:none}
.ch-shot .ch-pn{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ch-shot img{display:block;width:100%;height:auto;border-radius:8px;border:0.5px solid var(--ch-bd)}
.ch-shot .ch-wait{padding:36px 0;text-align:center;color:var(--ch-t2)}
.ch-shot .ch-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:root .ch-shot .ch-acts>*{flex:1 1 auto;text-align:center;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:6px 12px;font:13px/1.2 var(--ch-font);cursor:pointer;text-decoration:none;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
:root .ch-shot .ch-acts>.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-shot p{margin:8px 2px 0;font-size:12px;color:var(--ch-t3)}

/* ---- footer ---- */
.ch-foot{border-top:0.5px solid var(--ch-bd);margin-top:24px;font:12px/1.5 var(--ch-font);color:var(--ch-t3);background:var(--ch-bg)}
.ch-foot .ch-in{padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ch-foot b{color:var(--ch-t2);font-weight:600;letter-spacing:.04em}
.ch-foot a{color:var(--ch-act);text-decoration:none}
.ch-foot a:hover{text-decoration:underline}

/* ---- base skin of every tool (the class is set on the body by ch.js) ---- */
body.ch-skin{font-family:var(--ch-font)!important;font-size:14px;line-height:1.45;-webkit-font-smoothing:auto}
body.ch-skin :is(h1,h2,h3,h4,input,select,button,textarea,summary,.brand){font-family:inherit!important;font-stretch:normal!important}
body.ch-skin :is(input,select,textarea){border-width:0.5px!important}
body.ch-skin ::selection{background:var(--ch-acb);color:var(--ch-act)}

/* ---- notification log ---- */
:root .ch-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;padding:0;flex:0 0 auto}
:root .ch-bell:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-bell svg{width:17px;height:17px}
.ch-bell b{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ch-dn);color:#fff;font:600 10px/17px var(--ch-font);text-align:center;box-sizing:border-box}
.ch-bell b[hidden]{display:none}
.ch-bell:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-lock,.ch-lock body{overflow:hidden}
.ch-log{position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-log[hidden]{display:none}
.ch-lp{width:min(440px,100%);height:100%;background:var(--ch-bg);border-left:0.5px solid var(--ch-bd2);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.ch-lp>header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.ch-lp h2{flex:1;margin:0;font:500 17px/1.3 var(--ch-font)}
:root .ch-x{width:32px;height:32px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;font-size:13px}
.ch-lf{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px;border-bottom:0.5px solid var(--ch-bd)}
.ch-lf:empty{display:none}
.ch-lf::-webkit-scrollbar{display:none}
:root .ch-lf button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:28px}
:root .ch-lf button svg{width:13px;height:13px}
:root .ch-lf button[aria-pressed=true]{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-ll{flex:1;overflow:auto;padding:4px 14px 14px;overscroll-behavior:contain}
.ch-le{border-bottom:0.5px solid var(--ch-bd);padding:11px 0 11px 10px;margin-left:-10px;border-left:2px solid transparent}
.ch-le.ch-new{border-left-color:var(--ch-ac)}
.ch-lm{display:flex;align-items:center;gap:6px;color:var(--ch-t3);font-size:12px;margin-bottom:3px}
.ch-lm svg{width:14px;height:14px}
.ch-lm em{font-style:normal;color:var(--ch-act);background:var(--ch-acb);border-radius:6px;padding:0 6px;font-size:11px}
.ch-lm time{margin-left:auto;white-space:nowrap}
.ch-le>b{display:block;font-weight:500;font-size:14px}
.ch-le p{margin:2px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-lc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.ch-lc span{font-size:11px;color:var(--ch-t3);border:0.5px solid var(--ch-bd);border-radius:6px;padding:1px 6px}
.ch-lc a{margin-left:auto;font-size:12px;color:var(--ch-act);text-decoration:none;padding:3px 0}
.ch-lc a:hover{text-decoration:underline}
.ch-l0{color:var(--ch-t2);padding:28px 4px;margin:0;text-align:center}
.ch-lp>footer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:0.5px solid var(--ch-bd)}
.ch-lh{flex:1;font-size:11px;color:var(--ch-t3)}
:root .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:5px 12px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:30px}
.ch-lp :is(button,a):focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:520px){.ch-lp{width:100%;border-left:0}}

/* ---- notification panel: tabs, rules, form, settings ---- */
:root .ch-log .ch-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:0.5px solid var(--ch-bd)}
:root .ch-log .ch-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ch-t2);font:500 13px/1.2 var(--ch-font);padding:9px 6px 8px;cursor:pointer;min-height:36px}
:root .ch-log .ch-tabs button[aria-selected=true]{color:var(--ch-tx);border-bottom-color:var(--ch-ac)}
.ch-log .ch-lf{padding-top:10px}
:root .ch-log .ch-add{display:block;width:100%;margin:12px 0 6px;border:0.5px dashed var(--ch-acd);background:var(--ch-acb);color:var(--ch-act);border-radius:12px;padding:10px;font:500 14px/1.2 var(--ch-font);cursor:pointer}
.ch-rule{border-bottom:0.5px solid var(--ch-bd);padding:11px 0}
.ch-rule.ch-offr>:not(.ch-rt){opacity:.6}
.ch-rt{display:flex;align-items:center;gap:8px}
.ch-rt b{font-weight:600;font-size:15px}
.ch-rt span{color:var(--ch-t3);font-size:12px;flex:1}
.ch-rule>p{margin:3px 0 0;font-size:14px}
.ch-rule>p.ch-note{color:var(--ch-t2);font-size:13px}
.ch-lc .ch-ok{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-lc .ch-err{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}
.ch-rm{display:flex;align-items:center;gap:6px;margin-top:7px}
.ch-rm small{flex:1;color:var(--ch-t3);font-size:12px}
:root .ch-log .ch-rm button,:root .ch-log .ch-quick button,:root .ch-log .ch-fh button,:root .ch-log .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 11px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;font-weight:400}
:root .ch-log .ch-lp>footer button.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500;padding:6px 18px;font-size:13px}
.ch-sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.ch-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ch-sw i{position:absolute;inset:0;border-radius:11px;background:var(--ch-bd2);transition:background .15s}
.ch-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.ch-sw input:checked+i{background:var(--ch-ac)}
.ch-sw input:checked+i::after{transform:translateX(16px)}
.ch-sw input:focus-visible+i{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-form{display:flex;flex-direction:column;gap:10px;padding:12px 0 4px}
.ch-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ch-t2);min-width:0}
:root .ch-log .ch-form :is(input:not([type=checkbox]),select){font:14px/1.3 var(--ch-font);color:var(--ch-tx);background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;box-sizing:border-box;margin:0}
:root .ch-log .ch-form :is(input,select):focus{outline:2px solid var(--ch-acd);outline-offset:0;border-color:var(--ch-acd)}
.ch-f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ch-f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-f2>label:only-child{grid-column:1/-1}
.ch-now{font-size:13px;color:var(--ch-t2);background:var(--ch-s1);border-radius:8px;padding:7px 10px}
.ch-quick{display:flex;flex-wrap:wrap;gap:5px}
.ch-fh{margin:0;font-size:12px;color:var(--ch-t3);line-height:1.45}
.ch-ferr{margin:0;color:var(--ch-ert);background:var(--ch-erb);border-radius:8px;padding:7px 10px;font-size:13px}
.ch-ferr[hidden]{display:none}
.ch-chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:14px!important;color:var(--ch-tx)!important;cursor:pointer}
.ch-chk input{width:18px;height:18px;margin:0;accent-color:var(--ch-ac)}

/* ---- bell on a coin card ---- */
:root .ch-links .ch-al{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-acd);border-radius:14px;color:var(--ch-act);background:var(--ch-acb);font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-al svg{width:13px;height:13px}
:root .ch-links .ch-al:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}

/* ---- on-screen alerts ---- */
.ch-toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1002;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 24px));font:14px/1.4 var(--ch-font)}
.ch-toast{position:relative;background:var(--ch-bg);color:var(--ch-tx);border:0.5px solid var(--ch-bd2);border-left:3px solid var(--ch-ac);border-radius:12px;padding:10px 36px 10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:chIn .2s ease-out}
.ch-toast b{display:block;font-weight:600}
.ch-toast p{margin:3px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-toast a{display:inline-block;margin-top:6px;font-size:12px;color:var(--ch-act);text-decoration:none}
:root .ch-toast button{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;background:none;color:var(--ch-t3);cursor:pointer;border-radius:8px;padding:0;min-height:0;font-size:12px}
@keyframes chIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ch-toast{animation:none}}

/* ---- hover hints ---- */
.ch-tip{position:fixed;z-index:1100;max-width:min(300px,calc(100vw - 12px));padding:7px 10px;border-radius:8px;background:var(--ch-tx);color:var(--ch-bg);font:12.5px/1.45 var(--ch-font);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;white-space:pre-line;animation:chTip .12s ease-out}
.ch-tip[hidden]{display:none}
@keyframes chTip{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ch-tip{animation:none}}

/* ---- version ---- */
.ch-ver{font:500 11px/1 var(--ch-font);color:var(--ch-t3);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:3px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-ver.ch-old{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}

/* ---- news ---- */
:root .ch-links .ch-nw{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);background:transparent;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-nw svg{width:13px;height:13px}
:root .ch-links .ch-nw.zero{color:var(--ch-t3)}
:root .ch-links .ch-nw.pos{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
:root .ch-links .ch-nw.neg{color:var(--ch-warn);border-color:var(--ch-warn)}
:root .ch-links .ch-nw.imp{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent;font-weight:600}
:root .ch-links .ch-nw:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-nwi .ch-nh{display:block;color:var(--ch-tx);text-decoration:none;font-weight:500;font-size:14px;line-height:1.4}
.ch-nwi .ch-nh:hover{color:var(--ch-act)}
.ch-ni{font-size:11px;color:var(--ch-ert);background:var(--ch-erb);border-radius:6px;padding:0 6px}
.ch-nt{font-size:11px;border-radius:6px;padding:0 6px;color:var(--ch-t3);border:0.5px solid var(--ch-bd)}
.ch-nt.t-1{color:var(--ch-warn);border-color:var(--ch-warn)}
.ch-nt.t1{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-sh{margin:10px 0 0;font:500 14px/1.3 var(--ch-font);color:var(--ch-tx)}

/* ---- favorites, events, install ---- */
:root .ch-links .ch-fv{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t3);border-radius:14px;min-height:26px;min-width:30px;padding:2px 8px;font-size:14px;line-height:1;cursor:pointer}
:root .ch-links .ch-fv.on{color:var(--ch-brand);border-color:var(--ch-brand)}

/* ---------- formatting ---------- */
function fmtN(n){
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e9) return s + (a/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return s + (a/1e3).toFixed(1) + 'K';
  if (a >= 1) return s + a.toFixed(2);
  return s + a.toPrecision(3);
}
function fmtP(p){
  if (p >= 100) return p.toFixed(2);
  if (p >= 1) return p.toFixed(4);
  if (p >= 0.01) return p.toFixed(6);
  return p.toFixed(8);
}
function fmtPct(v, d=2){ if (v === null || v === undefined || isNaN(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%'; }
function fmtAge(ms){ const s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour12:false}); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function quoteOf(sym){ const q = QUOTES.find(q => sym.endsWith(q) && sym.length > q.length); return q || ''; }
function median(arr){ if (!arr.length) return 0; const a = arr.slice().sort((x,y)=>x-y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m-1]+a[m])/2; }

    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

/* ---------- connection ---------- */
function startSession(sym){
  sym = sym.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!sym) return;
  store.set('ws_symbol', sym);
  S.symbol = sym; S.quote = quoteOf(sym);
  if (window.CH) CH.linksInto($('chLinks'), S.quote ? { coin: sym.slice(0, -S.quote.length), q: S.quote, ex: cfg.ex, from: 'whales' } : null);
  S.priceHist = []; S.walls.clear(); S.wallHist = []; S.whaleDots = [];
  S.tradeN = []; S.tradeMedian = 0; S.tradeCount = 0; S.cvd = 0; S.cvdWhale = 0;
  S.events = []; S.pending = []; S.stats = {}; S.bs = 0;
  TYPES.forEach(ty => S.stats[ty] = {n:0, s1:0, n1:0, h1:0, s5:0, n5:0, h5:0});
  S.startTime = Date.now();
  connect(sym);
  render(true);
}
const EX_NAME = {binance:'Binance', bybit:'Bybit'};
function connect(sym){
  const gen = ++S.gen;
  if (S.ws) { try { S.ws.close(); } catch(e){} }
  S.bids.clear(); S.asks.clear(); S.synced = false; S.firstApplied = false; S.buffer = []; S.live = false;
  setStatus('sLoad');
  if (cfg.ex === 'bybit') { connectBybit(sym, gen); return; }
  const s = sym.toLowerCase();
  const ws = new WebSocket('wss://stream.binance.com:9443/stream?streams=' + s + '@depth@100ms/' + s + '@aggTrade');
  S.ws = ws;
  ws.onmessage = ev => {
    if (gen !== S.gen) return;
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (!m.stream) return;
    if (m.stream.endsWith('@aggTrade')) handleTrade(+m.data.p, +m.data.q, m.data.m); else onDepth(m.data);
  };
  ws.onclose = () => {
    if (gen !== S.gen) return;
    setStatus('sRe');
    setTimeout(() => { if (gen === S.gen) connect(sym); }, 3000);
  };
  ws.onopen = () => { if (gen === S.gen) loadSnapshot(gen, sym); };
}
function connectBybit(sym, gen){
  const ws = new WebSocket('wss://stream.bybit.com/v5/public/spot');
  S.ws = ws;
  let ping = null;
  const send = o => { try { ws.send(JSON.stringify(o)); } catch(e){} };
  const bad = () => { S.gen++; try { ws.close(); } catch(e){} setStatus('sErr', t('badSymbol')); };
  ws.onopen = () => {
    if (gen !== S.gen) return;
    send({op:'subscribe', req_id:'ob1000', args:['orderbook.1000.' + sym]});
    send({op:'subscribe', req_id:'tr', args:['publicTrade.' + sym]});
    ping = setInterval(() => send({op:'ping'}), 18000);
  };
  ws.onmessage = ev => {
    if (gen !== S.gen) return;
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.op === 'subscribe') {
      if (m.success === false) {
        // deeper book is not available for every pair: fall back to 200 levels
        if (m.req_id === 'ob1000') send({op:'subscribe', req_id:'ob200', args:['orderbook.200.' + sym]});
        else bad();
      }
      return;
    }
    if (!m.topic || !m.data) return;
    if (m.topic.startsWith('orderbook.')) {
      const d = m.data;
      if (m.type === 'snapshot' || d.u === 1) { S.bids.clear(); S.asks.clear(); }
      applySide(d.b || [], S.bids); applySide(d.a || [], S.asks);
      S.synced = true; S.firstApplied = true;
      if (!S.live) { S.live = true; setStatus('sLive'); }
    } else if (m.topic.startsWith('publicTrade.')) {
      for (const tr of m.data) handleTrade(+tr.p, +tr.v, tr.S === 'Sell');
    }
  };
  ws.onclose = () => {
    clearInterval(ping);
    if (gen !== S.gen) return;
    setStatus('sRe');
    setTimeout(() => { if (gen === S.gen) connect(sym); }, 3000);
  };
}
async function loadSnapshot(gen, sym){
  try {
    const r = await fetch('https://api.binance.com/api/v3/depth?symbol=' + sym + '&limit=5000');
    if (gen !== S.gen) return;
    if (r.status === 400) { S.gen++; try { S.ws.close(); } catch(e){} setStatus('sErr', t('badSymbol')); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const snap = await r.json();
    if (gen !== S.gen) return;
    S.bids.clear(); S.asks.clear();
    for (const [p,q] of snap.bids) S.bids.set(+p, +q);
    for (const [p,q] of snap.asks) S.asks.set(+p, +q);
    S.lastU = snap.lastUpdateId;
    S.synced = true; S.firstApplied = false; S.resyncing = false;
    const buf = S.buffer; S.buffer = [];
    for (const e of buf) onDepth(e);
    S.live = true;
    setStatus('sLive');
  } catch (e) {
    if (gen !== S.gen) return;
    setStatus('sErr', e.message);
    setTimeout(() => { if (gen === S.gen) loadSnapshot(gen, sym); }, 5000);
  }
}
function resync(){
  if (S.resyncing) return;
  S.resyncing = true; S.synced = false; S.buffer = [];
  loadSnapshot(S.gen, S.symbol);
}
function applySide(levels, map){
  for (const [p,q] of levels) { const qq = +q; if (qq === 0) map.delete(+p); else map.set(+p, qq); }
}
function onDepth(e){
  if (!S.synced) { if (S.buffer.length < 5000) S.buffer.push(e); return; }
  if (e.u <= S.lastU) return;
  if (!S.firstApplied) {
    if (e.U > S.lastU + 1) { resync(); return; }
    S.firstApplied = true;
  } else if (e.U !== S.lastU + 1) { resync(); return; }
  applySide(e.b, S.bids); applySide(e.a, S.asks);
  S.lastU = e.u;
}

/* ---------- trades ---------- */
function handleTrade(p, q, isSell){
  const n = p * q;
  const side = isSell ? 'sell' : 'buy'; // the aggressor's side
  S.cvd += side === 'buy' ? n : -n;
  S.tradeN.push(n); if (S.tradeN.length > 800) S.tradeN.shift();
  if (++S.tradeCount % 50 === 0 || S.tradeN.length < 60) S.tradeMedian = median(S.tradeN);
  if (S.tradeN.length >= 60 && n >= cfg.whaleFactor * S.tradeMedian && n >= cfg.minNotional) {
    S.cvdWhale += side === 'buy' ? n : -n;
    S.whaleDots.push({t:Date.now(), p, n, side});
    addEvent(side === 'buy' ? 'whaleBuy' : 'whaleSell', p, n);
  }
  if (S.bs) {
    const k = Math.floor(p / S.bs);
    const w = S.walls.get((side === 'sell' ? 'b:' : 'a:') + k);
    if (w) w.filled += n;
  }
}

/* ---------- events + stats ---------- */
function addEvent(type, price, size){
  const ev = {type, t:Date.now(), price, size, p0:S.mid || price, m1:null, m5:null};
  S.events.unshift(ev); if (S.events.length > 150) S.events.pop();
  S.pending.push(ev);
  S.stats[type].n++;
  S.dirty = true;
}
function settleEvents(now){
  if (!S.mid) return;
  const keep = [];
  for (const ev of S.pending) {
    const st = S.stats[ev.type], exp = EXPECT[ev.type];
    if (ev.m1 === null && now - ev.t >= 60000) {
      ev.m1 = (S.mid - ev.p0) / ev.p0 * 100;
      st.n1++; st.s1 += ev.m1; if (Math.sign(ev.m1) === exp) st.h1++;
      S.dirty = true;
    }
    if (ev.m5 === null && now - ev.t >= 300000) {
      ev.m5 = (S.mid - ev.p0) / ev.p0 * 100;
      st.n5++; st.s5 += ev.m5; if (Math.sign(ev.m5) === exp) st.h5++;
      S.dirty = true;
    }
    if (ev.m5 === null) keep.push(ev);
  }
  S.pending = keep;
}

/* ---------- analysis tick ---------- */
function tick(){
  const now = Date.now();
  if (!S.live || !S.bids.size || !S.asks.size) { render(); return; }
  let bb = -Infinity, ba = Infinity, minB = Infinity, maxA = -Infinity;
  for (const p of S.bids.keys()) { if (p > bb) bb = p; if (p < minB) minB = p; }
  for (const p of S.asks.keys()) { if (p < ba) ba = p; if (p > maxA) maxA = p; }
  if (!isFinite(bb) || !isFinite(ba)) return;
  const mid = (bb + ba) / 2;
  S.mid = mid; S.bestBid = bb; S.bestAsk = ba;
  S.coverage = Math.min((mid - minB) / mid, (maxA - mid) / mid) * 100;
  if (!S.bs) S.bs = mid * cfg.group / 100;
  S.priceHist.push({t:now, p:mid});
  while (S.priceHist.length && S.priceHist[0].t < now - 15*60000) S.priceHist.shift();
  while (S.whaleDots.length && S.whaleDots[0].t < now - 15*60000) S.whaleDots.shift();

  const lo = mid * (1 - cfg.range/100), hi = mid * (1 + cfg.range/100);
  const bidB = new Map(), askB = new Map();
  let b1=0, b3=0, a1=0, a3=0;
  const add = (map, k, p, n) => { const x = map.get(k); if (x) { x.n += n; x.pn += p*n; } else map.set(k, {n, pn:p*n}); };
  for (const [p,q] of S.bids) {
    const n = p*q, d = (mid - p) / mid;
    if (d <= 0.01) b1 += n; if (d <= 0.03) b3 += n;
    if (p >= lo) add(bidB, Math.floor(p / S.bs), p, n);
  }
  for (const [p,q] of S.asks) {
    const n = p*q, d = (p - mid) / mid;
    if (d <= 0.01) a1 += n; if (d <= 0.03) a3 += n;
    if (p <= hi) add(askB, Math.floor(p / S.bs), p, n);
  }
  S.p1 = {b:b1, a:a1}; S.p3 = {b:b3, a:a3};

  const all = [];
  bidB.forEach(x => all.push(x.n)); askB.forEach(x => all.push(x.n));
  if (all.length < 6) { settleEvents(now); render(); return; }
  const thr = Math.max(cfg.factor * median(all), cfg.minNotional);
  S.thr = thr;
  const warm = now - S.startTime > 8000;
  const seen = new Set();

  const scan = (buckets, side) => {
    buckets.forEach((b, k) => {
      if (b.n < thr) return;
      const id = side + ':' + k;
      seen.add(id);
      const price = b.pn / b.n;
      let w = S.walls.get(id);
      if (!w) {
        w = {id, side, key:k, price, n:b.n, peak:b.n, filled:0, miss:0, t0:now, t1:null, outcome:null};
        S.walls.set(id, w); S.wallHist.push(w);
        if (warm) addEvent(side === 'b' ? 'bidAppear' : 'askAppear', price, b.n);
      } else {
        w.n = b.n; w.price = price; w.miss = 0; if (b.n > w.peak) w.peak = b.n;
      }
    });
  };
  scan(bidB, 'b'); scan(askB, 'a');

  for (const [id, w] of S.walls) {
    if (seen.has(id)) continue;
    const buckets = w.side === 'b' ? bidB : askB;
    const b = buckets.get(w.key);
    const outOfRange = w.price < lo || w.price > hi;
    if (outOfRange) { w.t1 = now; w.outcome = 'away'; S.walls.delete(id); continue; }
    if (b && b.n >= 0.5 * thr) { w.n = b.n; w.miss = 0; continue; }
    if (++w.miss < 2) { w.n = b ? b.n : 0; continue; }
    const crossed = w.side === 'b' ? bb < w.key * S.bs : ba > (w.key + 1) * S.bs;
    const eaten = crossed || w.filled >= 0.5 * w.peak;
    w.t1 = now; w.outcome = eaten ? 'eaten' : 'pulled';
    S.walls.delete(id);
    addEvent((w.side === 'b' ? 'bid' : 'ask') + (eaten ? 'Eaten' : 'Pulled'), w.price, w.peak);
  }
  S.wallHist = S.wallHist.filter(w => !w.t1 || w.t1 > now - 15*60000);

  settleEvents(now);
  render();
}

/* ---------- rendering ---------- */
function setBar(id, tid, aid, x){
  const tot = x.b + x.a, sh = tot ? x.b / tot * 100 : 50;
  $(id).style.width = sh + '%';
  $(tid).textContent = t('buyers') + ' ' + sh.toFixed(0) + '% (' + fmtN(x.b) + ')';
  $(aid).textContent = '(' + fmtN(x.a) + ') ' + (100 - sh).toFixed(0) + '% ' + t('sellers');
}
function render(force){
  setBar('b1','b1t','a1t', S.p1);
  setBar('b3','b3t','a3t', S.p3);
  const q = S.quote ? ' ' + S.quote : '';
  const cv = $('cvdAll'), cw = $('cvdWhale');
  cv.textContent = (S.cvd > 0 ? '+' : '') + fmtN(S.cvd) + q; cv.className = S.cvd >= 0 ? 'pos' : 'neg';
  cw.textContent = (S.cvdWhale > 0 ? '+' : '') + fmtN(S.cvdWhale) + q; cw.className = S.cvdWhale >= 0 ? 'pos' : 'neg';
  $('coverage').textContent = S.mid ? t('coverage').replace('{x}', S.coverage.toFixed(2)).replace('{r}', String(cfg.range)) : '';
  renderWalls();
  if (S.dirty || force) { renderFeed(); renderStats(); S.dirty = false; }
  drawChart();
}
function renderWalls(){
  const now = Date.now();
  const list = [...S.walls.values()];
  const top = list.reduce((m, w) => w.n > m ? w.n : m, 0);
  const row = w => {
    const d = (w.price - S.mid) / S.mid * 100;
    const f = w.peak ? Math.min(100, w.filled / w.peak * 100) : 0;
    return '<div class="w' + (w.n === top ? ' top' : '') + '"><span class="p">' + fmtP(w.price) + '</span>' +
      '<span class="n">' + fmtN(w.n) + (S.quote ? ' ' + S.quote : '') + '</span>' +
      '<span class="m">' + fmtPct(d) + ' ' + t('dist') + ', ' + t('age') + ' ' + fmtAge(now - w.t0) + '</span>' +
      '<span class="m" style="text-align:right">' + t('filled') + ' ' + f.toFixed(0) + '%</span></div>';
  };
  const bids = list.filter(w => w.side === 'b').sort((a,b) => b.price - a.price);
  const asks = list.filter(w => w.side === 'a').sort((a,b) => a.price - b.price);
  const empty = '<p class="empty">' + esc(t('noWalls')) + '</p>';
  $('bidList').innerHTML = bids.length ? bids.map(row).join('') : empty;
  $('askList').innerHTML = asks.length ? asks.map(row).join('') : empty;
}
function renderFeed(){
  if (!S.events.length) { $('feed').innerHTML = '<p class="empty">' + esc(t('noEvents')) + '</p>'; return; }
  $('feed').innerHTML = S.events.slice(0, 60).map(ev => {
    const up = EXPECT[ev.type] > 0;
    let mv = '';
    if (ev.m1 !== null) mv = t('after') + ': 1 ' + t('min') + ' ' + fmtPct(ev.m1) + (ev.m5 !== null ? ', 5 ' + t('min') + ' ' + fmtPct(ev.m5) : '');
    return '<div class="ev"><span class="tm">' + fmtTime(ev.t) + '</span>' +
      '<span class="ty ' + (up ? 'pos' : 'neg') + '">' + esc(t(ev.type)) + ' ' + fmtP(ev.price) + '</span>' +
      '<span class="sz">' + fmtN(ev.size) + (S.quote ? ' ' + S.quote : '') + '</span>' +
      (mv ? '<span class="mv">' + mv + '</span>' : '') + '</div>';
  }).join('');
}
function renderStats(){
  $('stats').innerHTML = TYPES.map(ty => {
    const s = S.stats[ty] || {n:0,n1:0,n5:0};
    const a1 = s.n1 ? s.s1 / s.n1 : null, a5 = s.n5 ? s.s5 / s.n5 : null;
    const hit = s.n5 ? s.h5 / s.n5 * 100 : s.n1 ? s.h1 / s.n1 * 100 : null;
    const cls = v => v === null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
    return '<tr><td>' + esc(t(ty)) + '</td><td>' + (s.n || 0) + '</td>' +
      '<td class="' + cls(a1) + '">' + fmtPct(a1, 3) + '</td>' +
      '<td class="' + cls(a5) + '">' + fmtPct(a5, 3) + '</td>' +
      '<td>' + (hit === null ? '—' : hit.toFixed(0) + '%') + '</td></tr>';
  }).join('');
}

const cv = $('chart');
function drawChart(){
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)) { cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const ink = C('--ink'), muted = C('--muted'), line = C('--line'), bid = C('--bid'), ask = C('--ask'), surf = C('--surface');
  ctx.font = '12px Archivo, system-ui, sans-serif';
  const ph = S.priceHist;
  if (ph.length < 2) { ctx.fillStyle = muted; ctx.fillText(t('wait'), 14, 24); return; }

  const now = Date.now(), t0 = now - 15*60000;
  let pmin = Infinity, pmax = -Infinity;
  for (const x of ph) { if (x.p < pmin) pmin = x.p; if (x.p > pmax) pmax = x.p; }
  const mid = S.mid;
  for (const w of S.walls.values()) {
    if (Math.abs(w.price - mid) / mid < 0.01) { pmin = Math.min(pmin, w.price); pmax = Math.max(pmax, w.price); }
  }
  const minSpan = mid * 0.004;
  if (pmax - pmin < minSpan) { const c = (pmax + pmin) / 2; pmin = c - minSpan/2; pmax = c + minSpan/2; }
  const pad = (pmax - pmin) * 0.08; pmin -= pad; pmax += pad;

  const L = 8, R = 74, T = 10, B = 24, cw = W - L - R, chh = H - T - B;
  const X = ts => L + (ts - t0) / (now - t0) * cw;
  const Y = p => T + (pmax - p) / (pmax - pmin) * chh;

  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = muted;
  for (let i = 0; i <= 4; i++) {
    const p = pmin + (pmax - pmin) * i / 4, y = Y(p);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + cw, y); ctx.stroke();
    ctx.fillText(fmtP(p), L + cw + 6, y + 4);
  }
  for (let m = 15; m >= 0; m -= 5) {
    const x = X(now - m*60000);
    ctx.fillText(m ? '−' + m + ' ' + t('min') : t('now'), Math.min(x, L + cw - 30), H - 6);
  }

  const walls = S.wallHist.filter(w => w.outcome !== 'away' || (w.t1 && w.t1 > t0));
  const maxPeak = walls.reduce((m, w) => Math.max(m, w.peak), 1);
  for (const w of walls) {
    const end = w.t1 || now;
    if (end < t0 || w.price < pmin || w.price > pmax) continue;
    const col = w.side === 'b' ? bid : ask;
    const th = 2 + 12 * Math.sqrt(w.peak / maxPeak);
    const x1 = X(Math.max(w.t0, t0)), x2 = X(end), y = Y(w.price);
    ctx.globalAlpha = w.t1 ? 0.35 : 0.55;
    ctx.fillStyle = col;
    ctx.fillRect(x1, y - th/2, Math.max(2, x2 - x1), th);
    ctx.globalAlpha = 1;
    if (w.outcome === 'eaten') {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x2, y, 4.5, 0, Math.PI*2); ctx.fill();
    } else if (w.outcome === 'pulled') {
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x2-4, y-4); ctx.lineTo(x2+4, y+4); ctx.moveTo(x2+4, y-4); ctx.lineTo(x2-4, y+4); ctx.stroke();
    }
  }

  ctx.strokeStyle = ink; ctx.lineWidth = 1.6; ctx.beginPath();
  ph.forEach((x, i) => { const px = X(x.t), py = Y(x.p); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.stroke();

  const maxN = S.whaleDots.reduce((m, d) => Math.max(m, d.n), 1);
  for (const d of S.whaleDots) {
    if (d.p < pmin || d.p > pmax) continue;
    const r = 3 + 9 * Math.sqrt(d.n / maxN);
    ctx.globalAlpha = 0.85; ctx.fillStyle = d.side === 'buy' ? bid : ask;
    ctx.beginPath(); ctx.arc(X(d.t), Y(d.p), r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = surf; ctx.lineWidth = 1; ctx.stroke();
  }

  const yl = Y(mid);
  ctx.fillStyle = ink; ctx.fillRect(L + cw + 2, yl - 9, R - 4, 18);
  ctx.fillStyle = surf; ctx.font = '600 12px Archivo, system-ui, sans-serif';
  ctx.fillText(fmtP(mid), L + cw + 6, yl + 4);
}

/* ---------- market scanner: abnormal activity and volume ---------- */
const DIRS = ['bull','bear','mixed'];
const SC = {gen:0, on:false, wss:[], syms:new Map(), list:[], loaded:0, signals:[], pending:[], stats:{}, dirty:true, statusKey:'scIdle', statusArgs:{}};
DIRS.forEach(d => SC.stats[d] = {n:0, s5:0, n5:0, h5:0, s15:0, n15:0, h15:0});
const tickerCache = {};
async function getTickers(ex){
  if (tickerCache[ex]) return tickerCache[ex];
  let list;
  if (ex === 'bybit') {
    const j = await (await fetch('https://api.bybit.com/v5/market/tickers?category=spot')).json();
    list = ((j.result && j.result.list) || []).map(x => ({symbol:x.symbol, qv:+x.turnover24h, active:+x.turnover24h > 0}));
  } else {
    const arr = await (await fetch('https://api.binance.com/api/v3/ticker/24hr')).json();
    list = arr.map(x => ({symbol:x.symbol, qv:+x.quoteVolume, active:+x.count > 0 && +x.quoteVolume > 0}));
  }
  tickerCache[ex] = list;
  return list;
}
async function fetchBase(s){
  if (cfg.ex === 'bybit') {
    const j = await (await fetch('https://api.bybit.com/v5/market/kline?category=spot&symbol=' + s + '&interval=1&limit=61')).json();
    const l = ((j.result && j.result.list) || []).slice().reverse(); // Bybit returns newest first
    return l.map(k => ({t:+k[0], o:+k[1], c:+k[4], q:+k[6], n:null, Q:null, qt:0}));
  }
  const r = await fetch('https://api.binance.com/api/v3/klines?symbol=' + s + '&interval=1m&limit=61');
  if (!r.ok) return [];
  return (await r.json()).map(toCandle);
}
function scCloseAll(){
  (SC.wss || []).forEach(w => { try { w.close(); } catch(e){} });
  SC.wss = [];
}
function scResetStats(){
  SC.signals = []; SC.pending = []; SC.dirty = true;
  DIRS.forEach(d => SC.stats[d] = {n:0, s5:0, n5:0, h5:0, s15:0, n15:0, h15:0});
}
const fx = v => v === null || v === undefined ? '—' : '×' + v.toFixed(1);

function scStatus(key, args){
  SC.statusKey = key; SC.statusArgs = args || {};
  let s = t(key);
  for (const k in SC.statusArgs) s = s.replace('{' + k + '}', SC.statusArgs[k]);
  $('scStatus').textContent = s;
  $('scDot').className = 'dot' + (key === 'scLive' ? ' live' : key === 'scErr' ? ' err' : '');
  $('scBtn').textContent = t(SC.on ? 'scanStop' : 'scanStart');
  $('scBtn').className = SC.on ? '' : 'primary';
}
const toCandle = k => ({t:k[0], o:+k[1], c:+k[4], q:+k[7], n:+k[8], Q:+k[10], qt:+k[7]});
function recalc(d){
  const h = d.hist;
  d.medQ = median(h.map(x => x.q));
  const ns = h.filter(x => x.n !== null).map(x => x.n);
  d.medN = ns.length >= 10 ? median(ns) : 0;
}
async function scanStart(){
  const gen = ++SC.gen;
  scCloseAll();
  SC.on = true; cfg.scOn = true; store.set('ws_cfg', JSON.stringify(cfg));
  SC.syms.clear(); SC.loaded = 0;
  scStatus('scList');
  try {
    const tick = await getTickers(cfg.ex);
    if (gen !== SC.gen) return;
    const q = cfg.scQuote;
    SC.list = tick
      .filter(x => x.active && quoteOf(x.symbol) === q)
      .sort((a,b) => b.qv - a.qv)
      .slice(0, cfg.scCount).map(x => x.symbol);
    if (!SC.list.length) throw new Error('empty');
    let idx = 0;
    const worker = async () => {
      while (idx < SC.list.length && gen === SC.gen) {
        const s = SC.list[idx++];
        try {
          const c = await fetchBase(s);
          if (c.length > 21) {
            const d = {sym:s, hist:c.slice(0, -1), cur:c[c.length-1], last:c[c.length-1].c, m:null, lastSig:0, lastSigX:0, acc:{t:0, n:0, Q:0, q:0}};
            recalc(d); SC.syms.set(s, d);
          }
        } catch(e){}
        SC.loaded++;
        if (gen === SC.gen) scStatus('scBase', {a:SC.loaded, b:SC.list.length});
      }
    };
    await Promise.all(Array.from({length:8}, worker));
    if (gen !== SC.gen) return;
    scConnect(gen);
  } catch(e) {
    if (gen !== SC.gen) return;
    SC.on = false; scStatus('scErr');
  }
}
function scConnect(gen){
  if (cfg.ex === 'bybit') {
    const syms = [...SC.syms.keys()];
    for (let i = 0; i < syms.length; i += 100) scConnectBybit(gen, syms.slice(i, i + 100));
    return;
  }
  const ws = new WebSocket('wss://stream.binance.com:9443/stream');
  SC.wss.push(ws);
  ws.onopen = async () => {
    const streams = [...SC.syms.keys()].map(s => s.toLowerCase() + '@kline_1m');
    for (let i = 0; i < streams.length; i += 100) {
      if (gen !== SC.gen || ws.readyState !== 1) return;
      ws.send(JSON.stringify({method:'SUBSCRIBE', params:streams.slice(i, i + 100), id:i + 1}));
      await new Promise(r => setTimeout(r, 400));
    }
    if (gen === SC.gen) scStatus('scLive', {n:SC.syms.size});
  };
  ws.onmessage = ev => {
    if (gen !== SC.gen) return;
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.data && m.data.k) onKline(m.data.k);
  };
  ws.onclose = () => {
    if (gen !== SC.gen) return;
    scStatus('scRe');
    setTimeout(() => { if (gen === SC.gen) scConnect(gen); }, 3000);
  };
}
function scanStop(){
  SC.gen++; SC.on = false; cfg.scOn = false; store.set('ws_cfg', JSON.stringify(cfg));
  scCloseAll();
  scStatus('scIdle');
}
function scConnectBybit(gen, syms){
  const ws = new WebSocket('wss://stream.bybit.com/v5/public/spot');
  SC.wss.push(ws);
  let ping = null;
  ws.onopen = async () => {
    ping = setInterval(() => { try { ws.send('{"op":"ping"}'); } catch(e){} }, 18000);
    const topics = [];
    syms.forEach(s => topics.push('kline.1.' + s, 'publicTrade.' + s));
    for (let i = 0; i < topics.length; i += 10) {
      if (gen !== SC.gen || ws.readyState !== 1) return;
      ws.send(JSON.stringify({op:'subscribe', args:topics.slice(i, i + 10)}));
      await new Promise(r => setTimeout(r, 120));
    }
    if (gen === SC.gen) scStatus('scLive', {n:SC.syms.size});
  };
  ws.onmessage = ev => {
    if (gen !== SC.gen) return;
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (!m.topic || !m.data) return;
    if (m.topic.startsWith('publicTrade.')) { for (const tr of m.data) onBybitTrade(tr); }
    else if (m.topic.startsWith('kline.')) { const sym = m.topic.slice(8); for (const k of m.data) onBybitKline(sym, k); }
  };
  ws.onclose = () => {
    clearInterval(ping);
    if (gen !== SC.gen) return;
    scStatus('scRe');
    setTimeout(() => { if (gen === SC.gen) scConnectBybit(gen, syms); }, 3000);
  };
}
// Bybit klines have no trade count or taker-buy volume, so we count them from the live trade stream
function onBybitTrade(tr){
  const d = SC.syms.get(tr.s); if (!d) return;
  const T = +tr.T, mt = T - T % 60000;
  if (mt < d.acc.t) return;
  if (mt > d.acc.t) d.acc = {t:mt, n:0, Q:0, q:0};
  const v = +tr.p * +tr.v;
  d.acc.n++; d.acc.q += v; if (tr.S === 'Buy') d.acc.Q += v;
}
function onBybitKline(sym, k){
  const d = SC.syms.get(sym); if (!d) return;
  const t = +k.start, a = d.acc.t === t ? d.acc : {n:0, Q:0, q:0};
  applyCandle(d, {t, o:+k.open, c:+k.close, q:+k.turnover, n:a.n, Q:a.Q, qt:a.q});
}
function onKline(k){
  const d = SC.syms.get(k.s); if (!d) return;
  applyCandle(d, {t:k.t, o:+k.o, c:+k.c, q:+k.q, n:+k.n, Q:+k.Q, qt:+k.q});
}
function applyCandle(d, c){
  if (c.t > d.cur.t) { d.hist.push(d.cur); if (d.hist.length > 60) d.hist.shift(); recalc(d); }
  else if (c.t < d.cur.t) return;
  d.cur = c; d.last = c.c;
  evaluate(d);
}
function evaluate(d){
  if (!d.medQ || d.hist.length < 20) return;
  const cur = d.cur, last4 = d.hist.slice(-4);
  const volX = cur.q / d.medQ;
  const trX = d.medN ? cur.n / d.medN : null;
  const q5 = last4.reduce((s, x) => s + x.q, 0) + cur.q;
  const n5 = last4.reduce((s, x) => s + (x.n || 0), 0) + cur.n;
  const vol5X = q5 / (5 * d.medQ);
  const tr5X = d.medN ? n5 / (5 * d.medN) : null;
  const ret1 = (cur.c - cur.o) / cur.o * 100;
  const o5 = last4.length ? last4[0].o : cur.o;
  const ret5 = (cur.c - o5) / o5 * 100;
  const buy = cur.qt ? cur.Q / cur.qt * 100 : 50;
  const qt5 = last4.reduce((s, x) => s + (x.qt || 0), 0) + cur.qt;
  const buy5 = qt5 ? (last4.reduce((s, x) => s + (x.Q || 0), 0) + cur.Q) / qt5 * 100 : 50;
  d.m = {volX, trX, vol5X, ret1, ret5, buy, score:Math.max(volX, vol5X * 1.5)};

  const minQ = sigMin();
  const spike = cur.q >= minQ && volX >= cfg.sigVol && (trX === null || trX >= cfg.sigTrades);
  const flow = !spike && q5 >= 5 * minQ && vol5X >= cfg.sigVol * 0.6 && (tr5X === null || tr5X >= cfg.sigTrades * 0.6);
  if (!spike && !flow) return;
  const now = Date.now(), x = spike ? volX : vol5X;
  if (now - d.lastSig < 10*60000 && x < d.lastSigX * 2) return;
  d.lastSig = now; d.lastSigX = x;
  const r = spike ? ret1 : ret5, b = spike ? buy : buy5;
  const dir = b >= 60 && r >= 0 ? 'bull' : b <= 40 && r <= 0 ? 'bear' : 'mixed';
  const sg = {sym:d.sym, t:now, p0:cur.c, dir, kind:spike ? 'spike' : 'flow', x, trX:spike ? trX : tr5X, r, buy:b, m5:null, m15:null};
  SC.signals.unshift(sg); if (SC.signals.length > 120) SC.signals.pop();
  SC.pending.push(sg); SC.stats[dir].n++; SC.dirty = true;
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('warning'); } catch(e){} }
}
function scSettle(){
  const now = Date.now(), keep = [];
  for (const sg of SC.pending) {
    const d = SC.syms.get(sg.sym), st = SC.stats[sg.dir];
    if (!d) continue;
    const mv = (d.last - sg.p0) / sg.p0 * 100, exp = sg.dir === 'bull' ? 1 : sg.dir === 'bear' ? -1 : 0;
    if (sg.m5 === null && now - sg.t >= 5*60000) { sg.m5 = mv; st.n5++; st.s5 += mv; if (exp && Math.sign(mv) === exp) st.h5++; SC.dirty = true; }
    if (sg.m15 === null && now - sg.t >= 15*60000) { sg.m15 = mv; st.n15++; st.s15 += mv; if (exp && Math.sign(mv) === exp) st.h15++; SC.dirty = true; }
    if (sg.m15 === null) keep.push(sg);
  }
  SC.pending = keep;
}
function scRender(force){
  const minQ = sigMin();
  const hot = [...SC.syms.values()].filter(d => d.m && d.cur.q >= minQ / 3)
    .sort((a, b) => b.m.score - a.m.score).slice(0, 8);
  $('hotList').innerHTML = hot.length ? hot.map(d =>
    '<button class="sg" data-sym="' + esc(d.sym) + '"><span class="s">' + esc(d.sym) + '</span>' +
    '<span class="x">×' + d.m.volX.toFixed(1) + '</span>' +
    '<span class="m">' + t('trX') + ' ' + fx(d.m.trX) + ', ' + t('buyShare') + ' ' + d.m.buy.toFixed(0) + '%</span>' +
    '<span class="m r ' + (d.m.ret1 >= 0 ? 'pos' : 'neg') + '">' + fmtPct(d.m.ret1) + '</span></button>').join('')
    : '<p class="empty">' + esc(t(SC.on ? 'noHot' : 'scIdle')) + '</p>';
  if (!SC.dirty && !force) return;
  SC.dirty = false;
  $('sigList').innerHTML = SC.signals.length ? SC.signals.slice(0, 50).map(sg => {
    const cls = sg.dir === 'bull' ? 'pos' : sg.dir === 'bear' ? 'neg' : '';
    let after = '';
    if (sg.m5 !== null) after = t('after') + ': 5 ' + t('min') + ' ' + fmtPct(sg.m5) + (sg.m15 !== null ? ', 15 ' + t('min') + ' ' + fmtPct(sg.m15) : '');
    return '<button class="sg" data-sym="' + esc(sg.sym) + '"><span class="s">' + esc(sg.sym) + ' <span class="m">' + fmtTime(sg.t) + '</span></span>' +
      '<span class="x">×' + sg.x.toFixed(1) + '</span>' +
      '<span class="d ' + cls + '">' + esc(t(sg.dir)) + '</span>' +
      '<span class="m r">' + fmtPct(sg.r) + '</span>' +
      '<span class="m" style="grid-column:1 / 3">' + esc(t(sg.kind)) + ', ' + t('trX') + ' ' + fx(sg.trX) + ', ' + t('buyShare') + ' ' + sg.buy.toFixed(0) + '%, ' + fmtP(sg.p0) +
      (after ? '. ' + after : '') + '</span></button>';
  }).join('') : '<p class="empty">' + esc(t('noSignals')) + '</p>';
  $('sigStats').innerHTML = DIRS.map(dr => {
    const s = SC.stats[dr];
    const a5 = s.n5 ? s.s5 / s.n5 : null, a15 = s.n15 ? s.s15 / s.n15 : null;
    const hit = dr === 'mixed' ? null : s.n15 ? s.h15 / s.n15 * 100 : s.n5 ? s.h5 / s.n5 * 100 : null;
    const cls = v => v === null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
    return '<tr><td>' + esc(t(dr)) + '</td><td>' + s.n + '</td><td class="' + cls(a5) + '">' + fmtPct(a5, 3) +
      '</td><td class="' + cls(a15) + '">' + fmtPct(a15, 3) + '</td><td>' + (hit === null ? '—' : hit.toFixed(0) + '%') + '</td></tr>';
  }).join('');
}
function openSymbol(sym){
  $('sym').value = sym;
  startSession(sym);
  $('pressureSec').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

/* ---------- settings ---------- */
function fillSettings(){
  $('cRange').value = cfg.range; $('cGroup').value = cfg.group; $('cFactor').value = cfg.factor;
  $('cWhale').value = cfg.whaleFactor; $('cMin').value = cfg.minNotional;
  $('cSigVol').value = cfg.sigVol; $('cSigTr').value = cfg.sigTrades;
  $('cSigMin').value = sigMin();
  $('sigMinLbl').textContent = t('sigMin').replace('{q}', cfg.scQuote);
}
function sigMin(){
  const v = cfg.sigMin && cfg.sigMin[cfg.scQuote];
  return typeof v === 'number' ? v : (SIGMIN_DEFAULT[cfg.scQuote] || 0);
}
function applySettings(){
  const num = (id, d) => { const v = parseFloat($(id).value); return isFinite(v) && v >= 0 ? v : d; };
  cfg.range = Math.min(20, Math.max(0.2, num('cRange', cfg.range)));
  cfg.group = Math.min(2, Math.max(0.01, num('cGroup', cfg.group)));
  cfg.factor = Math.max(2, num('cFactor', cfg.factor));
  cfg.whaleFactor = Math.max(3, num('cWhale', cfg.whaleFactor));
  cfg.minNotional = num('cMin', cfg.minNotional);
  cfg.sigVol = Math.max(1.5, num('cSigVol', cfg.sigVol));
  cfg.sigTrades = Math.max(1, num('cSigTr', cfg.sigTrades));
  cfg.sigMin = Object.assign({}, SIGMIN_DEFAULT, cfg.sigMin || {});
  cfg.sigMin[cfg.scQuote] = num('cSigMin', sigMin());
  store.set('ws_cfg', JSON.stringify(cfg));
  fillSettings();
  S.bs = 0; S.walls.clear(); S.wallHist = []; S.startTime = Date.now();
  render(true);
}

/* ---------- symbols list ---------- */
async function loadSymbols(){
  try {
    const list = await getTickers(cfg.ex);
    const top = list.filter(x => x.active).sort((a,b) => b.qv - a.qv).slice(0, 600);
    $('symlist').innerHTML = top.map(x => '<option value="' + esc(x.symbol) + '"></option>').join('');
  } catch(e) { $('symlist').innerHTML = ''; }
}

/* ---------- screenshots with watermark ---------- */
const WATERMARK = 't.me/Cr_hunters';
let h2cPromise = null, shotBlob = null, shotName = '';
function loadH2C(){
  if (window.html2canvas) return Promise.resolve();
  if (!h2cPromise) h2cPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = res; sc.onerror = () => { h2cPromise = null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return h2cPromise;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function composeShot(src, withSymbol){
  const css = getComputedStyle(document.documentElement), C = k => css.getPropertyValue(k).trim();
  const k = 2, pad = 22*k, head = 74*k, foot = 58*k;
  const out = document.createElement('canvas');
  out.width = src.width + pad*2; out.height = src.height + head + foot + pad;
  const ctx = out.getContext('2d');
  ctx.fillStyle = C('--bg'); ctx.fillRect(0, 0, out.width, out.height);
  // header: title, pair, exchange and time
  ctx.fillStyle = C('--ink'); ctx.textBaseline = 'alphabetic';
  ctx.font = '800 ' + 26*k + 'px Archivo, system-ui, sans-serif';
  ctx.fillText(t('title'), pad, pad + 26*k);
  ctx.fillStyle = C('--muted'); ctx.font = '500 ' + 14*k + 'px Archivo, system-ui, sans-serif';
  const when = new Date().toLocaleString([], {hour12:false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
  ctx.fillText((withSymbol && S.symbol ? S.symbol + ', ' : '') + EX_NAME[cfg.ex] + ', ' + when, pad, pad + 50*k);
  // the captured section
  ctx.save(); roundRect(ctx, pad, head, src.width, src.height, 14*k); ctx.clip();
  ctx.drawImage(src, pad, head); ctx.restore();
  // tiled diagonal watermark over the content
  ctx.save();
  ctx.beginPath(); ctx.rect(pad, head, src.width, src.height); ctx.clip();
  ctx.globalAlpha = 0.09; ctx.fillStyle = C('--ink');
  ctx.font = '700 ' + 20*k + 'px Archivo, system-ui, sans-serif';
  const tw = ctx.measureText(WATERMARK).width + 90*k, th = 110*k;
  ctx.translate(out.width/2, head + src.height/2); ctx.rotate(-Math.PI/7);
  const span = Math.hypot(out.width, out.height);
  for (let y = -span; y < span; y += th) {
    const shift = (Math.round(y / th) % 2) * tw / 2;
    for (let x = -span; x < span; x += tw) ctx.fillText(WATERMARK, x + shift, y);
  }
  ctx.restore();
  // footer bar with the link
  const fy = head + src.height + pad*0.6;
  ctx.fillStyle = C('--ink'); roundRect(ctx, pad, fy, src.width, foot - 10*k, 12*k); ctx.fill();
  ctx.fillStyle = C('--bg'); ctx.font = '800 ' + 20*k + 'px Archivo, system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(WATERMARK, pad + 18*k, fy + (foot - 10*k)/2);
  ctx.fillStyle = C('--gold'); ctx.textAlign = 'right';
  ctx.font = '600 ' + 14*k + 'px Archivo, system-ui, sans-serif';
  ctx.fillText('Telegram', pad + src.width - 18*k, fy + (foot - 10*k)/2);
  return out;
}
async function takeShot(section, btn){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = t('shotMaking');
  try {
    await loadH2C();
    drawChart();
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
    const src = await window.html2canvas(section, {scale:2, backgroundColor:bg, useCORS:true, logging:false});
    const out = composeShot(src, !section.querySelector('#hotList'));
    shotBlob = await new Promise(r => out.toBlob(r, 'image/png'));
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    shotName = 'whale-sonar-' + (S.symbol || 'scan').toLowerCase() + '-' + stamp + '.png';
    $('shotImg').src = out.toDataURL('image/png');
    const canShare = navigator.canShare && navigator.canShare({files:[new File([shotBlob], shotName, {type:'image/png'})]});
    $('shotShare').hidden = !canShare;
    $('shotModal').hidden = false;
  } catch(e) {
    alert(t('shotFail'));
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}
function initShots(){
  document.querySelectorAll('main > section').forEach(sec => {
    if (sec.querySelector('details')) return;
    const b = document.createElement('button');
    b.className = 'shotbtn'; b.dataset.i = 'shot'; b.textContent = t('shot');
    b.setAttribute('data-html2canvas-ignore', 'true');
    b.onclick = () => takeShot(sec, b);
    sec.insertBefore(b, sec.firstChild);
  });
  $('shotClose').onclick = () => { $('shotModal').hidden = true; };
  $('shotModal').addEventListener('click', e => { if (e.target.id === 'shotModal') $('shotModal').hidden = true; });
  $('shotDl').onclick = () => {
    if (!shotBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(shotBlob); a.download = shotName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $('shotShare').onclick = async () => {
    if (!shotBlob) return;
    try { await navigator.share({files:[new File([shotBlob], shotName, {type:'image/png'})], text:WATERMARK}); } catch(e){}
  };
}

if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

$('sym').value = store.get('ws_symbol') || 'BTCUSDT';
{ const DL = window.CH ? CH.param() : {}; if (DL.coin) { if (DL.ex === 'binance' || DL.ex === 'bybit') { cfg.ex = DL.ex; store.set('ws_cfg', JSON.stringify(cfg)); } $('sym').value = DL.coin + (DL.q || 'USDT'); } }

window.addEventListener('resize', drawChart);

$('scCount').value = String(cfg.scCount);

['hotList','sigList'].forEach(id => $(id).addEventListener('click', e => {
  const b = e.target.closest('[data-sym]'); if (b) openSymbol(b.dataset.sym);
