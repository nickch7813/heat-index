<style>

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}

.sub{color:var(--muted);margin:2px 0 16px;font-size:.9rem}

.btns{display:flex;flex-wrap:wrap;gap:6px}
button,input{font:inherit;color:inherit}
.btns button,.act{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sym{font-weight:700;font-size:1.1rem}

<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div id="controls"></div>
<div class="legend"><span id="leg0"></span><span id="leg50"></span><span id="leg100"></span></div>
<div class="scale"></div>
<div id="status"></div>
<div class="searchbar"><input id="search" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
<div id="list"></div>
<footer id="footer"></footer>

<script>
// ===== Elliott Wave core (pure functions) =====
const EW = (() => {
  const fit = (x, ideals, tol) => Math.max(...ideals.map(t => Math.exp(-(((x - t) / tol) ** 2))));

  function atrPct(h, l, c) {
    const n = c.length, from = Math.max(1, n - 100);
    let s = 0;
    for (let i = from; i < n; i++)
      s += Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])) / c[i - 1];
    return s / Math.max(1, n - from);
  }

  // ZigZag over highs/lows; last pivot is the unfinished (current) leg
  function zigzag(h, l, dev) {
    const piv = [];
    let dir = 0, hiI = 0, hiP = h[0], loI = 0, loP = l[0], eI = 0, eP = 0;
    for (let i = 1; i < h.length; i++) {
      if (dir === 0) {
        if (h[i] > hiP) { hiP = h[i]; hiI = i; }
        if (l[i] < loP) { loP = l[i]; loI = i; }
        if (hiP >= loP * (1 + dev) && hiI > loI) { piv.push({ i: loI, p: loP, t: 'L' }); dir = 1; eI = hiI; eP = hiP; }
        else if (loP <= hiP * (1 - dev) && loI > hiI) { piv.push({ i: hiI, p: hiP, t: 'H' }); dir = -1; eI = loI; eP = loP; }
      } else if (dir === 1) {
        if (h[i] >= eP) { eP = h[i]; eI = i; }
        else if (l[i] <= eP * (1 - dev)) { piv.push({ i: eI, p: eP, t: 'H' }); dir = -1; eI = i; eP = l[i]; }
      } else {
        if (l[i] <= eP) { eP = l[i]; eI = i; }
        else if (h[i] >= eP * (1 + dev)) { piv.push({ i: eI, p: eP, t: 'L' }); dir = 1; eI = i; eP = h[i]; }
      }
    }
    if (dir !== 0) piv.push({ i: eI, p: eP, t: dir === 1 ? 'H' : 'L', tentative: true });
    return piv;
  }

  // v = sign-adjusted prices (bull space). Returns score 0..1 or 0 if rules broken.
  function impulseScore(v) {
    const w1 = v[1] - v[0], w2 = v[1] - v[2], w3 = v[3] - v[2], w4 = v[3] - v[4], w5 = v[5] - v[4];
    if (!(w1 > 0 && w2 > 0 && w3 > 0 && w4 > 0 && w5 > 0)) return 0;
    if (v[2] <= v[0] || v[3] <= v[1] || v[4] <= v[1] || v[5] <= v[3]) return 0; // core rules
    if (w3 < w1 && w3 < w5) return 0;                                           // wave 3 never shortest
    const s = 0.25 * fit(w2 / w1, [0.5, 0.618], 0.2) + 0.3 * fit(w3 / w1, [1.618, 2.618, 1], 0.5)
            + 0.2 * fit(w4 / w3, [0.382, 0.236, 0.5], 0.15) + 0.25 * fit(w5 / w1, [1, 0.618, 1.618], 0.35);
    return 0.4 + 0.6 * s;
  }

  // Raw index in bull space: 0 = strong buy, 100 = strong sell
  const RAW = { w2: 15, w3: 35, w4: 28, w5: 78, A: 68, B: 72, ABC: 18 };
  const NAMES = {
    w2: 'Wave 2 pullback', w3: 'Wave 3 in progress', w4: 'Wave 4 pullback', w5: 'Wave 5, late stage',
    A: 'Wave A after the top', B: 'Wave B bounce', ABC: 'ABC correction complete'
  };

  function scenarios(piv) {
    const n = piv.length, out = [];
    for (const sign of [1, -1]) {
      const startType = sign === 1 ? 'L' : 'H';
      const V = k => sign * piv[k].p;
      const add = (key, start, len, conf, target, invalid, labels) => {
        if (conf <= 0) return;
        out.push({ key, sign, conf: Math.min(1, conf), target: sign * target, invalid: sign * invalid,
          points: labels.map((lab, j) => ({ i: piv[start + j].i, p: piv[start + j].p, lab })) });
      };
      const ctxLow = s => { // wave 1 should start from a meaningful extreme
        let ok = 1;
        for (let k = Math.max(0, s - 6); k < s; k++) if (V(k) < V(s)) ok = 0.65;
        return ok;
      };
      // Wave 2 (current leg)
      if (n >= 3 && piv[n - 3].t === startType) {
        const s = n - 3, v = [V(s), V(s + 1), V(s + 2)], w1 = v[1] - v[0], r = (v[1] - v[2]) / w1;
        if (w1 > 0 && v[2] > v[0] && r >= 0.236 && r <= 0.886)
          add('w2', s, 3, (0.3 + 0.45 * fit(r, [0.5, 0.618], 0.15)) * ctxLow(s), v[2] + 1.618 * w1, v[0], ['0', '1', '2']);
      }
      // Wave 3 (current leg)
      if (n >= 4 && piv[n - 4].t === startType) {
        const s = n - 4, v = [0, 1, 2, 3].map(j => V(s + j)), w1 = v[1] - v[0], r2 = (v[1] - v[2]) / w1, e = (v[3] - v[2]) / w1;
        if (w1 > 0 && v[2] > v[0] && v[3] > v[1] && r2 >= 0.236 && r2 <= 0.886)
          add('w3', s, 4, (0.35 + 0.2 * fit(r2, [0.5, 0.618], 0.2) + 0.2 * Math.min(1, e / 1.618)) * ctxLow(s),
            v[2] + 1.618 * w1, v[2], ['0', '1', '2', '3']);
      }
      // Wave 4 (current leg)
      if (n >= 5 && piv[n - 5].t === startType) {
        const s = n - 5, v = [0, 1, 2, 3, 4].map(j => V(s + j));
        const w1 = v[1] - v[0], w3 = v[3] - v[2], r2 = (v[1] - v[2]) / w1, r4 = (v[3] - v[4]) / w3;
        if (w1 > 0 && w3 > 0 && v[2] > v[0] && v[3] > v[1] && v[4] > v[1] && r4 >= 0.146 && r4 <= 0.618)
          add('w4', s, 5, (0.35 + 0.2 * fit(r4, [0.382, 0.236], 0.12) + 0.15 * fit(r2, [0.5, 0.618], 0.2) + 0.1 * fit(w3 / w1, [1.618, 2.618], 0.5)) * ctxLow(s),
            v[4] + Math.max(w1, 0.618 * w3) * 0.9, v[1], ['0', '1', '2', '3', '4']);
      }
      // Wave 5 (current leg = full impulse)
      if (n >= 6 && piv[n - 6].t === startType) {
        const s = n - 6, v = [0, 1, 2, 3, 4, 5].map(j => V(s + j)), q = impulseScore(v);
        add('w5', s, 6, q * 0.9, v[4], v[4], ['0', '1', '2', '3', '4', '5']); // target = wave-4 area after correction
      }
      // Wave A after completed impulse
      if (n >= 7 && piv[n - 7].t === startType) {
        const s = n - 7, v = [0, 1, 2, 3, 4, 5, 6].map(j => V(s + j)), q = impulseScore(v.slice(0, 6));
        if (q && v[6] < v[5]) add('A', s, 7, q * 0.85, v[4], v[5], ['0', '1', '2', '3', '4', '5', 'A']);
      }
      // Wave B bounce
      if (n >= 8 && piv[n - 8].t === startType) {
        const s = n - 8, v = [...Array(8)].map((_, j) => V(s + j)), q = impulseScore(v.slice(0, 6));
        const a = v[5] - v[6], rb = (v[7] - v[6]) / a;
        if (q && a > 0 && v[7] < v[5] && rb > 0.2)
          add('B', s, 8, q * (0.55 + 0.3 * fit(rb, [0.5, 0.618, 0.382], 0.2)), v[7] - a, v[5], ['0', '1', '2', '3', '4', '5', 'A', 'B']);
      }
      // ABC complete (current leg = C)
      if (n >= 9 && piv[n - 9].t === startType) {
        const s = n - 9, v = [...Array(9)].map((_, j) => V(s + j)), q = impulseScore(v.slice(0, 6));
        const a = v[5] - v[6], c = v[7] - v[8], depth = (v[5] - v[8]) / (v[5] - v[0]);
        if (q && a > 0 && c > 0 && v[7] < v[5] && v[8] < v[7] && c / a >= 0.618 && c / a <= 1.786 && depth >= 0.236 && depth <= 0.886)
          add('ABC', s, 9, q * (0.45 + 0.35 * fit(c / a, [1, 1.618, 0.618], 0.3) + 0.15 * fit(depth, [0.382, 0.5, 0.618], 0.2)),
            v[5], v[8], ['0', '1', '2', '3', '4', '5', 'A', 'B', 'C']);
      }
    }
    return out;
  }

  function analyze(k, sensitivity = 3) {
    const h = k.map(x => +x[2]), l = k.map(x => +x[3]), c = k.map(x => +x[4]);
    if (c.length < 60) return null;
    const dev = Math.min(0.3, Math.max(0.012, sensitivity * atrPct(h, l, c)));
    const piv = zigzag(h, l, dev);
    const sc = scenarios(piv).sort((a, b) => b.conf - a.conf);
    const price = c[c.length - 1];
    if (!sc.length) return { price, index: 50, conf: 0, label: 'No clear wave count', trend: 0, bias: 0, piv, dev, best: null };
    const b = sc[0];
    const rawBull = RAW[b.key], blended = 50 + (rawBull - 50) * b.conf;
    const index = Math.round(b.sign === 1 ? blended : 100 - blended);
    return {
      price, index, conf: b.conf, piv, dev, best: b, alt: sc[1] || null,
      label: NAMES[b.key], trend: b.sign,
      bias: index < 40 ? 1 : index > 60 ? -1 : 0
    };
  }
  return { analyze, zigzag, impulseScore, scenarios };
})();

async function getJSON(bases, path) {
  let err;
  for (const base of bases) {
    try { const r = await fetch(base + path); if (r.ok) return await r.json(); err = new Error('HTTP ' + r.status); }
    catch (e) { err = e; }
  }
  throw err;
}

    async markets() {
      if (!this.symbols) {

        this.symbols = {};
        info.symbols.filter(x => x.status === 'TRADING' && x.isSpotTradingAllowed !== false)

      }
      const t = await getJSON(this.bases, '/api/v3/ticker/24hr');

      }
      const t = await this.v5('/v5/market/tickers?category=spot');
      return t.list.filter(x => this.symbols[x.symbol]).map(x => ({ sym: x.symbol, coin: this.symbols[x.symbol].base, quote: this.symbols[x.symbol].quote,

// ===== Heat index =====
// Modified stochastic in three horizons, 0 = oversold (growth zone), 100 = overheated.
// To use the exact numbers from the heat-index app, replace the body of heatIndex() with that app's function;
// it only has to return { short, mid, long, composite } on the 0-100 scale.
const HEAT = { short: 14, mid: 50, long: 150, smooth: 3, weights: [0.5, 0.3, 0.2] };

      for (let j = Math.max(0, i - len + 1); j <= i; j++) { hh = Math.max(hh, h[j]); ll = Math.min(ll, l[j]); }
      raw.push(hh > ll ? (c[i] - ll) / (hh - ll) * 100 : 50);

    return slow.length ? slow[slow.length - 1] : raw[raw.length - 1];

// ===== Forecast: Elliott count + heat index + higher timeframe =====

    { k: 'htf', v: x.htf ? (50 - x.htf.index) / 50 : 0, w: 0.2 }

// ===== Recommendations (reasons stored as [key, vars] so they follow the language) =====
const HTF = { '1h': '4h', '4h': '1d', '1d': '1w' };

  if (x.rev && x.rev.p !== null) R.why.push(['why.rev', { p: x.rev.p, d: [x.rev.dir > 0 ? 'rev.dirUp' : 'rev.dirDn'] }]);

let loadId = 0;

async function load() {

  const my = ++loadId, ex = EX[S.ex];
  S.rows = []; S.pairs = []; render(); setStatus(['loading']);
  try {
    const m = await ex.markets();
    const px = {}; m.forEach(x => px[x.coin + '/' + x.quote] = x.price);
    const usd = q => ['USDT', 'USDC', 'FDUSD'].includes(q) ? 1 : px[q + '/USDT'] || 0;
    const minVol = S.minVols[S.quote];
    let coins = m.filter(x => x.price > 0 && !STABLES.has(x.coin)).map(x => Object.assign(x, { volUsd: x.vol * usd(x.quote) }));
    S.pairs = (S.quote === 'ALL' ? coins : coins.filter(c => c.quote === S.quote)).slice().sort((a, b) => b.volUsd - a.volUsd);
    if (S.quote === 'ALL') {
      const best = {}; // one row per coin: the pair with the largest dollar volume
      coins.forEach(c => { if (!best[c.coin] || c.volUsd > best[c.coin].volUsd) best[c.coin] = c; });
      coins = Object.values(best).filter(c => c.volUsd >= minVol);
    } else coins = coins.filter(c => c.quote === S.quote && c.vol >= minVol);
    coins.sort((a, b) => b.volUsd - a.volUsd);
    const rows = [], queue = coins.slice(); let done = 0;
    const tf = S.tf, sens = +S.sens;
    const worker = async () => {
      while (queue.length && !S.again) {
        const c = queue.shift();
        const row = await analyzeCoin(ex, c, tf, sens);
        if (row) rows.push(row);
        done++; setStatus(['counting', { d: done, n: coins.length }]);
        if (done % 25 === 0) { S.rows = rows.slice(); render(); }
      }
    };
    await Promise.all([...Array(8)].map(worker));
    if (!S.again) {
      S.rows = rows;
      setStatus(['done', { n: rows.length, m: S.quote === 'ALL' ? ['allMarkets'] : ['q.pair', { q: S.quote }], tf: ['tf.' + tf], t: new Date().toLocaleTimeString(S.lang, { hour: '2-digit', minute: '2-digit' }) }]);

async function screenshot(x) {
  if (!x) return;
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const cv = cardImage(x);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const name = `${x.coin}-${x.quote}-${S.tf}-elliott.png`;
  const file = new File([blob], name, { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const canShare = navigator.canShare && navigator.canShare({ files: [file] });
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="sheet"><img src="${url}" alt="${esc(x.coin)}"><p>${T('shotHint')}</p>
    <div class="btns">${canShare ? `<button data-a="share">${T('share')}</button>` : ''}<a class="act" href="${url}" download="${esc(name)}">${T('download')}</a><button data-a="close">${T('close')}</button></div></div>`;
  const close = () => { m.remove(); URL.revokeObjectURL(url); };
  m.addEventListener('click', async e => {
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (e.target === m || a === 'close') close();
    if (a === 'share') { try { await navigator.share({ files: [file], title: `${x.coin} ${T('title')}` }); } catch (err) {} }
  });
  document.body.appendChild(m);
}

// ===== Events =====
const RELOAD = new Set(['ex', 'quote', 'tf', 'sens']);
const controls = document.getElementById('controls');
controls.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'refresh') return load();
  if (b.id === 'theme') {
    const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
    S.theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; save(); return render();
  }
  const g = b.dataset.g; if (!g) return;
  S[g] = b.dataset.v;
  if (g === 'ex') { S.open.clear(); if (!EX[S.ex].quotes.includes(S.quote)) S.quote = 'ALL'; }
  save(); renderUI();
  RELOAD.has(g) ? load() : render();
});
controls.addEventListener('change', e => {
  if (e.target.id !== 'minVol') return;
  S.minVols[S.quote] = Math.max(0, +e.target.value || 0); save(); load();
});
const search = document.getElementById('search');
search.addEventListener('input', () => { S.q = search.value; render(); });
search.addEventListener('keydown', e => { if (e.key === 'Escape') { search.value = ''; S.q = ''; render(); } });
const list = document.getElementById('list');
list.addEventListener('click', e => {
  if (e.target.closest('.ch-links')) return;
  const an = e.target.closest('[data-an]');
  if (an) return analyzeOnDemand(an.dataset.an, an);
  const sb = e.target.closest('[data-shot]');
  if (sb) { e.stopPropagation(); return screenshot(S.rows.find(x => x.sym === sb.dataset.shot)); }
  const c = e.target.closest('.card'); if (!c) return;
  const s = c.dataset.s; S.open.has(s) ? S.open.delete(s) : S.open.add(s); render();
});
list.addEventListener('keydown', e => { if (e.key === 'Enter') e.target.closest('.card')?.click(); });
addEventListener('resize', () => S.open.size && render());
const DL = window.CH ? CH.param() : {};
if (DL.coin) {
  if (DL.ex && EX[DL.ex]) S.ex = DL.ex;
  S.quote = DL.q && EX[S.ex].quotes.includes(DL.q) ? DL.q : 'ALL';
  S.q = DL.coin; search.value = DL.coin;
}
renderUI();
load();
setInterval(() => { if (!S.loading) load(); }, 5 * 60 * 1000);
if (DL.coin) {
  const want = x => x.coin.toUpperCase() === DL.coin && (!DL.q || x.quote === DL.q);
  let tries = 0;
  const tick = setInterval(() => {
    if (++tries > 240) return clearInterval(tick);
    if (S.loading || !S.rows.length && !(S.pairs || []).length) return;
    clearInterval(tick);
    const row = S.rows.find(want) || S.rows.find(x => x.coin.toUpperCase() === DL.coin);
    if (row) { S.open.add(row.sym); render(); return; }
    const p = (S.pairs || []).find(want) || (S.pairs || []).find(x => x.coin.toUpperCase() === DL.coin);
    if (p) analyzeOnDemand(p.sym, document.createElement('button'));
  }, 250);
}
</script>
