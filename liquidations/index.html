<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<script>(function(){var c=(new URLSearchParams(location.search).get("coin")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(c&&!location.hash)history.replaceState(null,"",location.pathname+"#"+c+(c.endsWith("USDT")?"":"USDT"));})();</script>
<style id="ch-css">
/* CRYPTO HUNTERS: the shared look of every tool.
   The colors are the ones of Heat Index (the main app), so all tools read as one product.
   Each tool maps its own variable names to these tokens in a small <style id="ch-skin"> block. */
:root{
  --ch-bg:#fff;--ch-s1:#f4f4f2;--ch-tx:#1b1f24;--ch-t2:#5f6368;--ch-t3:#8a8f96;--ch-bd:#e3e3e0;--ch-bd2:#c9c9c4;
  --ch-acb:#e6f1fb;--ch-act:#0c447c;--ch-acd:#85b7eb;--ch-ac:#378add;
  --ch-okb:#eaf3de;--ch-okt:#27500a;--ch-erb:#fcebeb;--ch-ert:#791f1f;--ch-warn:#ba7517;
  --ch-up:#1d9e75;--ch-dn:#e24b4a;--ch-upb:rgba(29,158,117,.12);--ch-dnb:rgba(226,75,74,.12);
  --ch-brand:#c9820f;--ch-w:760px;--ch-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}}
:root[data-theme=dark]{
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}

/* ---- suite bar: brand, Telegram channel and the tools ---- */
.ch-top{background:var(--ch-bg);border-bottom:0.5px solid var(--ch-bd);font:14px/1.4 var(--ch-font);color:var(--ch-tx);position:relative;z-index:3}
.ch-in{max-width:var(--ch-w);margin:0 auto;padding:0 14px}
.ch-row{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.ch-brand{display:inline-flex;align-items:center;gap:8px;color:var(--ch-tx);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.ch-brand img,.ch-logo,.ch-logo svg{width:26px;height:26px;border-radius:8px;display:block;flex:0 0 auto}
.ch-brand span b{color:var(--ch-brand);font-weight:600}
.ch-sp{flex:1}
.ch-tg{display:inline-flex;align-items:center;gap:6px;color:var(--ch-act);background:var(--ch-acb);border:0.5px solid var(--ch-acd);border-radius:14px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap;min-height:28px}
.ch-tg svg{width:15px;height:15px;flex:0 0 auto}
.ch-tg:hover{border-color:var(--ch-act)}
.ch-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.ch-nav::-webkit-scrollbar{display:none}
.ch-nav a,.ch-nav span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 10px;border-radius:8px;color:var(--ch-t2);text-decoration:none;font-size:13px}
.ch-nav a:hover{color:var(--ch-tx);background:var(--ch-s1)}
.ch-nav span{background:var(--ch-acb);color:var(--ch-act);font-weight:500}
.ch-nav svg,.ch-links svg{width:15px;height:15px;flex:0 0 auto}
.ch-top a:focus-visible,.ch-links a:focus-visible,.ch-foot a:focus-visible,.ch-cam:focus-visible,.ch-shot button:focus-visible,.ch-shot a:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:420px){.ch-brand{font-size:13px}.ch-tg span{display:none}.ch-tg{padding:4px 8px}}

/* ---- links from a coin card to the other tools ---- */
.ch-links{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font:12px/1.3 var(--ch-font)}
.ch-links>em{font-style:normal;color:var(--ch-t3);margin-right:2px}
.ch-links a{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);text-decoration:none;background:transparent;white-space:nowrap;min-height:26px}
.ch-links a:hover{border-color:var(--ch-acd);color:var(--ch-act);background:var(--ch-acb)}
.ch-links svg{width:13px;height:13px}
.ch-links:empty{display:none}

/* ---- screenshot: camera button and preview ---- */
:root .ch-cam{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--ch-bd2);background:var(--ch-bg);color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;white-space:nowrap}
:root .ch-cam:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-cam svg{width:16px;height:16px}
:root .ch-cam.ch-float{position:absolute;top:10px;right:10px;z-index:2}
.ch-shot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.5);font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-shot[hidden]{display:none}
.ch-shot .ch-pn{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ch-shot img{display:block;width:100%;height:auto;border-radius:8px;border:0.5px solid var(--ch-bd)}
.ch-shot .ch-wait{padding:36px 0;text-align:center;color:var(--ch-t2)}
.ch-shot .ch-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:root .ch-shot .ch-acts>*{flex:1 1 auto;text-align:center;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:6px 12px;font:13px/1.2 var(--ch-font);cursor:pointer;text-decoration:none;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
:root .ch-shot .ch-acts>.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-shot p{margin:8px 2px 0;font-size:12px;color:var(--ch-t3)}

/* ---- footer ---- */
.ch-foot{border-top:0.5px solid var(--ch-bd);margin-top:24px;font:12px/1.5 var(--ch-font);color:var(--ch-t3);background:var(--ch-bg)}
.ch-foot .ch-in{padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ch-foot b{color:var(--ch-t2);font-weight:600;letter-spacing:.04em}
.ch-foot a{color:var(--ch-act);text-decoration:none}
.ch-foot a:hover{text-decoration:underline}

/* ---- base skin of every tool (the class is set on the body by ch.js) ---- */
body.ch-skin{font-family:var(--ch-font)!important;font-size:14px;line-height:1.45;-webkit-font-smoothing:auto}
body.ch-skin :is(h1,h2,h3,h4,input,select,button,textarea,summary,.brand){font-family:inherit!important;font-stretch:normal!important}
body.ch-skin :is(input,select,textarea){border-width:0.5px!important}
body.ch-skin ::selection{background:var(--ch-acb);color:var(--ch-act)}

/* ---- notification log ---- */
:root .ch-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;padding:0;flex:0 0 auto}
:root .ch-bell:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-bell svg{width:17px;height:17px}
.ch-bell b{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ch-dn);color:#fff;font:600 10px/17px var(--ch-font);text-align:center;box-sizing:border-box}
.ch-bell b[hidden]{display:none}
.ch-bell:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-lock,.ch-lock body{overflow:hidden}
.ch-log{position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-log[hidden]{display:none}
.ch-lp{width:min(440px,100%);height:100%;background:var(--ch-bg);border-left:0.5px solid var(--ch-bd2);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.ch-lp>header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.ch-lp h2{flex:1;margin:0;font:500 17px/1.3 var(--ch-font)}
:root .ch-x{width:32px;height:32px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;font-size:13px}
.ch-lf{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px;border-bottom:0.5px solid var(--ch-bd)}
.ch-lf:empty{display:none}
.ch-lf::-webkit-scrollbar{display:none}
:root .ch-lf button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:28px}
:root .ch-lf button svg{width:13px;height:13px}
:root .ch-lf button[aria-pressed=true]{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-ll{flex:1;overflow:auto;padding:4px 14px 14px;overscroll-behavior:contain}
.ch-le{border-bottom:0.5px solid var(--ch-bd);padding:11px 0 11px 10px;margin-left:-10px;border-left:2px solid transparent}
.ch-le.ch-new{border-left-color:var(--ch-ac)}
.ch-lm{display:flex;align-items:center;gap:6px;color:var(--ch-t3);font-size:12px;margin-bottom:3px}
.ch-lm svg{width:14px;height:14px}
.ch-lm em{font-style:normal;color:var(--ch-act);background:var(--ch-acb);border-radius:6px;padding:0 6px;font-size:11px}
.ch-lm time{margin-left:auto;white-space:nowrap}
.ch-le>b{display:block;font-weight:500;font-size:14px}
.ch-le p{margin:2px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-lc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.ch-lc span{font-size:11px;color:var(--ch-t3);border:0.5px solid var(--ch-bd);border-radius:6px;padding:1px 6px}
.ch-lc a{margin-left:auto;font-size:12px;color:var(--ch-act);text-decoration:none;padding:3px 0}
.ch-lc a:hover{text-decoration:underline}
.ch-l0{color:var(--ch-t2);padding:28px 4px;margin:0;text-align:center}
.ch-lp>footer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:0.5px solid var(--ch-bd)}
.ch-lh{flex:1;font-size:11px;color:var(--ch-t3)}
:root .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:5px 12px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:30px}
.ch-lp :is(button,a):focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:520px){.ch-lp{width:100%;border-left:0}}

/* ---- notification panel: tabs, rules, form, settings ---- */
:root .ch-log .ch-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:0.5px solid var(--ch-bd)}
:root .ch-log .ch-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ch-t2);font:500 13px/1.2 var(--ch-font);padding:9px 6px 8px;cursor:pointer;min-height:36px}
:root .ch-log .ch-tabs button[aria-selected=true]{color:var(--ch-tx);border-bottom-color:var(--ch-ac)}
.ch-log .ch-lf{padding-top:10px}
:root .ch-log .ch-add{display:block;width:100%;margin:12px 0 6px;border:0.5px dashed var(--ch-acd);background:var(--ch-acb);color:var(--ch-act);border-radius:12px;padding:10px;font:500 14px/1.2 var(--ch-font);cursor:pointer}
.ch-rule{border-bottom:0.5px solid var(--ch-bd);padding:11px 0}
.ch-rule.ch-offr>:not(.ch-rt){opacity:.6}
.ch-rt{display:flex;align-items:center;gap:8px}
.ch-rt b{font-weight:600;font-size:15px}
.ch-rt span{color:var(--ch-t3);font-size:12px;flex:1}
.ch-rule>p{margin:3px 0 0;font-size:14px}
.ch-rule>p.ch-note{color:var(--ch-t2);font-size:13px}
.ch-lc .ch-ok{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-lc .ch-err{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}
.ch-rm{display:flex;align-items:center;gap:6px;margin-top:7px}
.ch-rm small{flex:1;color:var(--ch-t3);font-size:12px}
:root .ch-log .ch-rm button,:root .ch-log .ch-quick button,:root .ch-log .ch-fh button,:root .ch-log .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 11px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;font-weight:400}
:root .ch-log .ch-lp>footer button.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500;padding:6px 18px;font-size:13px}
.ch-sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.ch-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ch-sw i{position:absolute;inset:0;border-radius:11px;background:var(--ch-bd2);transition:background .15s}
.ch-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.ch-sw input:checked+i{background:var(--ch-ac)}
.ch-sw input:checked+i::after{transform:translateX(16px)}
.ch-sw input:focus-visible+i{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-form{display:flex;flex-direction:column;gap:10px;padding:12px 0 4px}
.ch-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ch-t2);min-width:0}
:root .ch-log .ch-form :is(input:not([type=checkbox]),select){font:14px/1.3 var(--ch-font);color:var(--ch-tx);background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;box-sizing:border-box;margin:0}
:root .ch-log .ch-form :is(input,select):focus{outline:2px solid var(--ch-acd);outline-offset:0;border-color:var(--ch-acd)}
.ch-f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ch-f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-f2>label:only-child{grid-column:1/-1}
.ch-now{font-size:13px;color:var(--ch-t2);background:var(--ch-s1);border-radius:8px;padding:7px 10px}
.ch-quick{display:flex;flex-wrap:wrap;gap:5px}
.ch-fh{margin:0;font-size:12px;color:var(--ch-t3);line-height:1.45}
.ch-ferr{margin:0;color:var(--ch-ert);background:var(--ch-erb);border-radius:8px;padding:7px 10px;font-size:13px}
.ch-ferr[hidden]{display:none}
.ch-chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:14px!important;color:var(--ch-tx)!important;cursor:pointer}
.ch-chk input{width:18px;height:18px;margin:0;accent-color:var(--ch-ac)}

/* ---- bell on a coin card ---- */
:root .ch-links .ch-al{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-acd);border-radius:14px;color:var(--ch-act);background:var(--ch-acb);font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-al svg{width:13px;height:13px}
:root .ch-links .ch-al:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}

/* ---- on-screen alerts ---- */
.ch-toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1002;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 24px));font:14px/1.4 var(--ch-font)}
.ch-toast{position:relative;background:var(--ch-bg);color:var(--ch-tx);border:0.5px solid var(--ch-bd2);border-left:3px solid var(--ch-ac);border-radius:12px;padding:10px 36px 10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:chIn .2s ease-out}
.ch-toast b{display:block;font-weight:600}
.ch-toast p{margin:3px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-toast a{display:inline-block;margin-top:6px;font-size:12px;color:var(--ch-act);text-decoration:none}
:root .ch-toast button{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;background:none;color:var(--ch-t3);cursor:pointer;border-radius:8px;padding:0;min-height:0;font-size:12px}
@keyframes chIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ch-toast{animation:none}}

/* ---- hover hints ---- */
.ch-tip{position:fixed;z-index:1100;max-width:min(300px,calc(100vw - 12px));padding:7px 10px;border-radius:8px;background:var(--ch-tx);color:var(--ch-bg);font:12.5px/1.45 var(--ch-font);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;white-space:pre-line;animation:chTip .12s ease-out}
.ch-tip[hidden]{display:none}
@keyframes chTip{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ch-tip{animation:none}}

/* ---- version ---- */
.ch-ver{font:500 11px/1 var(--ch-font);color:var(--ch-t3);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:3px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-ver.ch-old{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}

/* ---- news ---- */
:root .ch-links .ch-nw{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);background:transparent;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-nw svg{width:13px;height:13px}
:root .ch-links .ch-nw.zero{color:var(--ch-t3)}
:root .ch-links .ch-nw.pos{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
:root .ch-links .ch-nw.neg{color:var(--ch-warn);border-color:var(--ch-warn)}
:root .ch-links .ch-nw.imp{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent;font-weight:600}
:root .ch-links .ch-nw:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-nwi .ch-nh{display:block;color:var(--ch-tx);text-decoration:none;font-weight:500;font-size:14px;line-height:1.4}
.ch-nwi .ch-nh:hover{color:var(--ch-act)}
.ch-ni{font-size:11px;color:var(--ch-ert);background:var(--ch-erb);border-radius:6px;padding:0 6px}
.ch-nt{font-size:11px;border-radius:6px;padding:0 6px;color:var(--ch-t3);border:0.5px solid var(--ch-bd)}
.ch-nt.t-1{color:var(--ch-warn);border-color:var(--ch-warn)}
.ch-nt.t1{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-sh{margin:10px 0 0;font:500 14px/1.3 var(--ch-font);color:var(--ch-tx)}

</style>
<script id="ch-tips">
/* CRYPTO HUNTERS: hover hints. [CSS selector, Ukrainian, Russian, English].
   assets/ch.js shows them on mouse hover and keyboard focus; the first matching entry wins (tool list, then common). */

<script>
/* Liquidation Radar — shared model (works in the browser and in Node).
   Browser: <script src="radar-core.js"> → window.RadarCore
   Node:    const RadarCore = require('./radar-core.js') */
(function (root) {
'use strict';

const LEV = [[10, .30], [25, .30], [50, .25], [100, .15]]; // typical leverage and its share
const MMR = 0.005;                                          // approx. maintenance margin
const MIN_MOVE = { 3e5: 0.008, 9e5: 0.012, 36e5: 0.02 };    // min candle move for a panic (5m / 15m / 1h)
const HORIZONS_H = [1, 4, 24];                              // hours to measure what happened after a signal
const SIGNAL_LEVEL = 60;                                    // squeeze risk that counts as a signal

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const c01 = x => clamp(isFinite(x) ? x : 0, 0, 1);
const pos = x => Math.max(0, x);

// One point per candle: OHLC, volume, taker-buy volume, OI at candle close, long share of accounts
function buildSeries(kl, oi, ls, per) {
  const om = new Map(oi.map(x => [+x.timestamp, x]));
  const lm = new Map(ls.map(x => [+x.timestamp, +x.longAccount]));
  const out = []; let lastO = null, lastLa = 0.5;
  for (const k of kl) {
    const ts = +k[0];
    const o = om.get(ts + per) || om.get(ts);
    const la = lm.has(ts + per) ? lm.get(ts + per) : lm.get(ts);
    if (la != null && isFinite(la)) lastLa = la;
    if (o) lastO = o;
    out.push({ t: ts, o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5], tb: +k[9],
      oi: lastO ? +lastO.sumOpenInterest : null, la: lastLa });
  }
  return out;
}

// Estimated liquidation clusters. New OI is split into longs/shorts and spread across typical leverage.
// withHist: also record how much was sitting within 3% of price at every candle.
function liqModel(s, withHist) {
  const cl = [], near = withHist ? new Array(s.length).fill(null) : null;
  for (let i = 1; i < s.length; i++) {
    const b = s[i];
    for (const c of cl) {
      if (c.end < 0 && ((c.side === 'L' && b.l <= c.price) || (c.side === 'S' && b.h >= c.price))) c.end = i;
    }
    if (s[i].oi != null && s[i - 1].oi != null && s[i - 1].oi > 0) {
      const d = s[i].oi - s[i - 1].oi;
      if (d < 0) {
        const f = s[i].oi / s[i - 1].oi;
        for (const c of cl) if (c.end < 0) c.usd *= f;
      } else if (d > 0) {
        const p = (b.h + b.l + b.c) / 3, n = d * p;
        for (const [L, w] of LEV) {
          cl.push({ side: 'L', price: p * (1 - 1 / L + MMR), usd: n * b.la * w, start: i, end: -1 });
          cl.push({ side: 'S', price: p * (1 + 1 / L - MMR), usd: n * (1 - b.la) * w, start: i, end: -1 });
        }
      }
    }
    if (withHist) {
      const P = b.c; let nL = 0, nS = 0;
      for (const c of cl) {
        if (c.end >= 0) continue;
        if (c.side === 'L') { if (c.price >= P * 0.97 && c.price < P) nL += c.usd; }
        else if (c.price <= P * 1.03 && c.price > P) nS += c.usd;
      }
      near[i] = { nL, nS };
    }
  }
  return { cl, near };
}

function buckets(cl, lo, hi, n) {
  const step = (hi - lo) / n, L = new Float64Array(n), Sh = new Float64Array(n);
  for (const c of cl) {
    if (c.end >= 0 || c.price < lo || c.price >= hi) continue;
    const k = Math.floor((c.price - lo) / step);
    (c.side === 'L' ? L : Sh)[k] += c.usd;
  }
  return { lo, hi, step, n, L, S: Sh };
}

function riskScore(fr, lsr, oiChg, nearL, nearS, oiVal) {
  const fundN = clamp((fr - 0.0001) / 0.0004, -1, 1) || 0;
  const crowdN = clamp(Math.log(lsr) / Math.log(3), -1, 1) || 0;
  const buildN = c01(oiChg / 25);
  const nL = c01(nearL / (oiVal * 0.03)), nS = c01(nearS / (oiVal * 0.03));
  const parts = {
    L: { fund: pos(fundN), crowd: pos(crowdN), build: buildN, near: nL },
    S: { fund: pos(-fundN), crowd: pos(-crowdN), build: buildN, near: nS }
  };
  const W = { fund: .28, crowd: .22, build: .20, near: .30 };
  const sc = o => Math.round(100 * (W.fund * o.fund + W.crowd * o.crowd + W.build * o.build + W.near * o.near));
  return { parts, longRisk: sc(parts.L), shortRisk: sc(parts.S) };
}

const oiChangeAt = (s, i, n24) => {
  const a = s[i].oi, b = s[Math.max(0, i - n24)].oi;
  return a != null && b ? (a / b - 1) * 100 : 0;
};
const fwd = (s, i, h) => s[i + h] ? (s[i + h].c / s[i].c - 1) * 100 : null;

// Panic sells (dir 'D') and panic buys (dir 'U'): sharp move vs. normal range + volume spike + one-sided market orders
function spikes(s, cl, per, hz) {
  const LB = 24, out = [], kL = new Map(), kS = new Map();
  for (const c of cl) if (c.end >= 0) { const m = c.side === 'L' ? kL : kS; m.set(c.end, (m.get(c.end) || 0) + c.usd); }
  const minMove = MIN_MOVE[per] || 0.01;
  for (let i = LB; i < s.length; i++) {
    const b = s[i]; if (!(b.v > 0) || !(b.o > 0)) continue;
    const win = s.slice(i - LB, i);
    const vols = win.map(x => x.v).sort((x, y) => x - y), med = vols[LB >> 1];
    const rng = win.reduce((a, x) => a + (x.h - x.l) / x.c, 0) / LB || 1e-9;
    const vx = med > 0 ? b.v / med : 0;
    if (vx < 2.5) continue;
    const sellSh = isFinite(b.tb) ? 1 - b.tb / b.v : 0.5;
    const down = (b.o - b.l) / b.o, up = (b.h - b.o) / b.o;
    const okD = down >= minMove && down / rng >= 2 && sellSh >= 0.55;
    const okU = up >= minMove && up / rng >= 2 && 1 - sellSh >= 0.55;
    if (!okD && !okU) continue;
    const dir = okD && (!okU || down >= up) ? 'D' : 'U';
    const mv = dir === 'D' ? down : up, flow = dir === 'D' ? sellSh : 1 - sellSh;
    const prev = s[i - 1];
    const oiCh = b.oi != null && prev.oi ? (b.oi / prev.oi - 1) * 100 : null;
    const sc = 0.35 * c01((mv / rng - 2) / 4) + 0.3 * c01((vx - 2.5) / 7.5) + 0.2 * c01((flow - 0.55) / 0.3)
      + 0.15 * (oiCh != null && oiCh < 0 ? c01(-oiCh / 3) : 0);
    const ev = { dir, i, iEnd: i, t: b.t, open: b.o, ext: dir === 'D' ? b.l : b.h, close: b.c, vx, flow, oiCh,
      liq: (dir === 'D' ? kL : kS).get(i) || 0, strength: Math.round(30 + 70 * sc) };
    const last = out[out.length - 1];
    if (last && last.dir === dir && last.iEnd >= i - 1) {
      last.iEnd = i; last.close = b.c; last.vx = Math.max(last.vx, vx); last.flow = Math.max(last.flow, flow);
      last.ext = dir === 'D' ? Math.min(last.ext, b.l) : Math.max(last.ext, b.h);
      last.liq += ev.liq; last.strength = Math.max(last.strength, ev.strength);
      if (oiCh != null) last.oiCh = (last.oiCh || 0) + oiCh;
    } else out.push(ev);
  }
  for (const e of out) {
    e.move = (e.ext / e.open - 1) * 100;
    e.back = e.dir === 'D'
      ? (e.open > e.ext ? (e.close - e.ext) / (e.open - e.ext) : 0)
      : (e.ext > e.open ? (e.ext - e.close) / (e.ext - e.open) : 0);
    const o = e.oiCh;
    e.kind = e.dir === 'D'
      ? (o != null && o < -0.3 ? 'kindCap' : o != null && o > 0.3 ? 'kindShorts' : 'kindSell')
      : (o != null && o < -0.3 ? 'kindShortCap' : o != null && o > 0.3 ? 'kindLongs' : 'kindBuy');
    e.fwd = hz.map(h => fwd(s, e.iEnd, h));
  }
  return out;
}

// What happened after each kind of signal. exp = expected direction (+1 up, -1 down)
function signalStats(panic, sig) {
  const groups = [
    { key: 'sigPS', exp: 1, ev: panic.filter(e => e.dir === 'D') },
    { key: 'sigPB', exp: -1, ev: panic.filter(e => e.dir === 'U') },
    { key: 'sigRL', exp: -1, ev: sig.filter(e => e.dir === 'L') },
    { key: 'sigRS', exp: 1, ev: sig.filter(e => e.dir === 'S') }
  ];
  return groups.map(g => {
    const avg = [0, 1, 2].map(j => {
      const v = g.ev.map(e => e.fwd[j]).filter(x => x != null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    });
    const v4 = g.ev.map(e => e.fwd[1]).filter(x => x != null);
    const hit = v4.length ? v4.filter(x => x * g.exp > 0).length / v4.length * 100 : null;
    return { key: g.key, n: g.ev.length, nEval: v4.length, avg, hit };
  });
}

// opts.frHist: [{t, r}] funding history → enables historical risk signals and statistics
function analyze(s, fr, per, opts) {
  opts = opts || {};
  const withHist = !!opts.frHist;
  const { cl, near } = liqModel(s, withHist);
  const n = s.length, P = s[n - 1].c, n24 = Math.round(864e5 / per);
  const oiChg = oiChangeAt(s, n - 1, n24);
  const oiVal = (s[n - 1].oi || 0) * P;
  const la = s[n - 1].la, lsr = la / (1 - la);
  let nearL = 0, nearS = 0;
  for (const c of cl) {
    if (c.end >= 0) continue;
    if (c.side === 'L' && c.price >= P * 0.97 && c.price < P) nearL += c.usd;
    if (c.side === 'S' && c.price <= P * 1.03 && c.price > P) nearS += c.usd;
  }
  const bk = buckets(cl, P * 0.85, P * 1.15, 120);
  const mid = i => bk.lo + (i + 0.5) * bk.step;
  let bL = -1, bS = -1;
  for (let i = 0; i < bk.n; i++) {
    if (mid(i) < P && (bL < 0 || bk.L[i] > bk.L[bL])) bL = i;
    if (mid(i) > P && (bS < 0 || bk.S[i] > bk.S[bS])) bS = i;
  }
  const majL = bL >= 0 && bk.L[bL] > 0 ? { price: mid(bL), usd: bk.L[bL], dist: (mid(bL) / P - 1) * 100 } : null;
  const majS = bS >= 0 && bk.S[bS] > 0 ? { price: mid(bS), usd: bk.S[bS], dist: (mid(bS) / P - 1) * 100 } : null;
  const { parts, longRisk, shortRisk } = riskScore(fr, lsr, oiChg, nearL, nearS, oiVal);
  const hz = HORIZONS_H.map(h => Math.max(1, Math.round(h * 36e5 / per)));
  const panic = spikes(s, cl, per, hz);

  const sig = [];
  let stats = null;
  if (withHist) {
    const fh = opts.frHist.slice().sort((a, b) => a.t - b.t);
    let k = 0, cur = fh.length ? fh[0].r : fr, prevMax = 0, lastSig = -1e9;
    const cool = Math.round(4 * 36e5 / per);
    for (let i = 1; i < n; i++) {
      while (k < fh.length && fh[k].t <= s[i].t) { cur = fh[k].r; k++; }
      if (!near[i] || s[i].oi == null) continue;
      const r = riskScore(cur, s[i].la / (1 - s[i].la), oiChangeAt(s, i, n24), near[i].nL, near[i].nS, s[i].oi * s[i].c);
      const m = Math.max(r.longRisk, r.shortRisk);
      if (i >= 24 && m >= SIGNAL_LEVEL && prevMax < SIGNAL_LEVEL && i - lastSig >= cool) {
        sig.push({ i, t: s[i].t, dir: r.longRisk >= r.shortRisk ? 'L' : 'S', score: m, fwd: hz.map(h => fwd(s, i, h)) });
        lastSig = i;
      }
      prevMax = m;
    }
    stats = signalStats(panic, sig);
  }
  return { cl, panic, sig, stats, P, oiChg, oiVal, la, lsr, nearL, nearS, majL, majS, parts, longRisk, shortRisk,
    score: Math.max(longRisk, shortRisk), dir: longRisk >= shortRisk ? 'L' : 'S' };
}

const RadarCore = { buildSeries, analyze, SIGNAL_LEVEL, HORIZONS_H };
if (typeof module !== 'undefined' && module.exports) module.exports = RadarCore;
root.RadarCore = RadarCore;
})(typeof globalThis !== 'undefined' ? globalThis : this);

}

      const m = j => a[j] + (b[j] - a[j]) * f;
      return `rgba(${m(1) | 0},${m(2) | 0},${m(3) | 0},${m(4).toFixed(2)})`;

  if (max > 0) for (let r = 0; r < rows; r++) for (let x = 0; x < nVis; x++) {

  for (let r = pr; r >= 0; r--) { const xx = hx + hw * cumS[r] / cmax, yy = padT + (r + .5) * rowH; r === pr ? g.moveTo(xx, yy) : g.lineTo(xx, yy); } g.stroke();
  g.globalAlpha = 1;
  g.font = '11px Onest, system-ui, sans-serif'; g.fillStyle = col.muted; g.textBaseline = 'middle';
  for (let k = 0; k <= 6; k++) { const p = lo + (hi - lo) * k / 6; g.fillText(fPx(p), W - axisW + 4, clamp(y(p), padT + 6, padT + ph - 6)); }
  const yp = y(P);
  g.setLineDash([4, 4]); g.strokeStyle = col.text; g.globalAlpha = .6; g.beginPath(); g.moveTo(0, yp); g.lineTo(W - axisW, yp); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  g.fillStyle = col.text; g.fillRect(W - axisW + 1, yp - 9, axisW - 1, 18);
  g.fillStyle = col.panel; g.fillText(fPx(P), W - axisW + 4, yp);
  g.fillStyle = col.muted; g.textBaseline = 'alphabetic';
  for (let k = 0; k < 4; k++) {
    const i = i0 + Math.floor((nVis - 1) * (k + 0.5) / 4), d = new Date(s[i].t);
    const lab = D.per >= 36e5 ? d.toLocaleDateString(loc(), { day: '2-digit', month: '2-digit' }) + ' ' + d.getHours() + ':00'
      : d.toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
    g.fillText(lab, (i - i0) * cw - 16, H - 5);
  }
  D.lay = { i0, cw, plotW, lo, hi, padT, ph, P, cumL, cumS, bL, bS, rows, step };
}
function heatTip(ev) {
  const D = S.detail; if (!D || !D.lay) return;
  const L = D.lay, rect = $('#heat').getBoundingClientRect();
  const yy = ev.clientY - rect.top;
  if (yy < L.padT || yy > L.padT + L.ph) return;
  const price = L.hi - (yy - L.padT) / L.ph * (L.hi - L.lo);
  const r = clamp(Math.floor((L.hi - price) / L.step), 0, L.rows - 1);
  const dist = (price / L.P - 1) * 100;
  const xx = ev.clientX - rect.left, ci = L.i0 + Math.floor(xx / L.cw);
  const pe = xx <= L.plotW ? D.a.panic.find(e => ci >= e.i - 1 && ci <= e.iEnd + 1) : null;
  const ptip = pe ? t(pe.dir === 'D' ? 'tipPanicD' : 'tipPanicU', { d: dt(pe.t), mv: fPct(pe.move, 1), vx: pe.vx.toFixed(1), fl: (pe.flow * 100).toFixed(0), kind: t(pe.kind) }) : '';
  const tip = ptip + (price < L.P
    ? t('tipDown', { p: fPx(price), d: fPct(dist, 1), c: fUsd(L.cumL[r]), lv: fUsd(L.bL[r]) })
    : t('tipUp', { p: fPx(price), d: fPct(dist, 1), c: fUsd(L.cumS[r]), lv: fUsd(L.bS[r]) }));
  S.tipHTML = tip;
  $('#heatTip').innerHTML = tip;
}
function drawLines(id, legendId, series, H = 150, marks = []) {
  const D = S.detail; if (!D) return;
  const { g, W } = prepCanvas($(id), H);
  const padT = 8, padB = 8, ph = H - padT - padB;
  const leg = [], n = series[0] ? series[0].vals.length : 0;
  if (n > 1 && marks.length) {
    g.globalAlpha = .45; g.setLineDash([2, 3]); g.lineWidth = 1;
    for (const m of marks) { g.strokeStyle = m.c; const xx = m.i / (n - 1) * W; g.beginPath(); g.moveTo(xx, padT); g.lineTo(xx, padT + ph); g.stroke(); }
    g.setLineDash([]); g.globalAlpha = 1;
  }
  for (const sr of series) {
    const v = sr.vals, fin = v.filter(x => x != null && isFinite(x));
    if (!fin.length) { leg.push(`<span><i style="background:${sr.color}"></i>${sr.name}: ${t('noData')}</span>`); continue; }
    let lo = Math.min(...fin), hi = Math.max(...fin); if (hi === lo) { hi += 1; lo -= 1; }
    if (sr.ref != null && sr.ref > lo && sr.ref < hi) {
      const yr = padT + (hi - sr.ref) / (hi - lo) * ph;
      g.setLineDash([3, 4]); g.strokeStyle = sr.color; g.globalAlpha = .4; g.beginPath(); g.moveTo(0, yr); g.lineTo(W, yr); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    }
    g.strokeStyle = sr.color; g.lineWidth = sr.width || 1.6; g.beginPath(); let st = false;
    v.forEach((x, i) => {
      if (x == null || !isFinite(x)) return;
      const xx = i / (v.length - 1) * W, yy = padT + (hi - x) / (hi - lo) * ph;
      st ? g.lineTo(xx, yy) : (g.moveTo(xx, yy), st = true);
    });
    g.stroke();
    leg.push(`<span><i style="background:${sr.color}"></i>${sr.name}: <b class="num">${sr.fmt(fin[fin.length - 1])}</b></span>`);
  }
  $(legendId).innerHTML = leg.join('');
}
function bookStats(book, P) {
  if (!book) return null;
  const agg = (side, lim) => side.reduce((a, [p, q]) => { p = +p; q = +q; return Math.abs(p / P - 1) <= lim ? a + p * q : a; }, 0);
  const walls = side => side.map(([p, q]) => ({ p: +p, usd: +p * +q })).filter(x => Math.abs(x.p / P - 1) <= 0.03).sort((a, b) => b.usd - a.usd).slice(0, 4);
  return { b1: agg(book.bids, .01), a1: agg(book.asks, .01), b2: agg(book.bids, .02), a2: agg(book.asks, .02), wb: walls(book.bids), wa: walls(book.asks) };
}
function insights(D, bk) {
  const a = D.a, out = [], lq = liqOf(D.sym);
  if (a.longRisk >= 55) out.push(t('insLong', { v: a.longRisk }) + (a.majL ? t('insLongCl', { p: fPx(a.majL.price), d: fPct(a.majL.dist, 1), u: fUsd(a.majL.usd) }) : ''));
  if (a.shortRisk >= 55) out.push(t('insShort', { v: a.shortRisk }) + (a.majS ? t('insShortCl', { p: fPx(a.majS.price), d: fPct(a.majS.dist, 1), u: fUsd(a.majS.usd) }) : ''));
  if (a.longRisk < 55 && a.shortRisk < 55) out.push(t('insBal'));
  const rp = a.panic[a.panic.length - 1];
  if (rp && D.s.length - 1 - rp.iEnd <= 6) {
    const d = rp.dir;
    out.push(t('insPanic' + d, { d: fPct(rp.move, 1), vx: rp.vx.toFixed(1), kind: t(rp.kind) }) + t((rp.back >= 0.6 ? 'insBack' : 'insNoBack') + d));
  }
  // historical reliability of the currently relevant signal
  if (a.stats) {
    const key = rp && D.s.length - 1 - rp.iEnd <= 6 ? (rp.dir === 'D' ? 'sigPS' : 'sigPB') : a.score >= 55 ? (a.dir === 'L' ? 'sigRL' : 'sigRS') : null;
    const st = key && a.stats.find(x => x.key === key);
    if (st && st.nEval >= 3) out.push(t('insHist', { s: t(key), v: fPct(st.avg[1], 2), h: st.hit.toFixed(0), n: st.nEval }));
  }
  if (a.oiChg > 12 && Math.abs(D.chg) < 3) out.push(t('insOiUp', { v: fPct(a.oiChg, 1) }));
  if (a.oiChg < -12) out.push(t('insOiDown', { v: fPct(a.oiChg, 1) }));
  if (D.fr > 0.0005) out.push(t('insFrHigh', { v: (D.fr * 100).toFixed(4) + '%' }));
  if (D.fr < -0.0003) out.push(t('insFrNeg', { v: (D.fr * 100).toFixed(4) + '%' }));
  if (a.oiVal && lq.t > a.oiVal * 0.005) out.push(t('insCascade', { v: fUsd(lq.t) }));
  if (bk && bk.b2 && bk.a2) {
    if (bk.b2 < bk.a2 * 0.6) out.push(t('insBookDown'));
    else if (bk.a2 < bk.b2 * 0.6) out.push(t('insBookUp'));
  }
  out.push(t('insProtect'));
  return out;
}
function renderStats(D) {
  const a = D.a, spanMs = D.s.length * D.per, days = spanMs / 864e5;
  $('#statSub').textContent = t('statSub', { span: days >= 1 ? t('spanD', { n: days.toFixed(days < 3 ? 1 : 0) }) : t('spanH', { n: Math.round(spanMs / 36e5) }) });
  if (!a.stats) { $('#sigTbl').innerHTML = ''; $('#statNote').textContent = ''; return; }
  $('#sigTbl').innerHTML = `<thead><tr><th>${t('thSignal')}</th><th>${t('thN')}</th><th>${t('th1')}</th><th>${t('th4')}</th><th>${t('th24')}</th><th>${t('thHit')}</th></tr></thead><tbody>` +
    a.stats.map(g => `<tr><td style="text-align:left">${t(g.key)}</td><td>${g.n}</td><td>${cPct(g.avg[0], 2)}</td><td>${cPct(g.avg[1], 2)}</td><td>${cPct(g.avg[2], 2)}</td>
      <td>${g.hit == null ? '<span class="mut">—</span>' : `<b class="${g.hit >= 55 ? 'up' : g.hit <= 45 ? 'dn' : ''}">${g.hit.toFixed(0)}%</b>`}${g.nEval && g.nEval < 5 ? ' <small class="mut" style="display:inline">(' + g.nEval + ')</small>' : ''}</td></tr>`).join('') + '</tbody>';
  $('#statNote').textContent = t('statFew');
}
function renderDetail() {
  const D = S.detail; if (!D) return;
  const a = D.a, lq = liqOf(D.sym), bk = bookStats(D.book, a.P);
  $('#dSym').textContent = base(D.sym);
  $('#dPx').textContent = fPx(a.P);
  $('#dChg').className = cls(D.chg); $('#dChg').textContent = fPct(D.chg);
  renderFavBtn();
  drawHeat();
  $('#heatTip').innerHTML = S.tipHTML || t('tipDefault');
  const left = Math.max(0, D.nextFund - Date.now()), hh = Math.floor(left / 36e5), mm = Math.floor(left % 36e5 / 6e4);
  const lastTk = D.taker.filter(x => x != null).slice(-12), tkAvg = lastTk.length ? lastTk.reduce((x, y) => x + y, 0) / lastTk.length : NaN;
  const lastTop = D.top.filter(x => x != null).pop();
  $('#dStats').innerHTML = [
    ['stFund', `<span class="${D.fr > 0.0003 ? 'dn' : D.fr < -0.0001 ? 'up' : ''}">${(D.fr * 100).toFixed(4)}%</span>`, t('stFundSub', { h: hh, m: mm })],
    ['stOi', fUsd(a.oiVal), t('stOiSub', { v: fPct(a.oiChg, 1) })],
    ['stLsr', a.lsr.toFixed(2), t('stLsrSub', { v: (a.la * 100).toFixed(0) })],
    ['stTop', lastTop != null ? lastTop.toFixed(2) : '—', t('stTopSub')],
    ['stTaker', isFinite(tkAvg) ? tkAvg.toFixed(2) : '—', t('stTakerSub')],
    ['stLiq', `<span class="dn">${fUsd(lq.L)}</span>`, t('stLiqSub', { v: fUsd(lq.S) })],
    ['stBook', bk ? `<span class="up">${fUsd(bk.b2)}</span>` : '—', bk ? t('stBookSub', { v: fUsd(bk.a2) }) : ''],
    ['stVol', fUsd(D.vol), '']
  ].map(([k, v, sm]) => `<div class="stat"><span>${t(k)}</span><b>${v}</b><small>${sm}</small></div>`).join('');

  renderStats(D);

  const comps = { fund: 'compFund', crowd: 'compCrowd', build: 'compBuild', near: 'compNear' };
  $('#dRisk').innerHTML = `<div class="big">
      <div><b class="dn">${a.longRisk}</b><span>${t('rDown')}</span></div>
      <div><b class="up">${a.shortRisk}</b><span>${t('rUp')}</span></div></div>
    <div class="comp"><span></span><span class="h">${t('rLongs')}</span><span class="h">${t('rShorts')}</span>
    ${Object.keys(comps).map(k => `<span>${t(comps[k])}</span>
      <span class="meter"><i style="width:${a.parts.L[k] * 100}%;background:var(--long)"></i></span>
      <span class="meter"><i style="width:${a.parts.S[k] * 100}%;background:var(--short)"></i></span>`).join('')}</div>`;

  const pl = a.panic.slice(-12).reverse();

    const n = e.iEnd - e.i + 1, dn = e.dir === 'D';
    const det = [t('pVol', { v: e.vx.toFixed(1) }), t(dn ? 'pSell' : 'pBuy', { v: (e.flow * 100).toFixed(0) }), 'OI ' + (e.oiCh == null ? '—' : fPct(e.oiCh, 1))];
    if (e.liq) det.push(t(dn ? 'pKnockL' : 'pKnockS', { v: fUsd(e.liq) }));
    if (e.back > 0) det.push(t(dn ? 'pRecovD' : 'pRecovU', { v: (e.back * 100).toFixed(0) }));
    const after = e.fwd.some(x => x != null) ? `<small style="grid-column:1/-1">${t('pAfter', { a: cPct(e.fwd[0]), b: cPct(e.fwd[1]), c: cPct(e.fwd[2]) })}</small>` : '';
    return `<li><span><b class="${dn ? 'dn' : 'up'}">${dn ? '▼' : '▲'} ${fPct(e.move, 1)}</b>${n > 1 ? t('pOver', { n }) : ''} <span class="tag">${t(e.kind)}</span>${e.back >= 0.6 ? ` <span class="tag">${t(dn ? 'tagBack' : 'tagBackU')}</span>` : ''}</span>
      <span>${e.strength}/100</span>
      <small>${det.join(' · ')}</small>
      <small style="text-align:right">${dt(e.t)}</small>${after}</li>`;
  }).join('') : `<li class="empty">${t('pNone')}</li>`;

    { name: t('lgAcc'), color: col.long, vals: D.s.map(p => p.la / (1 - p.la)), fmt: v => v.toFixed(2), ref: 1 },

let dTimer = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (/^[A-Z0-9]{2,24}USDT$/.test(h)) {
    $('#monitor').classList.add('hidden'); $('#detail').classList.remove('hidden');
    if (S.dSym !== h) {
      S.dSym = h; S.detail = null; S.dLoading = false; S.tipHTML = null;
      $('#dSym').textContent = base(h); if (window.CH) CH.linksInto($('#chLinks'), { coin: base(h), q: 'USDT', ex: 'binance', from: 'liq' }); $('#dPx').textContent = ''; $('#dChg').textContent = '';
      $('#heatTip').textContent = t('tipDefault'); $('#dFeed').innerHTML = ''; $('#dPanic').innerHTML = ''; $('#sigTbl').innerHTML = '';
      const cv = $('#heat'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    }
    renderFavBtn(); setTfButtons(); loadDetail(h);
    clearInterval(dTimer); dTimer = setInterval(() => loadDetail(S.dSym), 120000);
    if (tg && tg.BackButton) tg.BackButton.show();
    window.scrollTo(0, 0);
  } else {
    S.dSym = null; S.detail = null; clearInterval(dTimer);
    $('#detail').classList.add('hidden'); $('#monitor').classList.remove('hidden');

}
function openSym(raw) {

  location.hash = s;
}

  if (S.detail) renderDetail();
}

$('#dFav').addEventListener('click', () => { if (S.dSym) { const was = S.fav.has(S.dSym); toggleFav(S.dSym); if (!was && !S.rows.some(r => r.sym === S.dSym)) loadMonitor(); } });

$('#minVol').addEventListener('change', e => { S.minVol = +e.target.value; store.set('minVol', S.minVol); renderTable(); });
$('#refresh').addEventListener('click', loadMonitor);
$('#back').addEventListener('click', () => { location.hash = ''; });
$('#dRefresh').addEventListener('click', () => S.dSym && loadDetail(S.dSym));
$('#tfSeg').addEventListener('click', e => {

$('#heat').addEventListener('pointermove', heatTip);
$('#heat').addEventListener('pointerdown', heatTip);
$('#themeBtn').addEventListener('click', () => {
  const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', th); applyTheme(th);
});
$('#langSel').addEventListener('change', e => { LANG = e.target.value; store.set('lang', LANG); applyI18n(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.detail && renderDetail(), 150); });
window.addEventListener('hashchange', route);

if (tg) {
  try { tg.ready(); tg.expand(); if (tg.BackButton) tg.BackButton.onClick(() => { location.hash = ''; }); } catch (e) {}
}
applyTheme(window.CH ? CH.theme(store.get('theme', tg && tg.colorScheme === 'light' ? 'light' : 'dark')) : store.get('theme', tg && tg.colorScheme === 'light' ? 'light' : 'dark'));
applyI18n();
connectWS();
loadServerLiq();
setInterval(renderFeeds, 1000);

if (location.hash) route();
setInterval(loadMonitor, 300000);
})();
