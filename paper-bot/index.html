<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/ch.css?v=1.02">
<script src="../assets/ch.js?v=1.02" data-tool="bot" data-ver="1.02"></script>
<title>Paper trading bot</title>
<style>
:root{
  --bg:#E9F1EF;--surface:#FFFFFF;--surface2:#F3F8F6;--line:#CFE0DC;--text:#0D2226;--muted:#4C6B66;
  --gain:#07875A;--loss:#C23B2B;--amber:#9A6400;--gain-bg:rgba(7,135,90,.1);--loss-bg:rgba(194,59,43,.1);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D2226;--surface:#12313A;--surface2:#0F2A31;--line:#1E4650;--text:#E6F0ED;--muted:#8FB0AA;
  --gain:#4FE0A0;--loss:#FF7B6B;--amber:#F3B33D;--gain-bg:rgba(79,224,160,.12);--loss-bg:rgba(255,123,107,.12);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D2226;--surface:#12313A;--surface2:#0F2A31;--line:#1E4650;--text:#E6F0ED;--muted:#8FB0AA;
  --gain:#4FE0A0;--loss:#FF7B6B;--amber:#F3B33D;--gain-bg:rgba(79,224,160,.12);--loss-bg:rgba(255,123,107,.12);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:16px 18px 4px}
.brand{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:15px}
.brand small{display:block;font-family:Manrope,sans-serif;font-size:12px;color:var(--muted);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:none;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:8px 14px 24px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"hero" "st" "pf" "jr" "sc"}
@media (min-width:960px){main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"hero jr" "st jr" "pf jr" "pf sc";align-items:start}}
.hero{grid-area:hero;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 16px}
#st{grid-area:st}#pf{grid-area:pf}#jr{grid-area:jr}#sc{grid-area:sc}
.lbl{color:var(--muted);font-size:13px;font-weight:500}
.eqrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:2px}
.eq{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:clamp(38px,9vw,60px);letter-spacing:-.02em;line-height:1.05}
.ccy{font-family:Unbounded,Manrope,sans-serif;font-size:16px;color:var(--muted)}
.pnl{font-weight:600;margin-top:4px}
.up{color:var(--gain)}.down{color:var(--loss)}
canvas#chart{display:block;width:100%;height:150px;margin:14px 0 8px}
.split{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
.split div dt{color:var(--muted);font-size:12px}.split div dd{margin:0;font-weight:700;font-size:15px}
@media (max-width:420px){.split{grid-template-columns:repeat(2,minmax(0,1fr))}}
.status{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--gain);box-shadow:0 0 0 4px var(--gain-bg)}.dot.warn{background:var(--amber)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border-radius:12px;padding:10px 14px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn.main{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.thought{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:14px;border-left:3px solid var(--amber);min-height:46px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px}
.card h2{margin:2px 0 12px}
.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:480px){.row{grid-template-columns:minmax(0,1fr);gap:6px}}
.row>div:first-child{color:var(--muted);font-size:13px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600}
.opts button small{color:var(--muted);font-weight:500;margin-left:4px}
.opts button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.opts button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.note{margin:6px 0 0;font-size:13px;color:var(--muted)}
h2{font-family:Unbounded,Manrope,sans-serif;font-weight:500;font-size:18px;margin:6px 4px 10px}
.sub{color:var(--muted);font-size:13px;margin:-6px 4px 10px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;font-size:14px}
.pos{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.pos .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pos .r1 .l{display:flex;align-items:center;gap:8px}
.coin{font-weight:700;font-size:17px}
.pos .meta{color:var(--muted);font-size:13px;margin-top:2px}
.range{position:relative;height:6px;border-radius:3px;margin:16px 0 6px;background:linear-gradient(90deg,var(--loss-bg),var(--surface2) 40%,var(--gain-bg))}
.range i{position:absolute;top:-5px;width:4px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-2px)}
.range b{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted)}
.rl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.trade .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.buy{background:var(--gain-bg);color:var(--gain)}.tag.sell{background:var(--loss-bg);color:var(--loss)}
.tag.neutral{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.time{margin-left:auto;color:var(--muted);font-size:12px}
.sum{margin:8px 0 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:16px}
details[open]>summary::before{content:"−"}
.legend{font-size:12px;color:var(--muted);margin:2px 0 0}
.fac{display:grid;grid-template-columns:40px 1fr;gap:4px 8px;font-size:14px;margin:6px 0 4px}
.fac .p{font-weight:700;text-align:right}
.lines{margin:6px 0 0;padding-left:18px;font-size:14px}.lines li{margin:3px 0}
.scrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.scrow summary{display:grid;grid-template-columns:24px 84px minmax(0,1fr) 44px;align-items:center;gap:8px;color:var(--text);font-weight:600}
.scrow summary::before{display:none}
.rank{color:var(--muted);font-size:12px}
.bar{position:relative;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.bar span{position:absolute;top:0;bottom:0;border-radius:4px}
.score{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.g{color:var(--gain);border-color:var(--gain)}.chip.r{color:var(--loss);border-color:var(--loss)}
.held{display:block;font-size:11px;color:var(--amber);font-weight:600}
.more{display:block;width:100%;margin-top:4px}
footer{max-width:1180px;margin:0 auto;padding:0 18px 28px;color:var(--muted);font-size:12px}
</style>
<style id="ch-skin">
body.ch-skin{background:var(--ch-bg);color:var(--ch-tx)}
body.ch-skin :is(h1){font-size:20px!important;font-weight:500!important;letter-spacing:0!important;line-height:1.25!important}
body.ch-skin :is(h2){font-weight:500!important;letter-spacing:0!important}
body.ch-skin :is(h3){font-weight:500!important}
body.ch-skin b, body.ch-skin strong{font-weight:600}
body.ch-skin ::placeholder{color:var(--ch-t3)}

html:root:root{--bg:var(--ch-bg);--surface:var(--ch-bg);--surface2:var(--ch-s1);--line:var(--ch-bd);--text:var(--ch-tx);--muted:var(--ch-t2);--gain:var(--ch-up);--loss:var(--ch-dn);--amber:var(--ch-warn);--gain-bg:var(--ch-upb);--loss-bg:var(--ch-dnb);--ch-w:1180px}
body.ch-skin .top{padding-top:12px}
body.ch-skin .brand{font-size:20px;font-weight:500}
body.ch-skin .brand small{font-size:12px;font-weight:400}
body.ch-skin :is(.hero,.card,.pos,.trade,.scrow){border-width:0.5px;border-radius:12px}
body.ch-skin .hero{padding:16px 16px 14px}
body.ch-skin :is(.eq,.ccy){font-family:inherit!important}
body.ch-skin .eq{font-weight:600;font-size:clamp(32px,8vw,48px)}
body.ch-skin h2{font-size:16px!important;margin:6px 2px 10px}
body.ch-skin .seg{border:0.5px solid var(--ch-bd2);background:none;border-radius:8px;padding:0;overflow:hidden}
body.ch-skin .seg button{border-radius:0;padding:5px 11px;font-weight:400}
body.ch-skin .seg button[aria-pressed="true"]{background:var(--ch-acb);color:var(--ch-act);font-weight:500}
body.ch-skin :is(.ghost,.btn,.opts button){background:none;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);font-weight:400;font-size:13px;padding:5px 12px}
body.ch-skin .btn.main{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
body.ch-skin .opts button[aria-pressed="true"]{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
body.ch-skin .opts button[aria-pressed="true"] small{color:var(--ch-act)}
body.ch-skin .thought{border-radius:10px;border-left-color:var(--ch-ac)}
body.ch-skin .coin{font-weight:500;font-size:15px}
body.ch-skin .tag{font-weight:500;border-radius:6px}
body.ch-skin .chip{border-width:0.5px}
body.ch-skin .empty{border-width:0.5px;border-radius:12px}
body.ch-skin .scrow .ch-links{margin:10px 0 2px}
body.ch-skin footer#footer{padding-bottom:6px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span data-i="brand"></span><small id="brandSub"></small></div>
  <div class="tools">
    <div class="seg" role="group" id="exSeg"><button type="button" data-ex="binance">Binance</button><button type="button" data-ex="bybit">Bybit</button></div>
    <div class="seg" role="group" id="langSeg"><button type="button" data-lang="uk">УКР</button><button type="button" data-lang="ru">РУС</button><button type="button" data-lang="en">ENG</button></div>
    <button class="ghost" id="themeBtn" type="button" data-i="theme"></button>
  </div>
</header>

<main>
  <section class="hero" aria-live="polite">
    <div class="lbl" data-i="eqLabel"></div>
    <div class="eqrow"><span class="eq" id="eq">1 000,00</span><span class="ccy">USDT</span></div>
    <div class="pnl" id="pnl"></div>
    <canvas id="chart"></canvas>
    <dl class="split">
      <div><dt data-i="cash"></dt><dd id="cash">—</dd></div>
      <div><dt data-i="inv"></dt><dd id="inv">—</dd></div>
      <div><dt data-i="closed"></dt><dd id="ntr">—</dd></div>
      <div><dt data-i="winners"></dt><dd id="wr">—</dd></div>
    </dl>
    <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>
    <div class="controls">
      <button class="btn main" id="runBtn" type="button"></button>
      <button class="btn" id="scanBtn" type="button" data-i="scanNow"></button>
      <button class="btn" id="resetBtn" type="button" data-i="reset"></button>
    </div>
    <p class="thought" id="thought"></p>
  </section>

  <section id="st" class="card">
    <h2 data-i="stTitle"></h2>
    <div class="row"><div data-i="mktL"></div>
      <div class="opts" id="mktOpts"><button type="button" data-mkt="spot"><span data-i="spot"></span></button><button type="button" data-mkt="futures"><span data-i="futures"></span></button></div></div>
    <div class="row"><div data-i="tfL"></div>
      <div class="opts" id="tfOpts">
        <button type="button" data-tf="scalp"><span data-i="tf_scalp"></span><small>5m</small></button>
        <button type="button" data-tf="intra"><span data-i="tf_intra"></span><small>15m</small></button>
        <button type="button" data-tf="swing"><span data-i="tf_swing"></span><small>1h</small></button>
        <button type="button" data-tf="pos"><span data-i="tf_pos"></span><small>4h</small></button>
      </div></div>
    <div class="row fut"><div data-i="levL"></div>
      <div class="opts" id="levOpts"><button type="button" data-lev="1">×1</button><button type="button" data-lev="2">×2</button><button type="button" data-lev="3">×3</button><button type="button" data-lev="5">×5</button><button type="button" data-lev="10">×10</button></div></div>
    <div class="row fut"><div data-i="dirL"></div>
      <div class="opts" id="dirOpts"><button type="button" data-dir="both"><span data-i="dir_both"></span></button><button type="button" data-dir="long"><span data-i="dir_long"></span></button><button type="button" data-dir="short"><span data-i="dir_short"></span></button></div></div>
    <p class="note" id="stNote"></p>
  </section>

  <section id="pf"><h2 data-i="portfolio"></h2><div id="positions"></div></section>

  <section id="jr">
    <h2 data-i="journal"></h2>
    <p class="sub" data-i="journalSub"></p>
    <div id="trades"></div>
  </section>

  <section id="sc">
    <h2 data-i="whatSees"></h2>
    <p class="sub" id="scsub"></p>
    <div id="scan"></div>
  </section>
</main>
<footer id="footer"></footer>

<script>
"use strict";
/* ===================== Мови ===================== */
const tfOf = v => v.tf || ({s:"1h",m:"4h",l:"1d"})[v.h];
const sc = s => (s>0?"+":s<0?"−":"") + Math.abs(s);
const I18N = {
uk:{
  loc:"uk-UA", brand:"Бот-трейдер", brandSub:v=>`віртуальний рахунок: ${v.mkt} ${v.ex}, ${v.tf}`, theme:"Змінити тему",
  exLabel:"Біржа", langLabel:"Мова", eqLabel:"Баланс рахунку зараз", fromStart:v=>`${sgn(v.d)} USDT (${pc(v.p)}) від старту`,
  chartAria:"Графік балансу", chartStart:"старт 1000", cash:"Вільні USDT", inv:"У позиціях", closed:"Закрито угод", winners:"Прибуткових",
  pause:"Поставити на паузу", run:"Запустити бота", scanNow:"Сканувати зараз", reset:"Почати з 1000 USDT",
  confirmReset:v=>`Скинути рахунок (${v.mkt} ${v.ex}) і почати знову з 1000 USDT? Відкриті позиції буде анульовано.`,
  stTitle:"Стратегія", mktL:"Ринок", spot:"Спот", futures:"Ф’ючерси", mktSpot:"спот", mktFut:"ф’ючерси",
  tfL:"Таймфрейм", tf_scalp:"Скальпінг", tf_intra:"Інтрадей", tf_swing:"Свінг", tf_pos:"Позиційний",
  levL:"Плече", dirL:"Напрямок", dir_both:"Лонг і шорт", dir_long:"Тільки лонг", dir_short:"Тільки шорт",
  noteSpot:v=>`На споті бот лише купує монети (лонг). Шорт і плече доступні в режимі ф’ючерсів. Аналіз на ${v.b}, ${v.m} і ${v.h}, скан кожні ${v.s}. Спот і ф’ючерси мають окремі рахунки по 1000 USDT.`,
  noteFut:v=>`Безстрокові ф’ючерси USDT-M: лонг і шорт із плечем, фандинг кожні 8 год, комісія ${v.fee}%. Аналіз на ${v.b}, ${v.m} і ${v.h}, скан кожні ${v.s}. Нове плече діє для наступних угод. Окремий рахунок 1000 USDT.`,
  sec:"с", portfolio:"Портфель", journal:"Журнал угод", journalSub:"Кожна угода з поясненням: чому ця монета, чому цей напрямок і чому така сума",
  whatSees:"Що бачить бот", scanSub:"Оцінка монет за всіма індикаторами, від −100 до +100",
  scanSubFull:v=>`${v.n} найліквідніших пар до USDT на ${v.ex}, скан о ${tm(v.t)}. Сигнал від ±${v.th}, закриття при розвороті оцінки до ∓${v.sell}`,
  emptyPos:v=>`Позицій немає, усі ${usd(v.cash)} USDT вільні. Бот купить, щойно оцінка монети перевищить +${v.th}.`,
  emptyPosF:v=>`Позицій немає. Бот відкриє лонг при оцінці від +${v.th} або шорт від −${v.th}.`,
  emptyTrades:"Угод ще немає. Перший скан ринку займає близько хвилини.", emptyScan:"Дані з’являться після першого скану.",
  buy:"Купівля", sell:"Продаж", openLong:"Лонг", openShort:"Шорт", closeLong:"Закрито лонг", closeShort:"Закрито шорт",
  whyCoin:v=>`Чому саме ${v.base}`, whyCoinS:v=>`Чому шорт ${v.base}`, whySize:"Чому на таку суму", details:"Деталі угоди",
  facLegend:"Плюс означає аргумент за цю угоду, мінус означає аргумент проти",
  showAll:v=>`Показати всі угоди (${v.n})`, showLess:"Показати менше", inPf:"у портфелі",
  chipHeat:v=>`Перегрів ${v.tf}`, trendUp:"Тренд угору", trendDown:"Тренд униз", sigLong:"Сигнал: лонг", sigShort:"Сигнал: шорт",
  chipFund:v=>`Фандинг ${pc(v.fr,3)}`, noSignal:"Жоден індикатор не дає сигналу",
  posMeta:v=>`${qf(v.qty)} ${v.base} на ${usd(v.val)} USDT. Вхід ${px(v.entry)}, зараз ${px(v.now)}. Тримаю ${dur(v.held)}, оцінка ${sc(v.score)}`,
  posMetaF:v=>`Маржа ${usd(v.margin)} USDT, обсяг ${usd(v.notional)} USDT. Вхід ${px(v.entry)}, зараз ${px(v.now)}, ліквідація ≈ ${px(v.liq)}. Тримаю ${dur(v.held)}, оцінка ${sc(v.score)}`,
  stopL:v=>`Стоп ${px(v.p)}${v.be?" (беззбиток)":""}`, target:v=>`Ціль ${px(v.p)}`, rangeAria:"Ціна між стопом і ціллю",
  footer:v=>`Симуляція: угоди віртуальні, реальні гроші не задіяні, ціни й дані беруться з публічного API ${v.ex}. Кожна біржа й кожен ринок мають окремий віртуальний рахунок. Ф’ючерси з плечем можуть швидко знищити депозит. Це не фінансова порада.`,
  uMin:"хв", uH:"год", uD:"дн",

/* ===================== Індикатори ===================== */
function rsi(c,n=14){ if(c.length<n+2) return 50; let g=0,l=0; for(let i=1;i<=n;i++){ const d=c[i]-c[i-1]; d>0?g+=d:l-=d; } g/=n; l/=n;
  for(let i=n+1;i<c.length;i++){ const d=c[i]-c[i-1]; g=(g*(n-1)+Math.max(d,0))/n; l=(l*(n-1)+Math.max(-d,0))/n; } return l===0?100:100-100/(1+g/l); }
function ema(c,n){ if(c.length<n) return null; let e=c.slice(0,n).reduce((a,b)=>a+b,0)/n; const k=2/(n+1); for(let i=n;i<c.length;i++) e=c[i]*k+e*(1-k); return e; }
function stoch(c,h,l,n=14){ if(c.length<n+3) return 50; const ks=[];
  for(let j=c.length-3;j<c.length;j++){ const hh=Math.max(...h.slice(j-n+1,j+1)), ll=Math.min(...l.slice(j-n+1,j+1)); ks.push(hh===ll?50:(c[j]-ll)/(hh-ll)*100); }
  return ks.reduce((a,b)=>a+b,0)/3; }
function atr(h,l,c,n=14){ const tr=[]; for(let i=1;i<c.length;i++) tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]))); const s=tr.slice(-n); return s.reduce((a,b)=>a+b,0)/s.length; }
function agg(k,n){ const o={c:[],h:[],l:[]}; for(let i=k.length%n;i<k.length;i+=n){ const g=k.slice(i,i+n); o.c.push(g[g.length-1][4]); o.h.push(Math.max(...g.map(x=>x[2]))); o.l.push(Math.min(...g.map(x=>x[3]))); } return o; }
function zigzag(c,th){ const piv=[]; let tr=0, ext=c[0], ei=0;
  for(let i=1;i<c.length;i++){ const x=c[i];
    if(tr===0){ if(x/c[0]-1>=th){tr=1;piv.push({i:0,p:c[0],t:"L"});ext=x;ei=i;} else if(1-x/c[0]>=th){tr=-1;piv.push({i:0,p:c[0],t:"H"});ext=x;ei=i;} }
    else if(tr===1){ if(x>ext){ext=x;ei=i;} else if(1-x/ext>=th){piv.push({i:ei,p:ext,t:"H"});tr=-1;ext=x;ei=i;} }
    else { if(x<ext){ext=x;ei=i;} else if(x/ext-1>=th){piv.push({i:ei,p:ext,t:"L"});tr=1;ext=x;ei=i;} } }
  return {piv,tr,ext}; }
function elliott(c,ap){
  const th=Math.min(0.08,Math.max(0.008,ap*3)), {piv:P,tr,ext}=zigzag(c,th), last=c[c.length-1];
  if(P.length<3) return null; const [a,b,d]=P.slice(-3);
  if(tr===-1 && P[P.length-1].t==="H"){ const L=P[P.length-2], H=P[P.length-1], r=(H.p-ext)/(H.p-L.p);
    if(ext>L.p && r>=0.382 && r<=0.786 && last>ext*1.004) return {p:12,k:"ewCorr",v:{imp:H.p/L.p-1,r}}; }
  if(tr===1 && a.t==="L" && b.t==="H" && d.t==="L"){ const r=(b.p-d.p)/(b.p-a.p);
    if(d.p>a.p && r>=0.382 && r<=0.786 && last<b.p) return {p:12,k:"ewNew",v:{r,peak:b.p}};
    const leg1=b.p-a.p, leg2=ext-d.p, hs=P.filter(x=>x.t==="H").slice(-3), rising=hs.length>=2&&hs.every((x,i)=>i===0||x.p>hs[i-1].p);
    if(rising && leg2>=1.618*leg1 && ext>b.p) return {p:-12,k:"ewExt",v:{ratio:leg2/leg1}}; }
  if(tr===-1){ const H=P.filter(x=>x.t==="H").slice(-3); if(H.length===3&&H[1].p<H[0].p&&H[2].p<H[1].p) return {p:-8,k:"ewDown",v:{}}; }
  return null;
}
/* Дзеркальний аналіз (1/ціна) знаходить ті самі фігури для падіння */
function elliottBoth(c,ap){
  const w=elliott(c,ap); if(w) return w;
  const m=elliott(c.map(x=>1/x),ap); if(!m) return null;
  const v={...m.v}; if(v.imp!==undefined) v.imp=1/(1+v.imp)-1; if(v.peak!==undefined) v.peak=1/v.peak;
  return {p:-m.p,k:{ewCorr:"ewCorrS",ewNew:"ewNewS",ewExt:"ewExtS",ewDown:"ewUpS"}[m.k],v};
}
const total = F => Math.max(-100,Math.min(100,Math.round(F.reduce((s,f)=>s+f.p,0))));

function analyze(t,kb,kh,fund,tfc,fut){
  const sym=t.sym, base=sym.slice(0,-4), price=t.price, ch=t.ch;
  const c=kb.map(k=>k[4]), h=kb.map(k=>k[2]), l=kb.map(k=>k[3]), vol=kb.map(k=>k[5]), o=kb.map(k=>k[1]);
  const ch2=kh.map(k=>k[4]), hh=kh.map(k=>k[2]), lh=kh.map(k=>k[3]), km=agg(kb,tfc.agg);
  const rb=rsi(c), rm=rsi(km.c), rh=rsi(ch2);
  const heat={s:(stoch(c,h,l)+rb)/2, m:(stoch(km.c,km.h,km.l)+rm)/2, l:(stoch(ch2,hh,lh)+rh)/2};
  const tfOfH={s:tfc.b,m:tfc.m,l:tfc.h};
  const A=atr(h,l,c), ap=A/price, F=[], add=(p,k,v={})=>F.push({p,k,v});
  // 1. Індекс перегріву у трьох горизонтах (симетрично: перепроданість +, перегрів −)
  for(const [hz,a1,p1,a2,p2] of [["s",15,18,30,10],["m",20,16,35,9],["l",25,12,40,6]]){ const val=heat[hz], v={h:hz,val,tf:tfOfH[hz]};
    if(val<a1) add(p1,"heatStrong",v); else if(val<a2) add(p2,"heatCheap",v);
    else if(val>100-a1) add(-p1,"heatHot",v); else if(val>100-a2) add(-p2,"heatWarm",v); }
  // 2. Збіг сигналів
  const nCold=(heat.s<35)+(heat.m<35)+(heat.l<40), nHot=(heat.s>65)+(heat.m>65)+(heat.l>60);
  if(nCold>=2) add(10,"conf",{n:nCold}); else if(nHot>=2) add(-10,"confHot",{n:nHot});
  // 3. RSI
  if(rb<30) add(8,"rsi1hLow",{v:rb,tf:tfc.b}); else if(rb>70) add(-8,"rsi1hHigh",{v:rb,tf:tfc.b});
  if(rh<35) add(6,"rsi1dLow",{v:rh,tf:tfc.h}); else if(rh>65) add(-6,"rsi1dHigh",{v:rh,tf:tfc.h});
  // 4. Сплеск об'єму на останній закритій свічці
  const j=vol.length-2, avg=vol.slice(j-24,j).reduce((x,y)=>x+y,0)/24, vr=avg>0?vol[j]/avg:1;
  if(vr>=2.5) c[j]>o[j] ? add(10,"volUp",{r:vr,tf:tfc.b}) : add(-10,"volDown",{r:vr,tf:tfc.b});
  // 5. Трендовий фільтр
  const eH=ema(ch2,50), e20=ema(c,20), e50=ema(c,50); let trend=0;
  if(eH===null) add(-5,"young",{tf:tfc.h});
  else if(price>eH){ trend=1; add(10,"trendUpD",{d:price/eH-1,tf:tfc.h}); } else { trend=-1; add(-10,"trendDownD",{d:price/eH-1,tf:tfc.h}); }
  if(e20&&e50) e20>e50 ? add(5,"emaUp",{tf:tfc.b}) : add(-5,"emaDown",{tf:tfc.b});
  // 6. FOMO і падаючий ніж
  if(ch>0.18) add(-10,"fomo",{ch}); else if(ch<-0.18) fut ? add(8,"knifeShort",{ch}) : add(-5,"knife",{ch});
  // 7. Хвилі Еліотта (в обидва боки)
  const w=elliottBoth(c,ap); if(w) add(w.p,w.k,w.v);
  // 8. Фандинг і ліквідації
  const fr=fund[sym]; if(fr!==undefined){ if(fr<-0.0003) add(7,"fundNeg",{fr}); else if(fr>0.0005) add(-7,"fundPos",{fr}); }
  const a={sym,base,price,ch,heat,rb,atr:A,trend,fr,F}; a.score=total(F); return a;
}
// 9. Кити в стакані
function applyBook(a,book){
  const bids=book.bids.map(([p,q])=>[p,p*q]), asks=book.asks.map(([p,q])=>[p,p*q]);
  const bv=bids.reduce((s,x)=>s+x[1],0), av=asks.reduce((s,x)=>s+x[1],0); if(!bv||!av) return;
  const imb=bv/av;
  if(imb>=1.4) a.F.push({p:8,k:"whaleBid",v:{r:imb}}); else if(imb<=0.7) a.F.push({p:-8,k:"whaleAsk",v:{r:1/imb}});
  const med=arr=>{ const s=arr.map(x=>x[1]).sort((x,y)=>x-y); return s[Math.floor(s.length/2)]||0; };
  const wb=bids.filter(x=>x[0]>=a.price*0.97).sort((x,y)=>y[1]-x[1])[0], wa=asks.filter(x=>x[0]<=a.price*1.03).sort((x,y)=>y[1]-x[1])[0];
  if(wb&&wb[1]>med(bids)*8) a.F.push({p:4,k:"wallBid",v:{val:wb[1],price:wb[0],d:wb[0]/a.price-1}});
  if(wa&&wa[1]>med(asks)*8) a.F.push({p:-4,k:"wallAsk",v:{val:wa[1],price:wa[0],d:wa[0]/a.price-1}});
  a.score=total(a.F); a.book=true;
}

/* Позиція: dir 1 = лонг, −1 = шорт. Вартість у балансі = маржа + нереалізований P&L */
const pv = p => { const x=prices[p.sym]||p.last||p.entry, up=(p.dir||1)*p.qty*(x-p.entry), M=p.margin??p.cost; return {x,up,M,val:M+up}; };
const invested = () => Object.values(S.pos).reduce((s,p)=>s+pv(p).val,0);
const equity = () => S.cash+invested();
const byWeight = F => [...F].sort((x,y)=>Math.abs(y.p)-Math.abs(x.p));
function log(k,v={}){ S.log.unshift({t:Date.now(),k,v}); S.log.length=Math.min(S.log.length,60); }
function point(){ S.hist.push({t:Date.now(),eq:equity()}); if(S.hist.length>2000) S.hist.splice(0,S.hist.length-2000); }

function openPos(a,dir,rank,n){
  const eq=equity(), price=prices[a.sym]||a.price, fut=FUT(), feeR=EX[EXN].fee[MKT], tfc=TFC();
  const extra=Math.max(0,Math.abs(a.score)-TH)/(100-TH)*0.12, pct=Math.min(0.17,0.05+extra);
  const stopD=Math.max(2*a.atr/price,tfc.minStop);
  let lev=fut?S.lev:1, levCut=null;
  if(fut){ const maxLev=Math.max(1,Math.floor(0.7/stopD)); if(maxLev<lev){ levCut={from:lev,to:maxLev,d:-dir*stopD}; lev=maxLev; } }
  let margin=eq*pct, notional=margin*lev, lim=null;
  const riskCap=eq*RISK_MAX/(stopD+2*feeR);
  if(notional>riskCap){ notional=riskCap; margin=notional/lev; lim="szLimRisk"; }
  const avail=S.cash-eq*RESERVE;
  if(margin+notional*feeR>avail){ margin=Math.max(0,avail)/(1+lev*feeR); notional=margin*lev; lim="szLimCash"; }
  if(margin<10){ log("lNoCash",{base:a.base,score:a.score}); return false; }
  const fee=notional*feeR, qty=notional/price, stop=price*(1-dir*stopD), tp=price*(1+dir*stopD*1.5);
  const liq=fut?price*(1-dir*(1/lev-MMR)):null, risk=notional*(stopD+2*feeR);
  S.cash-=margin+fee;
  S.pos[a.sym]={sym:a.sym,base:a.base,dir,lev,qty,entry:price,margin,notional,stop,tp,liq,atr:a.atr,t:Date.now(),score:a.score,be:false,last:price,feeIn:fee,fund:0,fr:a.fr??0,tf:S.tf};
  const sizing=[{k:"szBase",v:{fut,extra,pct,eq}}, fut?{k:"szLev",v:{lev}}:null, levCut?{k:"szLevCut",v:levCut}:null, lim?{k:lim}:null,
    {k:"szTotal",v:{fut,dir,size:margin,margin,notional,pctEq:margin/eq,qty,base:a.base,price}},
    {k:"szStop",v:{stop,d:stopD,dir,risk,riskPct:risk/eq,tf:tfc.b}},
    fut?{k:"szLiq",v:{liq,d:liq/price-1}}:null,
    {k:"szTarget",v:{tp,d:dir*stopD*1.5}},
    {k:"szFee",v:{ex:EX[EXN].name,fee,rate:feeR}},
    fut&&a.fr!==undefined?{k:"szFund",v:{fr:a.fr,pay:notional*a.fr*dir}}:null].filter(Boolean);
  S.trades.unshift({t:Date.now(),side:"open",mkt:MKT,dir,lev,base:a.base,sym:a.sym,price,qty,value:notional,margin,fee,score:a.score,
    why:{k:"why",v:{score:a.score,th:TH,rank,n,dir}},F:byWeight(a.F),sizing});
  fut ? log("lOpen",{dir,base:a.base,lev,notional,margin,score:a.score}) : log("lBuy",{base:a.base,size:margin,score:a.score,n:a.F.filter(f=>f.p>0).length});
  EX[EXN].wsSync(ws); point(); heavy=true; return true;
}
function closePos(sym,reason,detail,atPrice){
  const p=S.pos[sym]; if(!p) return; const dir=p.dir||1, M=p.margin??p.cost, feeR=EX[EXN].fee[MKT];
  const x=atPrice ?? (prices[sym]||p.last||p.entry), up=dir*p.qty*(x-p.entry), fee=p.qty*x*feeR;
  const back=reason==="rLiq"?0:Math.max(0,M+up-fee);
  S.cash+=back; delete S.pos[sym];
  const pnl=back-M-(p.feeIn||0)-(p.fund||0), fut=!!p.liq;
  S.trades.unshift({t:Date.now(),side:"close",mkt:fut?"futures":"spot",dir,lev:p.lev||1,base:p.base,sym,price:x,qty:p.qty,value:back,fee,
    fees:fee+(p.feeIn||0),fund:p.fund||0,margin:M,pnl,pnlPct:pnl/M,reason,detail,held:Date.now()-p.t,entry:p.entry});
  if(S.trades.length>300) S.trades.length=300;
  fut ? log("lClose",{dir,base:p.base,reason,pnl,pct:pnl/M}) : log("lSell",{base:p.base,reason,pnl,pct:pnl/M});
  point(); heavy=true;
}
function checkExits(){
  if(!S.running) return;
  for(const s in S.pos){ const p=S.pos[s], x=prices[s]; if(!x) continue; p.last=x; const d=p.dir||1;
    if(p.liq && (d>0?x<=p.liq:x>=p.liq)) closePos(s,"rLiq",{k:"dLiq",v:{liq:p.liq}},p.liq);
    else if(d>0?x<=p.stop:x>=p.stop) p.be ? closePos(s,"rBE",{k:"dBE",v:{stop:p.stop}}) : closePos(s,"rStop",{k:"dStop",v:{stop:p.stop}});
    else if(d>0?x>=p.tp:x<=p.tp) closePos(s,"rTarget",{k:"dTarget",v:{tp:p.tp}});
    else if(!p.be && d*(x-p.entry)>=1.5*p.atr){ p.stop=d>0?Math.max(p.stop,p.entry*1.003):Math.min(p.stop,p.entry*0.997); p.be=true; log("lBE",{base:p.base,stop:p.stop}); }
  }
}
/* Фандинг кожні 8 годин: лонги платять при додатній ставці, шорти отримують, і навпаки */
function applyFunding(){
  const b=Math.floor(Date.now()/H8)*H8; if(!FUT()){ S.lastFund=b; return; } if(b<=S.lastFund) return;
  S.lastFund=b; let total=0, n=0;
  for(const s in S.pos){ const p=S.pos[s]; if(!p.liq||!p.fr) continue; const pay=p.qty*(prices[s]||p.entry)*p.fr*(p.dir||1); S.cash-=pay; p.fund=(p.fund||0)+pay; total+=pay; n++; }
  if(n) log("lFund",{n,total});
}

/* ===================== Скан ринку ===================== */
const eligible = t => { if(!t.sym.endsWith("USDT")) return false; const b=t.sym.slice(0,-4);
  return b.length>0 && !STABLE.has(b) && !/(UP|DOWN|BULL|BEAR|\d[LS])$/.test(b) && t.qv>5e6 && t.price>0 && (t.count===undefined||t.count>1000); };
const allowLong = () => !FUT() || S.dirMode!=="short";
const allowShort = () => FUT() && S.dirMode!=="long";

async function scan(){
  if(scanning) return; scanning=true; heavy=true; render();
  const ex=EXN, mkt=MKT, A=EX[ex], tfc=TFC(), fut=mkt==="futures";
  const chk=()=>{ if(ex!==EXN||mkt!==MKT) throw new Error("__switched"); };
  try{
    progress={k:"pTickers",v:{ex:A.name}};
    const tick=await A.tickers(mkt); chk();
    tick.forEach(t=>{ if(t.price>0) prices[t.sym]=t.price; });
    const uni=tick.filter(eligible).sort((a,b)=>b.qv-a.qv).slice(0,TOPN);
    for(const s in S.pos) if(!uni.some(u=>u.sym===s)){ const t=tick.find(x=>x.sym===s); if(t) uni.push(t); }
    let fund={}; try{ fund=await A.funding(); }catch(e){} chk();
    const res=[]; let done=0;
    await pool(uni,4,async t=>{
      const [kb,kh]=await Promise.all([A.klines(mkt,t.sym,tfc.b,300),A.klines(mkt,t.sym,tfc.h,120)]); chk();
      if(kb.length>60) res.push(analyze(t,kb,kh,fund,tfc,fut));
      progress={k:"pCalc",v:{i:++done,n:uni.length}};
    });
    chk(); if(!res.length) throw new Error("no data");
    res.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));
    progress={k:"pBook"};
    await pool(res.filter(a=>Math.abs(a.score)>=25||S.pos[a.sym]).slice(0,10),3,async a=>{ const b=await A.book(mkt,a.sym); chk(); applyBook(a,b); });
    chk(); res.sort((a,b)=>b.score-a.score);
    S.scan=res.map(a=>({sym:a.sym,base:a.base,score:a.score,heat:a.heat,rb:a.rb,ch:a.ch,trend:a.trend,fr:a.fr,tf:{b:tfc.b,m:tfc.m,h:tfc.h},F:byWeight(a.F)}));
    S.universe=res.length; S.lastScan=Date.now();
    if(S.running){
      // Закриття за розворотом індикаторів і за простоєм
      for(const a of res){ const p=S.pos[a.sym]; if(!p) continue; p.score=a.score; if(a.fr!==undefined) p.fr=a.fr; const d=p.dir||1;
        if(d*a.score<=-CLOSE_TH) closePos(a.sym,"rFlip",{k:"dFlip",v:{score:a.score,th:-d*CLOSE_TH,F:a.F.filter(f=>f.p*d<0).sort((x,y)=>x.p*d-y.p*d).slice(0,3)}});
        else { const {up,M}=pv(p); if(Date.now()-p.t>(TFS[p.tf]||tfc).idle*3600e3 && up/M<0.005) closePos(a.sym,"rIdle",{k:"dIdle"}); }
      }
      // Кандидати на вхід
      const longs=allowLong()?res.filter(a=>a.score>=TH):[], shorts=allowShort()?[...res].reverse().filter(a=>a.score<=-TH):[];
      const cand=[...longs.map((a,i)=>({a,dir:1,rank:i+1})),...shorts.map((a,i)=>({a,dir:-1,rank:i+1}))].sort((x,y)=>Math.abs(y.a.score)-Math.abs(x.a.score));
      let opened=0, skip=null;
      for(const {a,dir,rank} of cand){
        if(S.pos[a.sym]) continue;
        if(Object.keys(S.pos).length>=MAX_POS){ skip=skip||{k:"lMax",v:{base:a.base,score:a.score,max:MAX_POS}}; break; }
        if(dir>0 && a.trend!==1 && a.score<70){ skip=skip||{k:"lTrend",v:{base:a.base,score:a.score}}; continue; }
        if(dir<0 && a.trend!==-1 && a.score>-70){ skip=skip||{k:"lTrendS",v:{base:a.base,score:a.score}}; continue; }
        if(openPos(a,dir,rank,res.length)) opened++;
      }
      if(!opened){ const best=[...res].sort((x,y)=>Math.abs(y.score)-Math.abs(x.score))[0]; skip ? log(skip.k,skip.v) : log("lWait",{base:best.base,score:best.score,th:TH}); }
    } else log("lPausedScan");
  }catch(e){ if(e.message!=="__switched") log("lErr",{ex:A.name,msg:e.name==="AbortError"?"timeout":e.message}); }
  finally{ scanning=false; progress=null; if(ex===EXN&&mkt===MKT){ nextScan=Date.now()+tfc.scan; save(); } heavy=true; dirty=true; render(); }
}

function connectWS(){
  const A=EX[EXN], urls=A.wsUrls(MKT); let sock;
  try{ sock=new WebSocket(urls[wsIdx%urls.length]); }catch(e){ wsIdx++; setTimeout(()=>{ if(!ws) connectWS(); },5000); return; }
  ws=sock;
  sock.onopen=()=>{ if(ws!==sock) return; wsOk=true; A.wsOpen(sock); dirty=true; };
  sock.onmessage=e=>{ if(ws!==sock) return; try{ A.wsMsg(e.data); dirty=true; }catch(err){} };
  sock.onclose=()=>{ if(ws!==sock) return; wsOk=false; wsIdx++; setTimeout(()=>{ if(ws===sock) connectWS(); },5000); };
  sock.onerror=()=>{ try{ sock.close(); }catch(e){} };
}
function reconnectWS(){ const old=ws; ws=null; wsOk=false; wsIdx=0; if(old) try{ old.close(); }catch(e){} connectWS(); }
async function pollPrices(){
  const syms=Object.keys(S.pos); if(wsOk||!syms.length) return; const ex=EXN, mkt=MKT;
  try{ const m=await EX[ex].prices(mkt,syms); if(ex===EXN&&mkt===MKT){ Object.assign(prices,m); dirty=true; } }catch(e){}
}

function drawChart(){
  const cv=$("chart"), dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
  cv.width=w*dpr; cv.height=h*dpr; const g=cv.getContext("2d"); g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement), col=n=>cs.getPropertyValue(n).trim();
  const pts=[...S.hist,{t:Date.now(),eq:equity()}], ys=pts.map(p=>p.eq);
  let lo=Math.min(START,...ys), hi=Math.max(START,...ys); const pad=Math.max((hi-lo)*0.15,2); lo-=pad; hi+=pad;
  const t0=pts[0].t, t1=Math.max(pts[pts.length-1].t,t0+1), X=t=>(t-t0)/(t1-t0)*(w-2)+1, Y=v=>h-4-(v-lo)/(hi-lo)*(h-8);
  g.setLineDash([4,4]); g.strokeStyle=col("--line"); g.lineWidth=1; g.beginPath(); g.moveTo(0,Y(START)); g.lineTo(w,Y(START)); g.stroke(); g.setLineDash([]);
  g.fillStyle=col("--muted"); g.font="11px Manrope,sans-serif"; g.fillText(T("chartStart"),4,Y(START)-5);
  const c=equity()>=START?col("--gain"):col("--loss");
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(X(p.t),Y(p.eq)):g.moveTo(X(p.t),Y(p.eq)));
  g.strokeStyle=c; g.lineWidth=2; g.lineJoin="round"; g.stroke();
  g.lineTo(X(t1),h); g.lineTo(X(t0),h); g.closePath(); g.globalAlpha=.12; g.fillStyle=c; g.fill(); g.globalAlpha=1;
  const lp=pts[pts.length-1]; g.beginPath(); g.arc(X(lp.t),Y(lp.eq),3.5,0,7); g.fillStyle=c; g.fill();
}

$("runBtn").onclick=()=>{ S.running=!S.running; log(S.running?"lRun":"lPause"); save(); render(); };
$("scanBtn").onclick=()=>scan();
$("resetBtn").onclick=()=>{ if(!confirm(T("confirmReset",{ex:EX[EXN].name,mkt:T(FUT()?"mktFut":"mktSpot")}))) return;
  const keep={tf:S.tf,lev:S.lev,dirMode:S.dirMode}; S={...fresh(),...keep}; seedPrices(); log("lReset"); heavy=true; save(); render(); nextScan=Date.now()+500; };
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; try{ localStorage.setItem("paperbot.lang",LANG); }catch(e){} applyStatic(); });
document.querySelectorAll("#exSeg button").forEach(b=>b.onclick=()=>{ if(b.dataset.ex===EXN) return; save(); EXN=b.dataset.ex; try{ localStorage.setItem("paperbot.ex",EXN); }catch(e){} switchAccount(); });
document.querySelectorAll("#mktOpts button").forEach(b=>b.onclick=()=>{ if(b.dataset.mkt===MKT) return; save(); MKT=b.dataset.mkt; try{ localStorage.setItem("paperbot.mkt",MKT); }catch(e){} switchAccount(); });
document.querySelectorAll("#tfOpts button").forEach(b=>b.onclick=()=>{ if(b.dataset.tf===S.tf) return; S.tf=b.dataset.tf; S.scan=[]; nextScan=Date.now()+300; save(); applyStatic(); });
document.querySelectorAll("#levOpts button").forEach(b=>b.onclick=()=>{ S.lev=+b.dataset.lev; save(); heavy=true; render(); });
document.querySelectorAll("#dirOpts button").forEach(b=>b.onclick=()=>{ S.dirMode=b.dataset.dir; save(); heavy=true; render(); });
$("themeBtn").onclick=()=>{ const r=document.documentElement, dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark"; try{ localStorage.setItem("paperbot.theme",r.dataset.theme); }catch(e){} drawChart(); };
try{ const th=localStorage.getItem("paperbot.theme")||localStorage.getItem("paperbot.v1.theme"); const th2=window.CH?CH.theme(th):th; if(th2) document.documentElement.dataset.theme=th2; }catch(e){}
addEventListener("resize",drawChart);

/* ===================== Головний цикл ===================== */
let lastPoint=Date.now(), lastPoll=0, lastPing=Date.now();
setInterval(()=>{
  const now=Date.now();
  if(dirty){ checkExits(); dirty=false; }
  applyFunding();
  if(now-lastPoint>60000){ point(); lastPoint=now; save(); }
  if(now-lastPoll>15000){ lastPoll=now; pollPrices(); }
  if(now-lastPing>20000){ lastPing=now; EX[EXN].wsPing(ws); EX[EXN].wsSync(ws); }
  if(now>=nextScan && !scanning) scan();
  render();
},1000);
applyStatic(); connectWS();
</script>
<script>
(function () {
  if (!window.CH) return;
  var o = function (n) { return function () { return { name: 'paper-bot-' + n, title: CH.t('bot')[0] + ' · ' + (document.querySelector('#brandSub') || {}).textContent }; }; };
  CH.cam(document.querySelector('.hero'), function () { return document.querySelector('.hero'); }, { float: true, opts: o('account') });
  ['pf', 'jr', 'sc'].forEach(function (id) {
    var sec = document.getElementById(id), h = sec && sec.querySelector('h2'); if (!h) return;
    h.style.display = 'flex'; h.style.alignItems = 'center'; h.style.gap = '10px';
    var sp = document.createElement('span'); sp.style.flex = '1'; h.appendChild(sp);
    CH.cam(h, sec, { opts: o(id === 'pf' ? 'portfolio' : id === 'jr' ? 'journal' : 'scan') });
  });
})();
</script>
</body>
</html>
