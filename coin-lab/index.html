    return { price, index, conf: b.conf, piv: b.piv, dev: b.dev, best: b, alt, label: NAMES[b.key], trend: b.sign, bias: index < 40 ? 1 : index > 60 ? -1 : 0,

  // The next move of the count: direction, first target, stop (invalidation) and the projected path

    const b = a && a.best; if (!b || !b.path || !b.path.length) return null;

    // the invalidation must be on the other side of the price, otherwise the count is already broken
    if (dir > 0 ? b.invalid >= p0 : b.invalid <= p0) return null;
    if (OPT.confirm === 'kd' && a.mom && dir * a.mom.kd < 0) return null;
    if (OPT.confirm === 'rsi' && a.mom && dir * a.mom.slope < 0) return null;
    if (OPT.minConf && b.conf < OPT.minConf) return null;
    return { dir, target: first.p, stop: b.invalid, path: b.path, bars: first.bars };
  }

  return { analyze, zigzag, impulseScore, scenarios, forecastPath, rsiArr, RAW, NAMES };
})();

/* ================= DEEP ANALYSIS =================
   Everything Coin Lab knows about one coin, on five timeframes at once, put together into one report:
   per-timeframe trend, momentum, heat with the coin's own zones, Elliott count; the market regime; levels;

  const P=fc.plan; const rows=[[t(P.side==="long"?"planEntryL":"planEntryS"),`${fp(P.entry[0])}–${fp(P.entry[1])}`],[t("stop"),fp(P.stop)],["TP1",fp(P.tp1)],["TP2",fp(P.tp2)]];
  if(A.ew.ok) rows.push([t("wave")+" "+A.ew.forming, "→ "+fp(A.ew.target)]);
  rows.forEach(([k,v],i)=>{ const y=375+i*44; x.fillStyle=C.mu; x.font=F(16,500); x.fillText(k,vx,y); x.fillStyle=C.tx; x.font=F(20,700); x.fillText(v,vx,y+22,280); });
  // watermark
  x.save(); x.globalAlpha=0.09; x.fillStyle=C.tx; x.font=F(84,800); x.textAlign="center"; x.translate(440,430); x.rotate(-0.12); x.fillText("t.me/Cr_hunters",0,0); x.restore();
  x.fillStyle=C.ac; x.font=F(20,700); x.textAlign="left"; x.fillText("t.me/Cr_hunters",40,650); x.fillStyle=C.mu; x.font=F(14,500); x.textAlign="right"; x.fillText(t("nfa"),W-40,650); x.textAlign="left";
}
async function tgSend(kind){
  if(!S.tgToken||!S.tgChat){ toast(t("tgNeed")); openSettings(); return; }
  try{
    if(kind==="photo"){
      const blob=await new Promise(r=>$("shareCv").toBlob(r,"image/png")); const fd=new FormData(); fd.append("chat_id",S.tgChat); fd.append("caption",postText().slice(0,1000)); fd.append("photo",blob,"card.png");
      const r=await fetch(`https://api.telegram.org/bot${S.tgToken}/sendPhoto`,{method:"POST",body:fd}); if(!r.ok) throw new Error(r.status);
    } else {
      const r=await fetch(`https://api.telegram.org/bot${S.tgToken}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:S.tgChat,text:postText()})}); if(!r.ok) throw new Error(r.status);
    }
    toast(t("tgOk"));
  }catch(e){ toast(t("tgErr")+" "+e.message); }

/* ================= LIVE (WebSocket) ================= */
function closeWS(){ ST.ws.forEach(w=>{ try{ clearInterval(w._p); w.onclose=null; w.close(); }catch(e){} }); ST.ws=[]; }
function openWS(cfg, onItems){
  try{
    const w=new WebSocket(cfg.url);
    w.onopen=()=>{ if(cfg.sub) w.send(JSON.stringify(cfg.sub)); if(cfg.ping) w._p=setInterval(()=>{ try{ w.send(typeof cfg.ping==="string"?cfg.ping:JSON.stringify(cfg.ping)); }catch(e){} },20000); };
    w.onmessage=e=>{ if(e.data==="pong") return; let m; try{ m=JSON.parse(e.data); }catch(_){ return; } const it=cfg.parse(m); if(it&&it.length) onItems(it); };
    w.onclose=()=>{ clearInterval(w._p); setTimeout(()=>{ if(ST.ws.includes(w)){ ST.ws=ST.ws.filter(x=>x!==w); openWS(cfg,onItems); } }, 4000); };
    ST.ws.push(w);
  }catch(e){ console.warn(e); }
}
let uiTick=0;
function connectWS(){
  closeWS(); const ex=EX[S.exch], sym=symNow();
  openWS(ex.wsTrades(sym,fut()), items=>{
    for(const it of items){ ST.price=it.p; const n=it.p*it.q*ST.qUsd; if(n>=S.whaleTrade){ ST.tape.unshift({...it,n}); ST.tape.length=Math.min(ST.tape.length,60); } }
    const now=Date.now(); if(now-uiTick>700){ uiTick=now; $("hPrice").textContent=fp(ST.price); if(document.querySelector("#p-wh.on")) renderTape(); }
  });
  openWS(ex.wsLiq(S.base), items=>{
    const mul = USDQ.includes(quoteNow())?1:1; // liquidations are on USDT perps
    for(const it of items){ const n=it.p*it.q*mul; ST.liqs.unshift({...it,n}); ST.liqTot[it.side]+=n; } ST.liqs.length=Math.min(ST.liqs.length,200);
    if(document.querySelector("#p-lq.on")) renderLiqFeed();
  });
}

/* ================= ALERTS ================= */
function checkAlerts(){
  const A=ST.A, key=S.exch+S.base+quoteNow()+S.tf, v=A.fc.verdict, prev=ST.lastVerdict[key]; ST.lastVerdict[key]=v;
  if(!S.alerts || prev===undefined) return;
  const msgs=[];
  if(prev!==v && v!=="vNeutral") msgs.push(t("alVerdict",{s:pairName(), v:t(v)}));
  if(A.conf==="buy"||A.conf==="sell") msgs.push(t("alConf",{s:pairName(), c:t("conf_"+A.conf)}));
  if(A.spike && A.spike.i===ST.k.length-1) msgs.push(t("alSpike",{s:pairName(), r:fn(A.spike.ratio,1)}));
  if(!msgs.length || Date.now()-ST.lastAlert < S.alertCd*60000) return;
  ST.lastAlert=Date.now(); const text=msgs.join("\n");
  if(window.CH) window.CH.log({tool:"lab",coin:S.base,q:quoteNow(),ex:S.exch,tf:S.tf,lines:msgs,ch:["screen"].concat("Notification" in window&&Notification.permission==="granted"?["browser"]:[],S.tgAuto&&S.tgToken&&S.tgChat?["telegram"]:[])});
  if("Notification" in window && Notification.permission==="granted") new Notification("CRYPTO HUNTERS", {body:text});
  toast(msgs[0]);
  if(S.tgAuto && S.tgToken && S.tgChat) fetch(`https://api.telegram.org/bot${S.tgToken}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:S.tgChat,text:text+"\n\n"+postText()})}).catch(()=>{});
}

/* ================= HINTS ================= */
function hintParams(k){
  const p={n:S.volSma, x:S.volSpike, h:S.horizon, lo:S.heatBuy, hi:S.heatSell, f:S.macdF, s:S.macdS, g:S.macdG, a:S.emaF, b:S.emaM, c:S.emaS, k:S.bbK, m:S.wallMult, w:fbig(S.wallMin)};
  p.p = {rsi:S.rsiP, mfi:S.mfiP, bb:S.bbP, atr:S.atrP}[k] ?? S.rsiP; return p;
}
function hint(k){ const H=(HINTS[S.lang]||HINTS.uk)[k] || HINTS.en[k]; if(!H) return null; const P=hintParams(k); const f=s=>s.replace(/\{(\w+)\}/g,(_,x)=>P[x]??""); return [f(H[0]), f(H[1])]; }
const ib = k => `<button class="ib" data-tip="${k}" aria-label="${esc(hint(k)?.[0]||"?")}">i</button>`;
const GUIDES={ "@ov":["ema","bb","ew","sr","fib","fc","probB","walls","liq","sig"], "@panes":["vol","prob","heat","rsi","stoch","mfi","macd","adx","delta","cvd","obv"] };
let tipFor=null, tipKey=null;
function showTip(key, anchor){
  const el=$("tip");
  if(tipKey===key && el.classList.contains("on")){ hideTip(); return; }
  let title, body;
  if(GUIDES[key]){ title=t(key==="@ov"?"guideOv":"guidePanes"); body=GUIDES[key].map(k=>{ const h=hint(k); return h? `<div class="gi"><b>${esc(h[0])}</b>${h[1].split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""; }).join(""); }
  else { const h=hint(key); if(!h) return; title=h[0]; body=h[1].split("\n").map(x=>`<p>${esc(x)}</p>`).join(""); }
  el.innerHTML=`<h4><span>${esc(title)}</span><button type="button" aria-label="Close" data-tipclose>✕</button></h4>${body}`;
  el.classList.add("on");
  document.querySelectorAll('.ib[aria-expanded="true"]').forEach(b=>b.setAttribute("aria-expanded","false"));
  anchor.setAttribute("aria-expanded","true"); tipFor=anchor; tipKey=key;
  const mobile=window.innerWidth<700; el.classList.toggle("sheet", mobile);
  placeTip();
}
function placeTip(){
  const el=$("tip"); if(!el.classList.contains("on")||!tipFor) return;
  if(window.innerWidth<700){ el.style.left=""; el.style.top=""; return; }
  if(!tipFor.isConnected){ hideTip(); return; }
  const r=tipFor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  if(r.bottom<0||r.top>window.innerHeight){ hideTip(); return; }
  let x=clamp(r.left+r.width/2-w/2, 8, window.innerWidth-w-8), y=r.bottom+8;
  if(y+h>window.innerHeight-8) y=Math.max(8, r.top-h-8);
  el.style.left=x+"px"; el.style.top=y+"px";
}
function hideTip(){ $("tip").classList.remove("on"); if(tipFor) tipFor.setAttribute("aria-expanded","false"); tipFor=null; tipKey=null; }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tip]");
  if(b){ e.preventDefault(); e.stopPropagation(); showTip(b.dataset.tip, b); return; }
  if(e.target.closest("[data-tipclose]")||!e.target.closest("#tip")) hideTip();
}, true);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideTip(); });
window.addEventListener("scroll",placeTip,{passive:true}); window.addEventListener("resize",placeTip);

  ["gBt",[["btSL","n",0.5,10,0.1],["btTP","n",0.5,20,0.1],["btFee","n",0,1,0.01],["btHold","n",2,500,1],["btTrend","c"]]],
  ["gAl",[["alerts","c"],["alertCd","n",1,1440,1],["tgToken","p"],["tgChat","t"],["tgAuto","c"]]]
];
const REFETCH=new Set(["bars"]);
function buildSettings(){
  $("setBody").innerHTML=SCHEMA.map(([g,fs])=>`<fieldset><legend>${esc(t(g))}</legend>${fs.map(([k,ty,a,b,st])=>{
    const id="s_"+k, lab=`<label for="${id}">${esc(t(id))}</label>`;
    if(ty==="n") return `<div class="fld">${lab}<input id="${id}" data-k="${k}" type="number" min="${a}" max="${b}" step="${st}" value="${S[k]}"></div>`;
    if(ty==="s") return `<div class="fld">${lab}<select id="${id}" data-k="${k}">${a.map(o=>`<option value="${o}" ${S[k]===o?"selected":""}>${esc(t("o_"+o))}</option>`).join("")}</select></div>`;
    if(ty==="c") return `<div class="fld">${lab}<input id="${id}" data-k="${k}" type="checkbox" ${S[k]?"checked":""}></div>`;
    return `<div class="fld">${lab}<input id="${id}" data-k="${k}" type="${ty==="p"?"password":"text"}" value="${esc(S[k]||"")}" autocomplete="off"></div>`;
  }).join("")}</fieldset>`).join("") + `<p class="note" style="margin-top:16px">${esc(t("tgHelp"))}</p><div class="ctool"><button class="btn" id="tgTest">${esc(t("tgTest"))}</button><button class="btn" id="notifBtn">${esc(t("notifAllow"))}</button></div>`;
  $("setBody").querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",()=>{
    const k=el.dataset.k; let v = el.type==="checkbox"? el.checked : el.type==="number"? +el.value : el.value;
    if(el.type==="number"){ if(!isFinite(v)) return; v=clamp(v,+el.min,+el.max); el.value=v; }
    S[k]=v; save();
    if(k==="heatBuy"&&$("lvLow")) $("lvLow").value=v; if(k==="heatSell"&&$("lvHigh")) $("lvHigh").value=v;
    if(k==="refresh") setTimer();
    if(k==="hrH"||k==="paneH"){ applyRowH(); return; }
    if(k==="alerts"&&v&&"Notification" in window&&Notification.permission==="default") Notification.requestPermission();
    if(!ST.k.length) return;
    if(REFETCH.has(k)) run(); else if(!["tgToken","tgChat","tgAuto","alerts","alertCd","refresh"].includes(k)){ compute(); renderAll(false); }
  }));
  $("tgTest").onclick=()=>tgSend("text");
  $("notifBtn").onclick=()=>{ if("Notification" in window) Notification.requestPermission().then(p=>toast(p)); };
}
function applyRowH(){ const st=document.documentElement.style; st.setProperty("--hrh", clamp(+S.hrH||200,100,500)+"px"); st.setProperty("--pnh", clamp(+S.paneH||150,80,400)+"px"); }
function setLevels(lo,hi){
  if(!isFinite(lo)||!isFinite(hi)) return; lo=clamp(Math.round(lo),1,49); hi=clamp(Math.round(hi),51,99);

  $("lvLow").value=lo; $("lvHigh").value=hi; const a=$("s_heatBuy"), b=$("s_heatSell"); if(a) a.value=lo; if(b) b.value=hi;
  if(ST.k.length){ compute(); renderAll(false); }
}
function openSettings(){ $("drawer").classList.add("open"); $("scrim").classList.add("on"); }
function closeSettings(){ $("drawer").classList.remove("open"); $("scrim").classList.remove("on"); }

/* ================= I18N APPLY / CONTROLS ================= */
function t(k,p){ const d=I18N[S.lang]||I18N.uk; let s = d[k] ?? I18N.en[k] ?? k; if(p) s=s.replace(/\{(\w+)\}/g,(_,x)=>p[x]??""); return s; }
function applyI18n(){
  document.documentElement.lang = S.lang==="uk"?"uk":S.lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  const bs=$("btSig"); [...bs.options].forEach(o=>o.textContent=t("sig_"+o.value));
  $("sym").placeholder=t("coinPh");
  buildToolbars(); buildSettings(); renderFavs();
  if(ST.A) renderAll(false);
}
function syncControls(){
  $("sym").value=S.base; $("quote").value=S.quote; $("exch").value=S.exch; $("tf").value=S.tf; $("lang").value=S.lang;
  $("quote").disabled=fut(); $("mkt").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===S.market)));
}
function setTheme(){ document.documentElement.dataset.theme=S.theme; applyChartTheme(); if(ST.A) renderAll(false); }
function renderFavs(){
  $("favs").innerHTML=S.favs.map(f=>`<button class="chip" data-fav="${esc(f)}"><b>${esc(f)}</b><span class="x" data-del="${esc(f)}" aria-label="remove">×</span></button>`).join("");

async function loadSymbols(){
  const key=S.exch+quoteNow(); if(ST.symCache[key]) return fillSyms(ST.symCache[key]);
  try{ const s=await EX[S.exch].symbols(quoteNow()); ST.symCache[key]=s.slice(0,400); fillSyms(ST.symCache[key]); }catch(e){}
}
function fillSyms(list){ $("symlist").innerHTML=list.map(s=>`<option value="${esc(s.b)}">`).join(""); }
let timer=null;
function setTimer(){ clearInterval(timer); if(S.refresh>0) timer=setInterval(()=>{ if(!document.hidden) run(true); }, Math.max(10,S.refresh)*1000); }
function go(){ const v=$("sym").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,""); if(!v) return; let b=v; for(const q of ["USDT","USDC","FDUSD","BTC"]) if(v.length>q.length&&v.endsWith(q)){ b=v.slice(0,-q.length); if(!fut()) S.quote=q; break; } S.base=b; save(); syncControls(); run(); }

  $("tf").onchange=e=>{ S.tf=e.target.value; save(); run(); };
  $("mkt").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.market=b.dataset.v; save(); syncControls(); loadSymbols(); run(); };
  $("lang").onchange=e=>{ S.lang=e.target.value; save(); applyI18n(); };

  $("cpText").onclick=()=>navigator.clipboard?.writeText(postText()).then(()=>toast(t("copied")));

  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && ST.k.length && S.refresh>0) run(true); });
}
