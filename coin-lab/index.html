<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<style id="ch-css">
/* CRYPTO HUNTERS: the shared look of every tool.
   The colors are the ones of Heat Index (the main app), so all tools read as one product.
   Each tool maps its own variable names to these tokens in a small <style id="ch-skin"> block. */
:root{
  --ch-bg:#fff;--ch-s1:#f4f4f2;--ch-tx:#1b1f24;--ch-t2:#5f6368;--ch-t3:#8a8f96;--ch-bd:#e3e3e0;--ch-bd2:#c9c9c4;
  --ch-acb:#e6f1fb;--ch-act:#0c447c;--ch-acd:#85b7eb;--ch-ac:#378add;
  --ch-okb:#eaf3de;--ch-okt:#27500a;--ch-erb:#fcebeb;--ch-ert:#791f1f;--ch-warn:#ba7517;
  --ch-up:#1d9e75;--ch-dn:#e24b4a;--ch-upb:rgba(29,158,117,.12);--ch-dnb:rgba(226,75,74,.12);
  --ch-brand:#c9820f;--ch-w:760px;--ch-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}}
:root[data-theme=dark]{
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}

/* ---- suite bar: brand, Telegram channel and the tools ---- */
.ch-top{background:var(--ch-bg);border-bottom:0.5px solid var(--ch-bd);font:14px/1.4 var(--ch-font);color:var(--ch-tx);position:relative;z-index:3}
.ch-in{max-width:var(--ch-w);margin:0 auto;padding:0 14px}
.ch-row{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.ch-brand{display:inline-flex;align-items:center;gap:8px;color:var(--ch-tx);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.ch-brand img,.ch-logo,.ch-logo svg{width:26px;height:26px;border-radius:8px;display:block;flex:0 0 auto}
.ch-brand span b{color:var(--ch-brand);font-weight:600}
.ch-sp{flex:1}
.ch-tg{display:inline-flex;align-items:center;gap:6px;color:var(--ch-act);background:var(--ch-acb);border:0.5px solid var(--ch-acd);border-radius:14px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap;min-height:28px}
.ch-tg svg{width:15px;height:15px;flex:0 0 auto}
.ch-tg:hover{border-color:var(--ch-act)}
.ch-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.ch-nav::-webkit-scrollbar{display:none}
.ch-nav a,.ch-nav span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 10px;border-radius:8px;color:var(--ch-t2);text-decoration:none;font-size:13px}
.ch-nav a:hover{color:var(--ch-tx);background:var(--ch-s1)}
.ch-nav span{background:var(--ch-acb);color:var(--ch-act);font-weight:500}
.ch-nav svg,.ch-links svg{width:15px;height:15px;flex:0 0 auto}
.ch-top a:focus-visible,.ch-links a:focus-visible,.ch-foot a:focus-visible,.ch-cam:focus-visible,.ch-shot button:focus-visible,.ch-shot a:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:420px){.ch-brand{font-size:13px}.ch-tg span{display:none}.ch-tg{padding:4px 8px}}

/* ---- links from a coin card to the other tools ---- */
.ch-links{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font:12px/1.3 var(--ch-font)}
.ch-links>em{font-style:normal;color:var(--ch-t3);margin-right:2px}
.ch-links a{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);text-decoration:none;background:transparent;white-space:nowrap;min-height:26px}
.ch-links a:hover{border-color:var(--ch-acd);color:var(--ch-act);background:var(--ch-acb)}
.ch-links svg{width:13px;height:13px}
.ch-links:empty{display:none}

/* ---- screenshot: camera button and preview ---- */
:root .ch-cam{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--ch-bd2);background:var(--ch-bg);color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;white-space:nowrap}
:root .ch-cam:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-cam svg{width:16px;height:16px}
:root .ch-cam.ch-float{position:absolute;top:10px;right:10px;z-index:2}
.ch-shot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.5);font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-shot[hidden]{display:none}
.ch-shot .ch-pn{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ch-shot img{display:block;width:100%;height:auto;border-radius:8px;border:0.5px solid var(--ch-bd)}
.ch-shot .ch-wait{padding:36px 0;text-align:center;color:var(--ch-t2)}
.ch-shot .ch-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:root .ch-shot .ch-acts>*{flex:1 1 auto;text-align:center;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:6px 12px;font:13px/1.2 var(--ch-font);cursor:pointer;text-decoration:none;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
:root .ch-shot .ch-acts>.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-shot p{margin:8px 2px 0;font-size:12px;color:var(--ch-t3)}

/* ---- footer ---- */
.ch-foot{border-top:0.5px solid var(--ch-bd);margin-top:24px;font:12px/1.5 var(--ch-font);color:var(--ch-t3);background:var(--ch-bg)}
.ch-foot .ch-in{padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ch-foot b{color:var(--ch-t2);font-weight:600;letter-spacing:.04em}
.ch-foot a{color:var(--ch-act);text-decoration:none}
.ch-foot a:hover{text-decoration:underline}

/* ---- base skin of every tool (the class is set on the body by ch.js) ---- */
body.ch-skin{font-family:var(--ch-font)!important;font-size:14px;line-height:1.45;-webkit-font-smoothing:auto}
body.ch-skin :is(h1,h2,h3,h4,input,select,button,textarea,summary,.brand){font-family:inherit!important;font-stretch:normal!important}
body.ch-skin :is(input,select,textarea){border-width:0.5px!important}
body.ch-skin ::selection{background:var(--ch-acb);color:var(--ch-act)}

/* ---- notification log ---- */
:root .ch-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;padding:0;flex:0 0 auto}
:root .ch-bell:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-bell svg{width:17px;height:17px}
.ch-bell b{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ch-dn);color:#fff;font:600 10px/17px var(--ch-font);text-align:center;box-sizing:border-box}
.ch-bell b[hidden]{display:none}
.ch-bell:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-lock,.ch-lock body{overflow:hidden}
.ch-log{position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-log[hidden]{display:none}
.ch-lp{width:min(440px,100%);height:100%;background:var(--ch-bg);border-left:0.5px solid var(--ch-bd2);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.ch-lp>header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.ch-lp h2{flex:1;margin:0;font:500 17px/1.3 var(--ch-font)}
:root .ch-x{width:32px;height:32px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;font-size:13px}
.ch-lf{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px;border-bottom:0.5px solid var(--ch-bd)}
.ch-lf:empty{display:none}
.ch-lf::-webkit-scrollbar{display:none}
:root .ch-lf button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:28px}
:root .ch-lf button svg{width:13px;height:13px}
:root .ch-lf button[aria-pressed=true]{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-ll{flex:1;overflow:auto;padding:4px 14px 14px;overscroll-behavior:contain}
.ch-le{border-bottom:0.5px solid var(--ch-bd);padding:11px 0 11px 10px;margin-left:-10px;border-left:2px solid transparent}
.ch-le.ch-new{border-left-color:var(--ch-ac)}
.ch-lm{display:flex;align-items:center;gap:6px;color:var(--ch-t3);font-size:12px;margin-bottom:3px}
.ch-lm svg{width:14px;height:14px}
.ch-lm em{font-style:normal;color:var(--ch-act);background:var(--ch-acb);border-radius:6px;padding:0 6px;font-size:11px}
.ch-lm time{margin-left:auto;white-space:nowrap}
.ch-le>b{display:block;font-weight:500;font-size:14px}
.ch-le p{margin:2px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-lc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.ch-lc span{font-size:11px;color:var(--ch-t3);border:0.5px solid var(--ch-bd);border-radius:6px;padding:1px 6px}
.ch-lc a{margin-left:auto;font-size:12px;color:var(--ch-act);text-decoration:none;padding:3px 0}
.ch-lc a:hover{text-decoration:underline}
.ch-l0{color:var(--ch-t2);padding:28px 4px;margin:0;text-align:center}
.ch-lp>footer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:0.5px solid var(--ch-bd)}
.ch-lh{flex:1;font-size:11px;color:var(--ch-t3)}
:root .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:5px 12px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:30px}
.ch-lp :is(button,a):focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:520px){.ch-lp{width:100%;border-left:0}}

/* ---- notification panel: tabs, rules, form, settings ---- */
:root .ch-log .ch-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:0.5px solid var(--ch-bd)}
:root .ch-log .ch-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ch-t2);font:500 13px/1.2 var(--ch-font);padding:9px 6px 8px;cursor:pointer;min-height:36px}
:root .ch-log .ch-tabs button[aria-selected=true]{color:var(--ch-tx);border-bottom-color:var(--ch-ac)}
.ch-log .ch-lf{padding-top:10px}
:root .ch-log .ch-add{display:block;width:100%;margin:12px 0 6px;border:0.5px dashed var(--ch-acd);background:var(--ch-acb);color:var(--ch-act);border-radius:12px;padding:10px;font:500 14px/1.2 var(--ch-font);cursor:pointer}
.ch-rule{border-bottom:0.5px solid var(--ch-bd);padding:11px 0}
.ch-rule.ch-offr>:not(.ch-rt){opacity:.6}
.ch-rt{display:flex;align-items:center;gap:8px}
.ch-rt b{font-weight:600;font-size:15px}
.ch-rt span{color:var(--ch-t3);font-size:12px;flex:1}
.ch-rule>p{margin:3px 0 0;font-size:14px}
.ch-rule>p.ch-note{color:var(--ch-t2);font-size:13px}
.ch-lc .ch-ok{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-lc .ch-err{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}
.ch-rm{display:flex;align-items:center;gap:6px;margin-top:7px}
.ch-rm small{flex:1;color:var(--ch-t3);font-size:12px}
:root .ch-log .ch-rm button,:root .ch-log .ch-quick button,:root .ch-log .ch-fh button,:root .ch-log .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 11px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;font-weight:400}
:root .ch-log .ch-lp>footer button.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500;padding:6px 18px;font-size:13px}
.ch-sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.ch-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ch-sw i{position:absolute;inset:0;border-radius:11px;background:var(--ch-bd2);transition:background .15s}
.ch-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.ch-sw input:checked+i{background:var(--ch-ac)}
.ch-sw input:checked+i::after{transform:translateX(16px)}
.ch-sw input:focus-visible+i{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-form{display:flex;flex-direction:column;gap:10px;padding:12px 0 4px}
.ch-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ch-t2);min-width:0}
:root .ch-log .ch-form :is(input:not([type=checkbox]),select){font:14px/1.3 var(--ch-font);color:var(--ch-tx);background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;box-sizing:border-box;margin:0}
:root .ch-log .ch-form :is(input,select):focus{outline:2px solid var(--ch-acd);outline-offset:0;border-color:var(--ch-acd)}
.ch-f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ch-f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-f2>label:only-child{grid-column:1/-1}
.ch-now{font-size:13px;color:var(--ch-t2);background:var(--ch-s1);border-radius:8px;padding:7px 10px}
.ch-quick{display:flex;flex-wrap:wrap;gap:5px}
.ch-fh{margin:0;font-size:12px;color:var(--ch-t3);line-height:1.45}
.ch-ferr{margin:0;color:var(--ch-ert);background:var(--ch-erb);border-radius:8px;padding:7px 10px;font-size:13px}
.ch-ferr[hidden]{display:none}
.ch-chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:14px!important;color:var(--ch-tx)!important;cursor:pointer}
.ch-chk input{width:18px;height:18px;margin:0;accent-color:var(--ch-ac)}

/* ---- bell on a coin card ---- */
:root .ch-links .ch-al{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-acd);border-radius:14px;color:var(--ch-act);background:var(--ch-acb);font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-al svg{width:13px;height:13px}
:root .ch-links .ch-al:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}

/* ---- on-screen alerts ---- */
.ch-toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1002;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 24px));font:14px/1.4 var(--ch-font)}
.ch-toast{position:relative;background:var(--ch-bg);color:var(--ch-tx);border:0.5px solid var(--ch-bd2);border-left:3px solid var(--ch-ac);border-radius:12px;padding:10px 36px 10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:chIn .2s ease-out}
.ch-toast b{display:block;font-weight:600}
.ch-toast p{margin:3px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-toast a{display:inline-block;margin-top:6px;font-size:12px;color:var(--ch-act);text-decoration:none}
:root .ch-toast button{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;background:none;color:var(--ch-t3);cursor:pointer;border-radius:8px;padding:0;min-height:0;font-size:12px}
@keyframes chIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ch-toast{animation:none}}

/* ---- hover hints ---- */
.ch-tip{position:fixed;z-index:1100;max-width:min(300px,calc(100vw - 12px));padding:7px 10px;border-radius:8px;background:var(--ch-tx);color:var(--ch-bg);font:12.5px/1.45 var(--ch-font);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;white-space:pre-line;animation:chTip .12s ease-out}
.ch-tip[hidden]{display:none}
@keyframes chTip{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ch-tip{animation:none}}

/* ---- version ---- */
.ch-ver{font:500 11px/1 var(--ch-font);color:var(--ch-t3);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:3px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-ver.ch-old{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}

/* ---- news ---- */
:root .ch-links .ch-nw{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);background:transparent;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-nw svg{width:13px;height:13px}
:root .ch-links .ch-nw.zero{color:var(--ch-t3)}
:root .ch-links .ch-nw.pos{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
:root .ch-links .ch-nw.neg{color:var(--ch-warn);border-color:var(--ch-warn)}
:root .ch-links .ch-nw.imp{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent;font-weight:600}
:root .ch-links .ch-nw:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-nwi .ch-nh{display:block;color:var(--ch-tx);text-decoration:none;font-weight:500;font-size:14px;line-height:1.4}
.ch-nwi .ch-nh:hover{color:var(--ch-act)}
.ch-ni{font-size:11px;color:var(--ch-ert);background:var(--ch-erb);border-radius:6px;padding:0 6px}
.ch-nt{font-size:11px;border-radius:6px;padding:0 6px;color:var(--ch-t3);border:0.5px solid var(--ch-bd)}
.ch-nt.t-1{color:var(--ch-warn);border-color:var(--ch-warn)}
.ch-nt.t1{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-sh{margin:10px 0 0;font:500 14px/1.3 var(--ch-font);color:var(--ch-tx)}

/* ---- favorites, events, install ---- */
:root .ch-links .ch-fv{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t3);border-radius:14px;min-height:26px;min-width:30px;padding:2px 8px;font-size:14px;line-height:1;cursor:pointer}
:root .ch-links .ch-fv.on{color:var(--ch-brand);border-color:var(--ch-brand)}

<style>

*{box-sizing:border-box}

<script>
"use strict";
/* ================= SETTINGS ================= */
const DEF = {
  base:"BTC", quote:"USDT", exch:"binance", market:"spot", tf:"1h", bars:700, refresh:60, lang:"uk", theme:"dark",
  emaF:20, emaM:50, emaS:200, rsiP:14, macdF:12, macdS:26, macdG:9, bbP:20, bbK:2, atrP:14, stK:14, stD:3, adxP:14, mfiP:14,
  heatBuy:25, heatSell:75, hrH:200, paneH:150, panes:{vol:true,prob:true,rsi:true,macd:true}, sv:3, hrow:{h1:true,h4:true,d1:true,avg:true}, heatSmooth:3, volSpike:2.5, volSma:20,
  zzMode:"auto", zzPct:5, zzAtr:4, ewStrict:false,
  wallMult:6, wallMin:50000, whaleTrade:50000, bookRange:5,
  horizon:24, wHeat:1, wTrend:1.2, wMom:1, wEw:0.8, wBook:0.6, wFlow:0.7, wDrv:0.6, wVol:0.4,
  btSL:2, btTP:4, btFee:0.1, btTrend:true, btHold:48,
  alerts:false, alertCd:30, tgToken:"", tgChat:"", tgAuto:false,
  ov:{ema:true, bb:false, vol:true, ew:true, sr:true, fib:false, fc:true, prob:true, walls:true, liq:false, sig:true}, osc:"heat", favs:["BTC","ETH","SOL"]
};
const LS_KEY = "ch_coinlab_v1";
let S = load();
function load(){ try{ const v = JSON.parse(localStorage.getItem(LS_KEY)||"{}"); const o={...DEF, ...v, ov:{...DEF.ov, ...(v.ov||{})}, hrow:{...DEF.hrow, ...(v.hrow||{})}}; if((v.sv||1)<2){ o.heatBuy=25; o.heatSell=75; } if((v.sv||1)<3){ o.panes={...DEF.panes}; if(v.osc&&v.osc!=="cvd") o.panes[v.osc]=true; if(v.osc==="cvd") o.panes.cvd=o.panes.delta=true; if(v.ov&&v.ov.vol===false) o.panes.vol=false; o.sv=3; } o.panes={...o.panes}; return o; }catch(e){ return structuredClone(DEF); } }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ================= UTILS ================= */
const $ = id => document.getElementById(id);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const last = a => { for(let i=a.length-1;i>=0;i--) if(a[i]!=null && !isNaN(a[i])) return a[i]; return null; };
const lastN = (a,n) => a.length? a[a.length-1-n] : null;
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const sum = a => a.reduce((x,y)=>x+(y||0),0);
function decimals(p){ if(!p||!isFinite(p)) return 2; if(p>=1000) return 2; if(p>=1) return 4; return Math.min(10, Math.max(4, -Math.floor(Math.log10(p))+3)); }
function fp(p){ if(p==null||!isFinite(p)) return "—"; return Number(p).toLocaleString("en-US",{minimumFractionDigits:decimals(ST.price||p),maximumFractionDigits:decimals(ST.price||p)}); }
function fn(x,d=2){ if(x==null||!isFinite(x)) return "—"; return Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fbig(x){ if(x==null||!isFinite(x)) return "—"; if(x===0) return "0"; const a=Math.abs(x); const s=x<0?"−":""; if(a>=1e9) return s+fn(a/1e9,2)+"B"; if(a>=1e6) return s+fn(a/1e6,2)+"M"; if(a>=1e3) return s+fn(a/1e3,1)+"K"; return s+fn(a, a<1?4:0); }
function fpct(x,d=2){ if(x==null||!isFinite(x)) return "—"; return (x>0?"+":x<0?"−":"")+fn(Math.abs(x),d)+"%"; }
const cls = x => x>0?"up":x<0?"down":"mute";
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const el=$("toast"); el.textContent=msg; el.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display="none",2600); }
async function j(url, opt){ const r = await fetch(url, opt); if(!r.ok) throw new Error(r.status+" "+url.split("?")[0]); return r.json(); }
const TF_SEC = {"5m":300,"15m":900,"1h":3600,"4h":14400,"1d":86400,"1w":604800};

/* ================= EXCHANGES ================= */
const BN_S="https://api.binance.com/api/v3", BN_F="https://fapi.binance.com", BY="https://api.bybit.com/v5", OK="https://www.okx.com/api/v5";
const EX = {
  binance:{
    sym:(b,q)=>b+q,
    async klines(sym, tf, limit, fut){
      const d = await j(fut?`${BN_F}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=${Math.min(limit,1500)}`:`${BN_S}/klines?symbol=${sym}&interval=${tf}&limit=${Math.min(limit,1000)}`);
      return d.map(k=>({t:k[0]/1000,o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5],qv:+k[7],tb:+k[9]}));
    },
    async ticker(sym,fut){ const d=await j(fut?`${BN_F}/fapi/v1/ticker/24hr?symbol=${sym}`:`${BN_S}/ticker/24hr?symbol=${sym}`); return {last:+d.lastPrice,chg:+d.priceChangePercent,high:+d.highPrice,low:+d.lowPrice,qv:+d.quoteVolume}; },
    async depth(sym,fut){ const d=await j(fut?`${BN_F}/fapi/v1/depth?symbol=${sym}&limit=1000`:`${BN_S}/depth?symbol=${sym}&limit=1000`); return {bids:d.bids.map(x=>[+x[0],+x[1]]),asks:d.asks.map(x=>[+x[0],+x[1]])}; },
    async trades(sym,fut){ const d=await j(fut?`${BN_F}/fapi/v1/aggTrades?symbol=${sym}&limit=1000`:`${BN_S}/aggTrades?symbol=${sym}&limit=1000`); return d.map(x=>({p:+x.p,q:+x.q,t:x.T,buy:!x.m})); },
    async symbols(quote){ const d=await j(`${BN_S}/ticker/24hr`); return d.filter(x=>x.symbol.endsWith(quote)&&+x.quoteVolume>0).map(x=>({b:x.symbol.slice(0,-quote.length),qv:+x.quoteVolume})).sort((a,b)=>b.qv-a.qv); },
    async deriv(base){
      const s=base+"USDT";
      const r = await Promise.allSettled([
        j(`${BN_F}/fapi/v1/premiumIndex?symbol=${s}`),
        j(`${BN_F}/fapi/v1/openInterest?symbol=${s}`),
        j(`${BN_F}/futures/data/openInterestHist?symbol=${s}&period=1h&limit=500`),
        j(`${BN_F}/futures/data/globalLongShortAccountRatio?symbol=${s}&period=1h&limit=48`),
        j(`${BN_F}/futures/data/topLongShortPositionRatio?symbol=${s}&period=1h&limit=48`),
        j(`${BN_F}/futures/data/takerlongshortRatio?symbol=${s}&period=1h&limit=48`),
        j(`${BN_F}/fapi/v1/fundingRate?symbol=${s}&limit=30`)
      ]);
      const v = i => r[i].status==="fulfilled"? r[i].value : null;
      if(!v(0)) return null;
      const pi=v(0);
      return {
        mark:+pi.markPrice, funding:+pi.lastFundingRate*100, nextFunding:pi.nextFundingTime,
        oi:v(1)? +v(1).openInterest*+pi.markPrice : null,
        oiHist:(v(2)||[]).map(x=>({t:x.timestamp/1000, v:+x.sumOpenInterestValue})),
        ls:(v(3)||[]).map(x=>({t:x.timestamp/1000, v:+x.longShortRatio, l:+x.longAccount})),
        top:(v(4)||[]).map(x=>({t:x.timestamp/1000, v:+x.longShortRatio})),
        taker:(v(5)||[]).map(x=>({t:x.timestamp/1000, v:+x.buySellRatio})),
        fundHist:(v(6)||[]).map(x=>({t:x.fundingTime/1000, v:+x.fundingRate*100}))
      };
    },
    wsTrades:(sym,fut)=>({url:fut?`wss://fstream.binance.com/ws/${sym.toLowerCase()}@aggTrade`:`wss://stream.binance.com:9443/ws/${sym.toLowerCase()}@aggTrade`, parse:m=>m.e==="aggTrade"?[{p:+m.p,q:+m.q,t:m.T,buy:!m.m}]:[]}),
    wsLiq:base=>({url:`wss://fstream.binance.com/ws/${(base+"USDT").toLowerCase()}@forceOrder`, parse:m=>{ const o=m.o; if(!o) return []; return [{t:o.T, side:o.S==="SELL"?"long":"short", p:+o.ap||+o.p, q:+o.z||+o.q}]; }})
  },
  bybit:{
    sym:(b,q)=>b+q,
    iv:{"5m":"5","15m":"15","1h":"60","4h":"240","1d":"D","1w":"W"},
    async klines(sym, tf, limit, fut){
      const d=await j(`${BY}/market/kline?category=${fut?"linear":"spot"}&symbol=${sym}&interval=${this.iv[tf]}&limit=${Math.min(limit,1000)}`);
      if(d.retCode!==0||!d.result.list.length) throw new Error("bybit "+d.retMsg);

  hzAvg:["Усереднений Heat","Середнє значення Heat 1h, 4h і 1d. Згладжує шум короткого горизонту й показує загальний стан монети.\nВихід усередненого Heat із зони — рідший, але надійніший сигнал, ніж на одному горизонті."],
  atr:["ATR","Середній діапазон свічки за {p} свічок — міра волатильності. Від нього рахуються стопи й цілі.\nВисокий ATR — ширші стопи й менший розмір позиції."],
  score:["Підсумковий сигнал","Зважена сума 8 факторів від −100 (сильний продаж) до +100 (сильна купівля). Вище +13 — купівля, вище +40 — сильна купівля; нижче −13 — продаж.\nУзгодженість показує, яка частка факторів погоджується з напрямком."],
  plan:["Торговий план","Зона входу, стоп і дві цілі з урахуванням рівнів, ATR і хвиль. Ризик/прибуток — скільки можна заробити на кожну одиницю ризику.\nУгоди з ризиком/прибутком нижче 1,5 краще пропускати."],
  fHeat:["Фактор Heat","Heat на трьох горизонтах (найбільша вага в 1d): низький Heat додає до купівлі, високий — до продажу."],
  fTrend:["Фактор тренду","Положення ціни відносно EMA {b} і {c}, їхній порядок, денний тренд і сила тренду за ADX."],
  fMom:["Фактор імпульсу","Гістограма MACD та її напрямок, зона RSI і перевага +DI чи −DI."],
  fEw:["Фактор хвиль","Яка хвиля Елліотта формується: хвиля 3 — найсильніший плюс, корекція A — мінус. Враховано якість розмітки."],
  fBook:["Фактор стакану","Дисбаланс заявок на купівлю й продаж у межах ±1% і ±2% від ціни."],
  fFlow:["Фактор потоку угод","Перевага агресивних купівель над продажами в останніх угодах, в угодах китів і в дельті за 24 свічки."],
  fDrv:["Фактор деривативів","Діє проти натовпу: високий фандинг і багато лонгів — мінус, від’ємний фандинг і перекіс у шорти — плюс."],
  fVol:["Фактор обсягу","Сплеск обсягу на останніх свічках у напрямку свічки."],
  funding:["Фандинг","Платіж між лонгами й шортами на безстрокових ф’ючерсах кожні 8 годин. Плюс — лонги платять шортам.\nВище 0,05% — перегрів лонгів. Від’ємний — натовп у шортах, можливий шорт-сквіз."],
  oi:["Відкритий інтерес","Сума всіх відкритих ф’ючерсних позицій у доларах.\nOI росте разом із ціною — у тренд заходять нові гроші. Різке падіння OI — масове закриття позицій або ліквідації."],
  ls:["Лонг/шорт акаунтів","Скільки акаунтів у лонгах на один акаунт у шортах.\nВище 2 — натовп у лонгах (ризик падіння), нижче 1 — у шортах. Працює як протилежний індикатор."],
  top:["Лонг/шорт топ-трейдерів","Те саме співвідношення, але за позиціями найбільших трейдерів Binance. Їхня позиція часто важливіша за думку натовпу."],
  taker:["Taker купівля/продаж","Співвідношення ринкових купівель до ринкових продажів на ф’ючерсах за 6 годин.\nВище 1 — агресивніше купують, нижче 1 — продають."],
  regime:["Режим ринку","Поєднання зміни OI і ціни за 24 години: нові лонги, нові шорти, закриття шортів або вихід лонгів.\nНові позиції підсилюють рух, а закриття часто означає, що рух вичерпується."],
  imb:["Дисбаланс стакану","Різниця між сумою заявок на купівлю та на продаж біля ціни, від −100% до +100%.\nПлюс — покупців у стакані більше. Великі гравці можуть ставити й знімати заявки, тому важливий стабільний перекіс."],
  liqmap:["Карта ліквідацій","Оцінка рівнів ліквідацій за приростом OI і типовими плечима 5–100×. Червоне — лонги, зелене — шорти; рівні, через які ціна вже пройшла, прибрано.\nЦе модель, а не реальні ордери біржі."],
  bt:["Перевірка на історії","Симуляція: вхід за сигналом на наступній свічці, вихід за стопом, ціллю, сигналом продажу або після максимального часу утримання. Комісію враховано.\nМинулі результати не гарантують майбутніх."],
  guide:["Довідка","Натисніть «i» біля будь-якого індикатора, щоб побачити пояснення."]
},
en:{
  vol:["Volume","How much traded in each candle. Bar colour is the candle direction; the yellow line is the {n}-candle average.\nMoves on high volume are more reliable. A spike of ×{x} the average is marked V× on the price chart."],
  prob:["Chance of rise","Estimated chance that price is higher in {h} candles. The line in this pane is the technical part (Heat, trend, momentum) for every candle.\nAbove 60 favours a rise, below 40 a fall, around 50 is uncertain. It is a weighted sum of factors, not a guarantee."],
  probB:["Probability badge","Overall chance of a rise and a fall over {h} candles, using all 8 factors including the order book, whale trades and derivatives. The bar shows the split; below it is the overall signal."],
  heat:["Heat Index","Our composite 0–100 indicator: a modified stochastic, Stoch RSI, RSI and position inside the Bollinger band, smoothed together. Here it is calculated on the chart timeframe.\nBelow {lo} is oversold (green, buy zone); above {hi} is overheated (red, take-profit zone). The signal is the line leaving a zone."],
  rsi:["RSI","Relative Strength Index over {p} candles: the balance of gains and losses from 0 to 100.\nAbove 70 is overbought, below 30 oversold, 50 splits bullish and bearish strength. A divergence between RSI and price often precedes a reversal."],
  stoch:["Stoch RSI","A stochastic applied to RSI: where RSI sits within its recent range. Very sensitive.\n%K (blue) crossing %D (yellow) upward below 20 signals a rise; downward above 80, a fall. In a strong trend it can stay in a zone for a long time."],
  mfi:["MFI","Money Flow Index: a volume-weighted RSI over {p} candles.\nAbove 80, too much money has flowed in and a pullback is likely. Below 20, money has left and a bounce is possible."],
  macd:["MACD","The gap between the fast and slow EMA ({f}/{s}); the signal line is a {g}-EMA of it; the histogram is MACD minus signal.\nA histogram above zero and growing means upward momentum; faded bars mean momentum is weakening. A MACD/signal cross is the classic signal."],
  adx:["ADX / DI","ADX is trend strength regardless of direction; +DI and −DI are buyer and seller strength.\nADX above 25 means a trend, above 40 a strong one; below 20 is a range where trend signals are unreliable. Direction follows whichever DI is higher."],
  delta:["Volume delta","Aggressive buys minus aggressive sells in each candle. On Binance it is exact taker data; on other exchanges it is estimated from the candle shape.\nGreen bars: buyers pressing; red: sellers. Price rising on negative delta is a warning sign."],
  cvd:["CVD","Cumulative volume delta: the running sum of every delta since the start of the chart.\nPrice up while CVD falls means the rise rests on weak demand. CVD rising in a range means buyers are accumulating."],
  obv:["OBV","On-Balance Volume: volume is added on green candles and subtracted on red ones.\nDirection matters more than the value. OBV making a new high before price is a sign of accumulation."],
  ema:["EMA","Exponential moving averages of {a}, {b} and {c} candles.\nPrice above all EMAs, stacked bottom to top, is an uptrend. EMA {c} is the main line between bull and bear markets; EMAs often act as support and resistance."],
  bb:["Bollinger","A channel around the {p}-candle average, ±{k} standard deviations wide.\nA narrow channel often precedes a strong move. Breaking outside shows strength but also risks a return inside."],
  ew:["Elliott waves","Automatic count: impulse 1–5 and correction A–B–C from ZigZag points. “?” means the wave is still forming; the dashed line leads to its target.\nThe count is invalid if price passes the invalidation level. It is the most likely count, not the only possible one."],
  sr:["Levels","Support (S) and resistance (R) where price has turned several times; ×N is the number of touches.\nMore touches mean a stronger level. Broken resistance often becomes support."],
  fib:["Fibonacci","Retracement levels 23.6–78.6% of the last big move (up to 200 candles).\nPullbacks most often stall near 38.2%, 50% and 61.8%."],
  fc:["Forecast","A cone {h} candles ahead: bullish, base and bearish scenarios based on volatility and the overall score. Stop, TP1 and TP2 lines are the trade plan.\nThe base case is the most likely path, but price can move anywhere inside the cone."],
  walls:["Whale walls","Large limit orders in the book, {m}× the median size (at least {w} $).\nA wall below can hold price; one above can cap a rise. Walls can vanish at any moment, so they are not a guarantee."],
  liq:["Liquidations","Estimated levels where long liquidations (below price) and short liquidations (above) cluster.\nPrice often gravitates to large clusters because they hold the “fuel” for a sharp move."],
  sig:["Signals","▲ and ▼ arrows mark Heat leaving the oversold or overheated zone, on the price chart and in the Heat rows. The V× square is a volume spike.\nCheck how these signals performed in the History check tab."],
  hz:["Heat by horizon","Heat Index calculated on 1h, 4h and 1d candles and drawn on your chart’s candles. A higher-timeframe candle is built from the data available at that moment, with no look-ahead.\nThe strongest signal is all horizons below {lo} at once (buy confluence) or above {hi} (sell confluence)."],
  hzAvg:["Average Heat","The mean of Heat 1h, 4h and 1d. It smooths short-horizon noise and shows the coin’s overall state.\nAverage Heat leaving a zone is a rarer but more reliable signal than a single horizon."],
  atr:["ATR","Average candle range over {p} candles, a measure of volatility. Stops and targets are based on it.\nHigh ATR means wider stops and a smaller position."],
  score:["Overall signal","Weighted sum of 8 factors from −100 (strong sell) to +100 (strong buy). Above +13 is buy, above +40 strong buy; below −13 sell.\nAgreement shows what share of factors point the same way."],
  plan:["Trade plan","Entry zone, stop and two targets based on levels, ATR and waves. Risk/reward is how much you can make per unit of risk.\nTrades below 1.5 risk/reward are better skipped."],
  fHeat:["Heat factor","Heat on three horizons (1d weighs most): low Heat adds to buy, high Heat to sell."],
  fTrend:["Trend factor","Price versus EMA {b} and {c}, their order, the daily trend and ADX strength."],
  fMom:["Momentum factor","The MACD histogram and its direction, the RSI zone and whether +DI or −DI leads."],
  fEw:["Wave factor","Which Elliott wave is forming: wave 3 is the strongest plus, correction A a minus. Count quality is taken into account."],
  fBook:["Order book factor","Buy versus sell order imbalance within ±1% and ±2% of price."],
  fFlow:["Trade flow factor","Aggressive buys versus sells in recent trades, in whale trades and in the 24-candle delta."],
  fDrv:["Derivatives factor","Contrarian: high funding and many longs count as minus; negative funding and crowded shorts as plus."],
  fVol:["Volume factor","A volume spike on recent candles, in the candle’s direction."],
  funding:["Funding","A payment between longs and shorts on perpetual futures every 8 hours. Positive means longs pay shorts.\nAbove 0.05% longs are overheated. Negative means the crowd is short and a short squeeze is possible."],
  oi:["Open interest","The total value of open futures positions in dollars.\nOI rising with price means new money is entering the trend. A sharp OI drop means mass closing or liquidations."],
  ls:["Long/short accounts","How many accounts are long for each account that is short.\nAbove 2 the crowd is long (downside risk); below 1 it is short. Works as a contrarian indicator."],
  top:["Top traders long/short","The same ratio, but for the positions of Binance’s largest traders. Their positioning often matters more than the crowd’s."],
  taker:["Taker buy/sell","Market buys versus market sells on futures over 6 hours.\nAbove 1, buyers are more aggressive; below 1, sellers."],
  regime:["Market regime","How OI and price changed over 24 hours: new longs, new shorts, short covering or longs exiting.\nNew positions reinforce a move; closing often means it is running out."],
  imb:["Order book imbalance","Total bids minus total asks near the price, from −100% to +100%.\nPositive means more buyers in the book. Big players can place and pull orders, so look for a stable skew."],
  liqmap:["Liquidation map","Estimated liquidation levels from OI growth and typical 5–100× leverage. Red: longs, green: shorts; levels price has already passed are removed.\nIt is a model, not the exchange’s real orders."],
  bt:["History check","A simulation: enter on the next candle after a signal; exit at stop, target, sell signal or maximum hold time. Fees included.\nPast results do not guarantee future ones."],
  guide:["Help","Tap “i” next to any indicator to see an explanation."]
},
ru:{
  vol:["Объём","Сколько монет проторговалось за свечу. Цвет столбца — направление свечи, жёлтая линия — средний объём за {n} свечей.\nДвижение на высоком объёме надёжнее. Всплеск от ×{x} среднего отмечается на графике цены квадратом V×."],
  prob:["Вероятность роста","Оценка шанса, что цена через {h} свечей будет выше. Линия в панели — техническая часть (Heat, тренд, импульс) на каждой свече.\nВыше 60 — перевес роста, ниже 40 — падения, около 50 — неопределённость. Это взвешенная сумма факторов, а не гарантия."],
  probB:["Плашка вероятности","Итоговая вероятность роста и падения на {h} свечей с учётом всех 8 факторов, включая стакан, сделки китов и деривативы. Полоса показывает соотношение, ниже — итоговый сигнал."],
  heat:["Heat Index","Наш композитный индикатор 0–100: модифицированный стохастик, Stoch RSI, RSI и положение в канале Bollinger, сглаженные вместе. Здесь он рассчитан на таймфрейме графика.\nНиже {lo} — перепроданность (зелёное, зона покупки), выше {hi} — перегрев (красное, зона фиксации). Сигнал — выход линии из зоны."],
  rsi:["RSI","Индекс относительной силы за {p} свечей: соотношение роста и падения от 0 до 100.\nВыше 70 — перекупленность, ниже 30 — перепроданность, 50 — граница бычьей и медвежьей силы. Расхождение RSI с ценой часто предшествует развороту."],
  stoch:["Stoch RSI","Стохастик, применённый к RSI: где RSI сейчас в своём недавнем диапазоне. Очень чувствительный.\n%K (синяя) пересекает %D (жёлтую) снизу ниже 20 — сигнал на рост, сверху выше 80 — на падение. В сильном тренде может долго стоять в зоне."],
  mfi:["MFI","Индекс денежного потока: RSI с учётом объёма за {p} свечей.\nВыше 80 — в монету зашло слишком много денег, риск отката. Ниже 20 — деньги вышли, возможен отскок."],
  macd:["MACD","Разница быстрой и медленной EMA ({f}/{s}); сигнальная линия — EMA {g} от неё; гистограмма — MACD минус сигнальная.\nГистограмма выше нуля и растёт — импульс вверх; бледные столбцы — импульс слабеет. Пересечение MACD и сигнальной — классический сигнал."],
  adx:["ADX / DI","ADX — сила тренда независимо от направления; +DI и −DI — сила покупателей и продавцов.\nADX выше 25 — тренд есть, выше 40 — сильный; ниже 20 — флэт, трендовые сигналы ненадёжны. Направление — по тому, какая DI выше."],
  delta:["Дельта объёма","Разница между агрессивными покупками и продажами на каждой свече. На Binance это точные taker-данные, на других биржах — оценка по форме свечи.\nЗелёные столбцы — давят покупатели, красные — продавцы. Рост цены при отрицательной дельте — тревожный знак."],
  cvd:["CVD","Накопленная дельта объёма: сумма всех дельт от начала графика.\nЦена растёт, а CVD падает — рост держится на слабом спросе. CVD растёт в боковике — покупатели накапливают."],
  obv:["OBV","Балансовый объём: объём прибавляется на зелёных свечах и вычитается на красных.\nВажно направление, а не само значение. Если OBV обновляет максимум раньше цены — это признак накопления."],
  ema:["EMA","Экспоненциальные скользящие средние {a}, {b} и {c} свечей.\nЦена выше всех EMA, а они выстроены снизу вверх — восходящий тренд. EMA {c} — главная граница между бычьим и медвежьим рынком; EMA часто работают как поддержка и сопротивление."],
  bb:["Bollinger","Канал вокруг средней за {p} свечей шириной ±{k} стандартных отклонения.\nУзкий канал часто предшествует сильному движению. Выход за границу — признак силы, но и риск возврата внутрь."],
  ew:["Волны Эллиотта","Автоматическая разметка: импульс 1–5 и коррекция A–B–C по точкам ZigZag. Знак «?» — волна ещё формируется, пунктир ведёт к её цели.\nСчёт отменяется, если цена проходит уровень отмены. Это самая вероятная разметка, но не единственная."],
  sr:["Уровни","Поддержки (S) и сопротивления (R) там, где цена несколько раз разворачивалась; ×N — количество касаний.\nЧем больше касаний, тем сильнее уровень. Пробитое сопротивление часто становится поддержкой."],
  fib:["Фибоначчи","Уровни коррекции 23,6–78,6% от последнего крупного движения (до 200 свечей).\nЧаще всего коррекция останавливается около 38,2%, 50% и 61,8%."],
  fc:["Прогноз","Конус на {h} свечей вперёд: бычий, базовый и медвежий сценарии с учётом волатильности и итоговой оценки. Линии Stop, TP1 и TP2 — торговый план.\nБазовый сценарий — самый вероятный путь, но цена может двигаться где угодно в пределах конуса."],
  walls:["Стены китов","Крупные лимитные заявки в стакане, в {m} раз больше медианы (минимум {w} $).\nСтена снизу может держать цену, сверху — сдерживать рост. Стены могут исчезнуть в любой момент, так что это не гарантия."],
  liq:["Ликвидации","Оценочные уровни, где скоплены ликвидации лонгов (ниже цены) и шортов (выше).\nЦена часто тянется к крупным скоплениям, потому что там много «топлива» для резкого движения."],
  sig:["Сигналы","Стрелки ▲ и ▼ — выход Heat из зоны перепроданности или перегрева, на графике цены и в строках Heat. Квадрат V× — всплеск объёма.\nКак эти сигналы работали раньше, проверьте во вкладке «Проверка на истории»."],
  hz:["Heat по горизонтам","Heat Index, рассчитанный на свечах 1h, 4h и 1d и показанный на свечах вашего графика. Свеча старшего таймфрейма строится из доступных данных, без заглядывания в будущее.\nСамый сильный сигнал — когда все горизонты одновременно ниже {lo} (конфлюенс покупки) или выше {hi} (конфлюенс продажи)."],
  hzAvg:["Усреднённый Heat","Среднее значение Heat 1h, 4h и 1d. Сглаживает шум короткого горизонта и показывает общее состояние монеты.\nВыход усреднённого Heat из зоны — более редкий, но более надёжный сигнал, чем на одном горизонте."],
  atr:["ATR","Средний диапазон свечи за {p} свечей — мера волатильности. От него считаются стопы и цели.\nВысокий ATR — более широкие стопы и меньший размер позиции."],
  score:["Итоговый сигнал","Взвешенная сумма 8 факторов от −100 (сильная продажа) до +100 (сильная покупка). Выше +13 — покупка, выше +40 — сильная покупка; ниже −13 — продажа.\nСогласованность показывает, какая доля факторов согласна с направлением."],

/* ================= INDICATORS ================= */
function sma(a,n){ const r=Array(a.length).fill(null); for(let i=n-1;i<a.length;i++){ let s=0,ok=true; for(let j=i-n+1;j<=i;j++){ if(a[j]==null){ok=false;break;} s+=a[j]; } if(ok) r[i]=s/n; } return r; }
function ema(a,n){ const r=Array(a.length).fill(null); const k=2/(n+1); let cnt=0,s=0,p=null; for(let i=0;i<a.length;i++){ const v=a[i]; if(v==null||isNaN(v)) continue; if(p==null){ s+=v; cnt++; if(cnt===n){ p=s/n; r[i]=p; } } else { p=v*k+p*(1-k); r[i]=p; } } return r; }
function rma(a,n){ const r=Array(a.length).fill(null); let cnt=0,s=0,p=null; for(let i=0;i<a.length;i++){ const v=a[i]; if(v==null) continue; if(p==null){ s+=v; cnt++; if(cnt===n){p=s/n; r[i]=p;} } else { p=(p*(n-1)+v)/n; r[i]=p; } } return r; }
function rsi(c,n){ const up=[null],dn=[null]; for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1]; up.push(Math.max(d,0)); dn.push(Math.max(-d,0)); } const u=rma(up,n), d=rma(dn,n); return c.map((_,i)=>u[i]==null?null:(d[i]===0?100:100-100/(1+u[i]/d[i]))); }
function stdevW(a,n,i){ let m=0; for(let j=i-n+1;j<=i;j++) m+=a[j]; m/=n; let v=0; for(let j=i-n+1;j<=i;j++) v+=(a[j]-m)**2; return Math.sqrt(v/n); }
function bbands(c,n,k){ const m=sma(c,n); const up=[],lo=[],pb=[],w=[]; for(let i=0;i<c.length;i++){ if(m[i]==null){up.push(null);lo.push(null);pb.push(null);w.push(null);continue;} const sd=stdevW(c,n,i); up.push(m[i]+k*sd); lo.push(m[i]-k*sd); pb.push(sd?(c[i]-(m[i]-k*sd))/(2*k*sd):0.5); w.push(m[i]?2*k*sd/m[i]*100:null); } return {mid:m,up,lo,pb,w}; }
function atr(K,n){ const tr=K.map((k,i)=>i?Math.max(k.h-k.l,Math.abs(k.h-K[i-1].c),Math.abs(k.l-K[i-1].c)):k.h-k.l); return rma(tr,n); }
function rollMax(a,n,i){ let m=-Infinity; for(let j=Math.max(0,i-n+1);j<=i;j++) if(a[j]!=null&&a[j]>m) m=a[j]; return m; }
function rollMin(a,n,i){ let m=Infinity; for(let j=Math.max(0,i-n+1);j<=i;j++) if(a[j]!=null&&a[j]<m) m=a[j]; return m; }
function stoch(K,n,d){ const h=K.map(x=>x.h),l=K.map(x=>x.l); const raw=K.map((k,i)=>{ if(i<n-1) return null; const hh=rollMax(h,n,i), ll=rollMin(l,n,i); return hh===ll?50:(k.c-ll)/(hh-ll)*100; }); const k=sma(raw,d); return {k, d:sma(k,d)}; }
function stochRsi(c,rp,sp,kp,dp){ const r=rsi(c,rp); const raw=r.map((v,i)=>{ if(v==null) return null; let ok=true; for(let j=i-sp+1;j<=i;j++) if(j<0||r[j]==null) ok=false; if(!ok) return null; const hh=rollMax(r,sp,i), ll=rollMin(r,sp,i); return hh===ll?50:(v-ll)/(hh-ll)*100; }); const k=sma(raw,kp); return {k, d:sma(k,dp)}; }
function macd(c,f,s,g){ const a=ema(c,f), b=ema(c,s); const m=c.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null); const sig=ema(m,g); return {m, sig, h:m.map((v,i)=>v!=null&&sig[i]!=null?v-sig[i]:null)}; }
function adx(K,n){ const pdm=[0],ndm=[0],tr=[K[0].h-K[0].l]; for(let i=1;i<K.length;i++){ const u=K[i].h-K[i-1].h, d=K[i-1].l-K[i].l; pdm.push(u>d&&u>0?u:0); ndm.push(d>u&&d>0?d:0); tr.push(Math.max(K[i].h-K[i].l,Math.abs(K[i].h-K[i-1].c),Math.abs(K[i].l-K[i-1].c))); } const atr_=rma(tr,n), p=rma(pdm,n), m=rma(ndm,n); const pdi=p.map((v,i)=>v==null||!atr_[i]?null:100*v/atr_[i]), ndi=m.map((v,i)=>v==null||!atr_[i]?null:100*v/atr_[i]); const dx=pdi.map((v,i)=>v==null?null:(v+ndi[i]===0?0:100*Math.abs(v-ndi[i])/(v+ndi[i]))); return {adx:rma(dx,n), pdi, ndi}; }
function obv(K){ let o=0; return K.map((k,i)=>{ if(i){ if(k.c>K[i-1].c) o+=k.v; else if(k.c<K[i-1].c) o-=k.v; } return o; }); }
function mfi(K,n){ const tp=K.map(k=>(k.h+k.l+k.c)/3); return K.map((k,i)=>{ if(i<n) return null; let p=0,m=0; for(let j=i-n+1;j<=i;j++){ const f=tp[j]*K[j].v; if(tp[j]>tp[j-1]) p+=f; else if(tp[j]<tp[j-1]) m+=f; } return m===0?100:100-100/(1+p/m); }); }
function deltaVol(K){ return K.map(k=> k.tb!=null && !isNaN(k.tb) ? 2*k.tb-k.v : (k.h===k.l?0:((k.c-k.l)-(k.h-k.c))/(k.h-k.l)*k.v)); }
function cum(a){ let s=0; return a.map(v=>s+=v||0); }

/* Heat index: modified stochastic composite 0..100 (green = oversold, red = overheated) */
function heatIndex(K){
  if(K.length<40) return K.map(()=>null);
  const c=K.map(x=>x.c);
  const st=stoch(K,S.stK,S.stD).k, sr=stochRsi(c,S.rsiP,S.rsiP,3,3).k, r=rsi(c,S.rsiP), b=bbands(c,S.bbP,S.bbK).pb;
  const raw=c.map((_,i)=> st[i]==null||sr[i]==null||r[i]==null||b[i]==null?null: 0.35*st[i]+0.30*sr[i]+0.20*r[i]+0.15*clamp(b[i]*100,0,100));
  return ema(raw, Math.max(1,S.heatSmooth|0));
}

/* ================= STRUCTURE ================= */
function zigzag(K,dev){
  const P=[]; let dir=0, ei=0, ep=K[0].c, hiI=0, loI=0;
  for(let i=1;i<K.length;i++){
    if(dir===0){
      if(K[i].h>K[hiI].h) hiI=i; if(K[i].l<K[loI].l) loI=i;
      if(K[hiI].h/K[loI].l-1>=dev){ if(hiI>loI){ P.push({i:loI,p:K[loI].l,t:"L"}); dir=1; ei=hiI; ep=K[hiI].h; } else { P.push({i:hiI,p:K[hiI].h,t:"H"}); dir=-1; ei=loI; ep=K[loI].l; } }
      continue;
    }
    if(dir===1){ if(K[i].h>=ep){ ep=K[i].h; ei=i; } else if(K[i].l<=ep*(1-dev)){ P.push({i:ei,p:ep,t:"H"}); dir=-1; ep=K[i].l; ei=i; } }
    else { if(K[i].l<=ep){ ep=K[i].l; ei=i; } else if(K[i].h>=ep*(1+dev)){ P.push({i:ei,p:ep,t:"L"}); dir=1; ep=K[i].h; ei=i; } }
  }
  const tail = dir===0? null : {i:ei,p:ep,t:dir===1?"H":"L",open:true};
  return {P, tail};
}
function srLevels(K, price, atrV){
  const zz=zigzag(K, clamp(2*atrV/price,0.006,0.08)).P;
  const tol=Math.max(atrV*0.6, price*0.003);
  const cl=[];
  for(const p of zz){ const c=cl.find(x=>Math.abs(x.p-p.p)<=tol); if(c){ c.p=(c.p*c.n+p.p)/(c.n+1); c.n++; c.last=Math.max(c.last,p.i); } else cl.push({p:p.p,n:1,last:p.i}); }
  const sup=cl.filter(x=>x.p<price).sort((a,b)=>b.p-a.p).slice(0,4);
  const res=cl.filter(x=>x.p>price).sort((a,b)=>a.p-b.p).slice(0,4);
  return {sup,res};
}
function fibLevels(K){
  const n=Math.min(K.length,200), seg=K.slice(-n); let hi=0,lo=0;
  seg.forEach((k,i)=>{ if(k.h>seg[hi].h) hi=i; if(k.l<seg[lo].l) lo=i; });
  const H=seg[hi].h, L=seg[lo].l, up=lo<hi; // swing up: retrace from high
  const lv=[0,0.236,0.382,0.5,0.618,0.786,1].map(r=>({r, p: up? H-(H-L)*r : L+(H-L)*r}));
  return {H,L,up,lv};
}

/* ================= ELLIOTT ================= */
const EW_LABELS=["0","1","2","3","4","5","A","B","C"];
function fibScore(x,lo,hi,soft=0.35){ if(x>=lo&&x<=hi) return 1; const d = x<lo? (lo-x)/lo : (x-hi)/hi; return Math.max(0,1-d/soft); }
function elliott(K, dev){
  const zz=zigzag(K,dev); const pts=zz.P.slice(); if(zz.tail) pts.push(zz.tail);
  const n=pts.length; let best=null;
  for(let s=Math.max(0,n-10); s<=n-3; s++){
    const q=pts.slice(s); const legs=q.length-1; if(legs<2||legs>8) continue;
    const dir = q[1].p>q[0].p?1:-1;
    const L=k=>Math.abs(q[k].p-q[k-1].p);
    let ok=true, sc=0;
    // start must be extreme of impulse part
    const impEnd=Math.min(legs,5);
    for(let k=1;k<=impEnd;k++) if(dir*(q[k].p-q[0].p)<=0) ok=false;
    if(legs>=2){ if(dir*(q[2].p-q[0].p)<=0) ok=false; sc+=fibScore(L(2)/L(1),0.382,0.786); }
    if(legs>=3){ sc+= legs>=4? fibScore(L(3)/L(1),1.236,2.8): (L(3)>=L(1)*0.6?0.5:0); }
    if(legs>=4){ if(dir*(q[3].p-q[1].p)<=0) ok=false; const ov = S.ewStrict? dir*(q[4].p-q[1].p)<=0 : dir*(q[4].p-q[2].p)<=0; if(ov) ok=false; sc+=fibScore(L(4)/L(3),0.236,0.5); }
    if(legs>=5){ sc+= legs>=6? Math.max(fibScore(L(5)/L(1),0.618,1.05),fibScore(L(5)/(Math.abs(q[3].p-q[0].p)),0.55,0.7)) : 0.4; }
    if(legs>=6){ if(L(3)<L(1)&&L(3)<L(5)) ok=false; if(dir*(q[5].p-q[3].p)<=0) sc-=0.4; sc+=fibScore(L(6)/Math.abs(q[5].p-q[0].p),0.236,0.618); }
    if(legs>=7){ if(dir*(q[7].p-q[5].p)>0) sc-=0.5; sc+=fibScore(L(7)/L(6),0.382,0.886); }
    if(legs>=8){ sc+=Math.max(fibScore(L(8)/L(6),0.9,1.15),fibScore(L(8)/L(6),1.5,1.7)); }
    if(!ok) continue;
    const total = sc/Math.max(1,legs-1) + 0.12*Math.min(legs,6);
    if(!best || total>best.score) best={s, q, legs, dir, score:total};
  }
  if(!best) return {ok:false, dev, pts};
  const {q,legs,dir}=best; const L=k=>Math.abs(q[k].p-q[k-1].p);
  const forming=EW_LABELS[legs]; const price=ST.price;
  let zone=null, target=null, inval=null, bias=0, key="";
  switch(forming){
    case "2": zone=[q[1].p-dir*L(1)*0.5, q[1].p-dir*L(1)*0.618]; target=q[2-1].p-dir*L(1)*0.618+dir*L(1)*1.618; inval=q[0].p; bias=dir*0.35; key="ew2"; break;
    case "3": target=q[2].p+dir*L(1)*1.618; zone=[q[2].p+dir*L(1)*1.0, q[2].p+dir*L(1)*2.618]; inval=q[2].p; bias=dir*0.9; key="ew3"; break;
    case "4": zone=[q[3].p-dir*L(3)*0.236, q[3].p-dir*L(3)*0.382]; target=q[3].p-dir*L(3)*0.382+dir*L(1); inval=S.ewStrict?q[1].p:q[2].p; bias=dir*0.4; key="ew4"; break;
    case "5": target=q[4].p+dir*L(1); zone=[q[4].p+dir*L(1)*0.618, q[4].p+dir*Math.abs(q[3].p-q[0].p)*0.618]; inval=q[4].p; bias=dir*0.15; key="ew5"; break;
    case "A": zone=[q[4].p, q[4].p-dir*L(5)*0.2]; target=q[4].p; inval=q[5].p; bias=-dir*0.7; key="ewA"; break;
    case "B": zone=[q[6].p+dir*L(6)*0.5, q[6].p+dir*L(6)*0.786]; target=q[6].p+dir*L(6)*0.618; inval=q[5].p; bias=-dir*0.3; key="ewB"; break;
    case "C": target=q[7].p-dir*L(6); zone=[q[7].p-dir*L(6)*1.0, q[7].p-dir*L(6)*1.618]; inval=q[7].p; bias=-dir*0.35; key="ewC"; break;
  }
  if(target && price){ const prog = (forming==="C"&&dir*(price-target)<=0) || (forming==="5"&&dir*(price-target)>=0); if(prog) bias*=0.3; }
  return {ok:true, dev, q, legs, dir, forming, zone, target, inval, bias:clamp(bias,-1,1), key, conf:clamp(best.score/1.6,0,1)};
}

/* ================= WHALES ================= */
function analyzeBook(book, price, qUsd){
  if(!book||!book.bids.length) return null;
  const rng=S.bookRange/100;
  const bids=book.bids.filter(x=>x[0]>=price*(1-rng)).map(x=>({p:x[0],q:x[1],n:x[0]*x[1]*qUsd}));
  const asks=book.asks.filter(x=>x[0]<=price*(1+rng)).map(x=>({p:x[0],q:x[1],n:x[0]*x[1]*qUsd}));
  const med=median(bids.concat(asks).map(x=>x.n));
  const thr=Math.max(S.wallMult*med, S.wallMin);
  const walls=bids.filter(x=>x.n>=thr).map(x=>({...x,s:"bid"})).concat(asks.filter(x=>x.n>=thr).map(x=>({...x,s:"ask"}))).sort((a,b)=>b.n-a.n).slice(0,14);
  const imb=[0.5,1,2,5].map(r=>{ const b=sum(book.bids.filter(x=>x[0]>=price*(1-r/100)).map(x=>x[0]*x[1]*qUsd)), a=sum(book.asks.filter(x=>x[0]<=price*(1+r/100)).map(x=>x[0]*x[1]*qUsd)); return {r,b,a,v:(b+a)?(b-a)/(b+a):0}; });
  const sup=walls.filter(w=>w.s==="bid").sort((a,b)=>b.p-a.p)[0]||null, res=walls.filter(w=>w.s==="ask").sort((a,b)=>a.p-b.p)[0]||null;
  return {bids,asks,walls,imb,thr,sup,res,spread:(book.asks[0][0]-book.bids[0][0])/price*100};
}
function analyzeTrades(tr, qUsd){
  if(!tr||!tr.length) return null;
  let bv=0,sv=0,wb=0,ws=0; const big=[];
  tr.forEach((x,i)=>{ const n=x.p*x.q*qUsd; if(x.buy) bv+=n; else sv+=n; if(n>=S.whaleTrade){ big.push({...x,n,i}); if(x.buy) wb+=n; else ws+=n; } });
  // impact: price move after whale trade (next 30 trades), aligned with side
  const imp=[]; for(const b of big){ const j=Math.min(tr.length-1,b.i+30); if(j>b.i){ const m=(tr[j].p/b.p-1)*100*(b.buy?1:-1); imp.push(m); } }
  return {bv,sv,wb,ws,big:big.slice(-40).reverse(),delta:(bv-sv)/Math.max(1,bv+sv),wDelta:(wb-ws)/Math.max(1,wb+ws),impact:imp.length?sum(imp)/imp.length:null,impactN:imp.length, span:(tr[tr.length-1].t-tr[0].t)/60000};
}

/* ================= DERIVATIVES / LIQUIDATIONS ================= */
function analyzeDeriv(d, K1h, price){
  if(!d) return null;
  const o={...d};
  const oh=d.oiHist; if(oh.length>24){ o.oiChg24=(oh[oh.length-1].v/oh[oh.length-25].v-1)*100; }
  if(K1h.length>24) o.pxChg24=(K1h[K1h.length-1].c/K1h[K1h.length-25].c-1)*100;
  if(d.ls.length) o.lsNow=d.ls[d.ls.length-1].v;
  if(d.top.length) o.topNow=d.top[d.top.length-1].v;
  if(d.taker.length) o.takerNow=sum(d.taker.slice(-6).map(x=>x.v))/Math.min(6,d.taker.length);
  if(d.fundHist.length) o.fundAvg=sum(d.fundHist.map(x=>x.v))/d.fundHist.length;
  // regime
  if(o.oiChg24!=null&&o.pxChg24!=null){ const a=o.oiChg24>0, b=o.pxChg24>0; o.regime = a&&b?"rLongs":a&&!b?"rShorts":!a&&b?"rCover":"rLiq"; }
  // contrarian score
  let sc=0; if(o.funding>0.03) sc-=clamp((o.funding-0.01)/0.08,0,1); if(o.funding<-0.01) sc+=clamp((-o.funding)/0.06,0,1);
  if(o.lsNow){ if(o.lsNow>1.8) sc-=clamp((o.lsNow-1.5)/1.5,0,0.8); if(o.lsNow<0.9) sc+=clamp((1-o.lsNow)/0.4,0,0.8); }
  if(o.takerNow){ sc+=clamp((o.takerNow-1)*1.5,-0.4,0.4); }
  o.score=clamp(sc,-1,1);
  o.map=liqMap(K1h, d.oiHist, price);
  return o;
}
function liqMap(K, oiH, price){
  const K2=K.slice(-336); if(!K2.length) return null;
  const lev=[[5,.12],[10,.28],[20,.25],[25,.15],[50,.12],[100,.08]];
  const bins=70, lo=price*0.75, hi=price*1.25, step=(hi-lo)/bins;
  const L=Array(bins).fill(0), Sh=Array(bins).fill(0);
  const oiByT=new Map(oiH.map(x=>[Math.round(x.t/3600),x.v]));
  const pos=[]; // {lp, sp, w, i}
  for(let i=1;i<K2.length;i++){
    const k=K2[i]; const h=Math.round(k.t/3600);
    let w; const a=oiByT.get(h), b=oiByT.get(h-1);
    if(a!=null&&b!=null) w=Math.max(0,a-b); else w=k.qv*0.05;
    if(!w) continue;
    const e=(k.h+k.l+k.c)/3; const tb=k.tb!=null&&k.v? k.tb/k.v : 0.5;
    for(const [lv,f] of lev){ pos.push({lp:e*(1-1/lv+0.005), sp:e*(1+1/lv-0.005), wl:w*f*tb, ws:w*f*(1-tb), i}); }
  }
  // remove liquidated: price traded through after opening
  const minAfter=Array(K2.length).fill(Infinity), maxAfter=Array(K2.length).fill(-Infinity);
  for(let i=K2.length-2;i>=0;i--){ minAfter[i]=Math.min(minAfter[i+1],K2[i+1].l); maxAfter[i]=Math.max(maxAfter[i+1],K2[i+1].h); }
  for(const p of pos){
    if(minAfter[p.i]>p.lp && p.lp<price && p.lp>=lo && p.lp<hi) L[Math.floor((p.lp-lo)/step)]+=p.wl;
    if(maxAfter[p.i]<p.sp && p.sp>price && p.sp>=lo && p.sp<hi) Sh[Math.floor((p.sp-lo)/step)]+=p.ws;
  }
  const cl=(arr,side)=>arr.map((v,i)=>({p:lo+step*(i+0.5),v,side})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  return {lo,hi,step,L,Sh,topL:cl(L,"long"),topS:cl(Sh,"short")};
}

/* ================= BACKTEST ================= */
function signals(K, A, type){
  const n=K.length, buy=Array(n).fill(false), sell=Array(n).fill(false);
  for(let i=1;i<n;i++){
    if(type==="heat"||type==="conf"){ const h=A.heat; if(h[i]==null||h[i-1]==null) continue; if(h[i-1]<S.heatBuy&&h[i]>=S.heatBuy) buy[i]=true; if(h[i-1]>S.heatSell&&h[i]<=S.heatSell) sell[i]=true; if(type==="conf"){ const r=A.rsi[i]; if(buy[i]&&!(r<50&&A.macd.h[i]>A.macd.h[i-1])) buy[i]=false; } }
    else if(type==="avg"){ const h=A.hzRows.avg; if(h[i]==null||h[i-1]==null) continue; if(h[i-1]<S.heatBuy&&h[i]>=S.heatBuy) buy[i]=true; if(h[i-1]>S.heatSell&&h[i]<=S.heatSell) sell[i]=true; }
    else if(type==="rsi"){ const r=A.rsi; if(r[i-1]<30&&r[i]>=30) buy[i]=true; if(r[i-1]>70&&r[i]<=70) sell[i]=true; }
    else if(type==="macd"){ const m=A.macd; if(m.h[i-1]!=null&&m.h[i-1]<0&&m.h[i]>=0) buy[i]=true; if(m.h[i-1]!=null&&m.h[i-1]>0&&m.h[i]<=0) sell[i]=true; }
  }
  return {buy,sell};
}
function backtest(K, A, type){
  const {buy,sell}=signals(K,A,type); const fee=S.btFee/100;
  let eq=1, pos=null; const trades=[], curve=[];
  for(let i=0;i<K.length;i++){
    const k=K[i];
    if(pos){
      let exit=null, why="";
      if(k.l<=pos.sl){ exit=Math.min(k.o,pos.sl); why="SL"; }
      else if(k.h>=pos.tp){ exit=Math.max(k.o,pos.tp); why="TP"; }
      else if(sell[i-1]){ exit=k.o; why="SIG"; }
      else if(i-pos.i>=S.btHold){ exit=k.o; why="TIME"; }
      if(exit!=null){ const r=(exit/pos.e)*(1-fee)/(1+fee)-1; eq*=1+r; trades.push({t0:K[pos.i].t,t1:k.t,e:pos.e,x:exit,r:r*100,why}); pos=null; }
    }
    if(!pos && i>0 && buy[i-1] && A.atr[i-1]){
      const trendOk = !S.btTrend || (A.emaS[i-1]==null || K[i-1].c>A.emaS[i-1]);
      if(trendOk){ pos={i, e:k.o, sl:k.o-S.btSL*A.atr[i-1], tp:k.o+S.btTP*A.atr[i-1]}; }
    }
    curve.push({t:k.t, v:pos? eq*(k.c/pos.e) : eq});
  }
  let peak=1, mdd=0; for(const c of curve){ peak=Math.max(peak,c.v); mdd=Math.min(mdd,c.v/peak-1); }
  const wins=trades.filter(t=>t.r>0);
  const hold=(K[K.length-1].c/K[0].c-1)*100;
  const fwd=[3,6,12,24,48].map(h=>{ const rs=[]; buy.forEach((b,i)=>{ if(b&&i+h<K.length) rs.push((K[i+h].c/K[i].c-1)*100); }); return {h, n:rs.length, avg:rs.length?sum(rs)/rs.length:null, win:rs.length?rs.filter(x=>x>0).length/rs.length*100:null}; });
  return {trades, curve, ret:(eq-1)*100, mdd:mdd*100, win:trades.length?wins.length/trades.length*100:null, hold, fwd, sigs:{buy,sell}};
}

/* ================= PROBABILITY HISTORY =================
   Technical part of the forecast (Heat, trend, momentum) for every bar; order book, trades and derivatives
   exist only for the present moment, so they are not part of the history line. */
function probHistory(K, A){
  const n=K.length, out=Array(n).fill(null), hz=A.hzRows?.avg||A.heat;
  for(let i=1;i<n;i++){
    const p=K[i].c, h=hz[i]!=null?hz[i]:A.heat[i], e50=A.emaM[i], e200=A.emaS[i], ad=A.adx.adx[i], hn=A.macd.h[i], hp=A.macd.h[i-1], r=A.rsi[i], pd=A.adx.pdi[i], nd=A.adx.ndi[i];
    if(h==null||e50==null||hn==null||hp==null||r==null) continue;
    const F=[];
    F.push([clamp((50-h)/50*1.3,-1,1), S.wHeat]);
    let tr=(p>e50?0.35:-0.35); if(e200!=null){ tr+=p>e200?0.35:-0.35; tr+=e50>e200?0.3:-0.3; } if(ad!=null) tr*=clamp(0.6+ad/50,0.6,1.3);
    F.push([clamp(tr,-1,1), S.wTrend]);
    let mo=(hn>0?0.3:-0.3)+(hn>hp?0.3:-0.3); mo+= r>70?-0.2: r<30?0.2 : (r-50)/50*0.6; if(pd!=null&&nd!=null) mo+= pd>nd?0.15:-0.15;
    F.push([clamp(mo,-1,1), S.wMom]);
    const W=sum(F.map(f=>f[1])); const sc=W? sum(F.map(f=>f[0]*f[1]))/W : 0;
    out[i]=100/(1+Math.exp(-4*sc));
  }
  return out;
}

/* ================= FORECAST ================= */
function forecast(A){
  const F=[]; const add=(key,v,w,txt)=>F.push({key,v:clamp(v,-1,1),w,txt});
  // heat (contrarian, weighted by horizon)
  const hz=[A.hz.s,A.hz.m,A.hz.l]; const hw=[.25,.35,.4]; let hv=0, hws=0;
  hz.forEach((h,i)=>{ if(h!=null){ hv+=hw[i]*(50-h)/50; hws+=hw[i]; } });
  if(hws) add("fHeat", hv/hws*1.3, S.wHeat);
  // trend
  const p=ST.price, e50=last(A.emaM), e200=last(A.emaS), ad=last(A.adx.adx), pdi=last(A.adx.pdi), ndi=last(A.adx.ndi);
  let tr=0; if(e50) tr+=p>e50?0.35:-0.35; if(e200) tr+=p>e200?0.35:-0.35; if(e50&&e200) tr+=e50>e200?0.3:-0.3;
  if(A.d1Trend!=null) tr=tr*0.7+A.d1Trend*0.3;
  if(ad!=null) tr*= clamp(0.6+ad/50,0.6,1.3);
  add("fTrend", tr, S.wTrend);
  // momentum
  const h=A.macd.h, hn=last(h), hp=lastN(h,1), r=last(A.rsi);
  let mo=0; if(hn!=null&&hp!=null){ mo+= hn>0?0.3:-0.3; mo+= hn>hp?0.3:-0.3; } if(r!=null) mo+= r>70?-0.2: r<30?0.2 : (r-50)/50*0.6;
  if(pdi!=null&&ndi!=null) mo+= pdi>ndi?0.15:-0.15;
  add("fMom", mo, S.wMom);
  if(A.ew&&A.ew.ok) add("fEw", A.ew.bias*(0.5+A.ew.conf*0.5), S.wEw);
  if(A.book) add("fBook", (A.book.imb[2].v*0.6+A.book.imb[1].v*0.4)*1.4, S.wBook);
  let fl=0, fw=0; if(A.flow){ fl+=A.flow.delta*1.2+A.flow.wDelta*0.6; fw++; } const dv=A.delta.slice(-24), dvs=sum(dv), vv=sum(ST.k.slice(-24).map(k=>k.v)); if(vv){ fl+=dvs/vv*1.5; fw++; } if(fw) add("fFlow", fl/fw, S.wFlow);
  if(A.drv) add("fDrv", A.drv.score, S.wDrv);
  if(A.spike) add("fVol", A.spike.dir*clamp((A.spike.ratio-1)/3,0,1), S.wVol);
  const W=sum(F.map(f=>f.w)); const score = W? sum(F.map(f=>f.v*f.w))/W : 0;
  const agree = W? sum(F.filter(f=>Math.sign(f.v)===Math.sign(score)&&Math.abs(f.v)>0.05).map(f=>f.w))/W : 0;
  const pUp = 1/(1+Math.exp(-4*score));
  // range
  const c=ST.k.map(k=>k.c); const rets=[]; for(let i=Math.max(1,c.length-150);i<c.length;i++) rets.push(Math.log(c[i]/c[i-1]));
  const mu=sum(rets)/rets.length, sd=Math.sqrt(sum(rets.map(x=>(x-mu)**2))/rets.length);
  const sig=sd*Math.sqrt(S.horizon);
  const base=p*Math.exp(score*sig*0.9), bull=p*Math.exp(sig*(1+Math.max(0,score)*0.5)), bear=p*Math.exp(-sig*(1+Math.max(0,-score)*0.5));
  const verdict = score>0.4?"vStrongBuy":score>0.13?"vBuy":score<-0.4?"vStrongSell":score<-0.13?"vSell":"vNeutral";
  // trade plan
  const atrV=last(A.atr); const sr=A.sr; let plan;
  if(score>=0){
    const s1=sr.sup[0]?.p, r1=sr.res[0]?.p, r2=sr.res[1]?.p;
    const entry = s1 && s1>p-atrV*1.5 ? [s1, p] : [p-atrV*0.5, p];
    const stop = Math.min(entry[0]-atrV*1.2, A.ew?.ok&&A.ew.inval<p&&A.ew.inval>p*0.85? A.ew.inval*0.997 : Infinity);
    const tp1 = r1 && r1<bull*1.02 && r1>p+atrV*0.5 ? r1 : Math.max(p+atrV*2, Math.min(bull, p+atrV*3)); const tp2 = Math.max(tp1+atrV*0.8, r2&&r2<=bull*1.05&&r2>tp1? r2 : bull);
    plan={side:"long", entry, stop, tp1, tp2, rr:(tp1-entry[1])/Math.max(1e-12,entry[1]-stop)};
  } else {
    const r1=sr.res[0]?.p, s1=sr.sup[0]?.p, s2=sr.sup[1]?.p;
    const entry = r1 && r1<p+atrV*1.5 ? [p, r1] : [p, p+atrV*0.5];
    const stop = entry[1]+atrV*1.2;
    const tp1 = s1 && s1>bear*0.98 && s1<p-atrV*0.5 ? s1 : Math.min(p-atrV*2, Math.max(bear, p-atrV*3)); const tp2 = Math.min(tp1-atrV*0.8, s2&&s2>=bear*0.95&&s2<tp1? s2 : bear);
    plan={side:"short", entry, stop, tp1, tp2, rr:(entry[0]-tp1)/Math.max(1e-12,stop-entry[0])};
  }
  return {F, score, agree, pUp, sig, base, bull, bear, verdict, plan};
}

  { const have=["h1","h4","d1"].filter(k=>A.hzCov[k]>0);

/* Heat of another timeframe drawn on the chart's candles, without look-ahead.
   - chart TF >= horizon TF: value of the last horizon candle closed by the end of each bar;
   - chart TF <  horizon TF: the horizon candle is rebuilt bar by bar from the chart candles (developing candle),
     so the line moves every bar exactly as it would have looked live, instead of a staircase. */
function mapHeat(K, HK, tfSec){
  const out=Array(K.length).fill(null); if(!HK||HK.length<45) return out;
  const bar=TF_SEC[S.tf];
  if(bar>=tfSec){
    const H=heatIndex(HK); let j=-1;
    for(let i=0;i<K.length;i++){ const end=K[i].t+bar; while(j+1<HK.length && HK[j+1].t+tfSec<=end) j++; out[i]= j>=0? H[j] : null; }
    out[K.length-1]=last(H);
    return out;
  }
  let j=0, dev=null;
  for(let i=0;i<K.length;i++){
    const t=K[i].t;
    while(j+1<HK.length && HK[j+1].t<=t) j++;
    if(!(HK[j].t<=t && t<HK[j].t+tfSec)){ dev=null; continue; }
    const k=K[i];
    if(!dev || dev.t!==HK[j].t){ const first=k.t===HK[j].t; dev={t:HK[j].t, o:first?k.o:HK[j].o, h:k.h, l:k.l, c:k.c, v:k.v, tb:k.tb}; if(!first){ dev.h=Math.max(k.h,HK[j].o); dev.l=Math.min(k.l,HK[j].o); } }
    else { dev.h=Math.max(dev.h,k.h); dev.l=Math.min(dev.l,k.l); dev.c=k.c; dev.v+=k.v; dev.tb=(dev.tb!=null&&k.tb!=null)? dev.tb+k.tb : null; }
    if(j<45) continue;
    const ser=HK.slice(Math.max(0,j-HZ_WARM), j); ser.push({...dev});
    const h=heatIndex(ser); out[i]=h[h.length-1];
  }
  return out;
}
