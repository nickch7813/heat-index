const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chartOpts(){
  return { autoSize:true, layout:{background:{type:"solid",color:"transparent"}, textColor:cssv("--mute"), fontFamily:"Onest, system-ui, sans-serif", fontSize:12},
    grid:{vertLines:{color:cssv("--line")+"66"}, horzLines:{color:cssv("--line")+"66"}},
    rightPriceScale:{borderColor:cssv("--line"), minimumWidth:86}, timeScale:{borderColor:cssv("--line"), timeVisible:true, rightOffset:6},
    crosshair:{mode:0}, localization:{locale:"en-US"} };
}
function initCharts(){
  CH = LightweightCharts.createChart($("chart"), chartOpts());
  CS = CH.addCandlestickSeries({borderVisible:false});
  const L=(color,w=1,style=0)=>CH.addLineSeries({color, lineWidth:w, lineStyle:style, lastValueVisible:false, priceLineVisible:false, crosshairMarkerVisible:false});
  LN.e1=L("#F2B441"); LN.e2=L("#5B9CF5"); LN.e3=L("#A58BF0",2);
  LN.bu=L("#8798B0",1,2); LN.bm=L("#8798B0",1,1); LN.bl=L("#8798B0",1,2);
  LN.ew=L("#A58BF0",2); LN.ewT=L("#A58BF0",1,2); LN.ewT.applyOptions({autoscaleInfoProvider:()=>null}); // a far wave target must not squash the candles
  LN.fb=L("#2EBD8E",1,2); LN.fm=L("#F2B441",2,2); LN.fr=L("#EE5D5D",1,2);
  const fix0100={autoscaleInfoProvider:()=>({priceRange:{minValue:0,maxValue:100}, margins:{above:6,below:6}})};
  HR_KEYS.forEach(k=>{
    const c=LightweightCharts.createChart($("hr_"+k), {...chartOpts(), timeScale:{...chartOpts().timeScale, visible:false}});
    const an=c.addLineSeries({visible:false, lastValueVisible:false, priceLineVisible:false});
    const base={priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, lineWidth:1, ...fix0100};
    const zHi=c.addBaselineSeries({...base, baseValue:{type:"price",price:S.heatSell}, topLineColor:"rgba(0,0,0,0)", bottomLineColor:"rgba(0,0,0,0)", bottomFillColor1:"rgba(0,0,0,0)", bottomFillColor2:"rgba(0,0,0,0)"});
    const zLo=c.addBaselineSeries({...base, baseValue:{type:"price",price:S.heatBuy}, topLineColor:"rgba(0,0,0,0)", bottomLineColor:"rgba(0,0,0,0)", topFillColor1:"rgba(0,0,0,0)", topFillColor2:"rgba(0,0,0,0)"});
    const s=c.addLineSeries({color:HR_COL[k], lineWidth:k==="avg"?3:2, priceLineVisible:false, lastValueVisible:true, priceFormat:{type:"price",precision:0,minMove:1}, ...fix0100});
    HR[k]={c,s,an,zHi,zLo,lines:[]};
  });
  [CH,...HR_KEYS.map(k=>HR[k].c)].forEach(wireChart);
  rebuildCharts();
  applyChartTheme();
}
function applyChartTheme(){
  if(!CH) return;
  const o=chartOpts(); delete o.timeScale; CH.applyOptions(chartOpts()); [...HR_KEYS.map(k=>HR[k]?.c), ...Object.values(PN).map(p=>p.c)].forEach(c=>c&&c.applyOptions(o)); updateTimeAxes();
  CS.applyOptions({upColor:cssv("--up"), downColor:cssv("--down"), wickUpColor:cssv("--up"), wickDownColor:cssv("--down")});
}
const toLine = (K,a) => { const r=[]; for(let i=0;i<K.length;i++) if(a[i]!=null&&isFinite(a[i])) r.push({time:K[i].t, value:a[i]}); return r; };
function renderChart(fit){
  const K=ST.k, A=ST.A, ov=S.ov, prec=decimals(ST.price);
  const fmt={type:"price", precision:prec, minMove:+Math.pow(10,-prec).toFixed(prec)};
  CS.applyOptions({priceFormat:fmt});
  Object.values(LN).forEach(s=>s.applyOptions({priceFormat:fmt}));
  const tfs0=TF_SEC[S.tf], ws=[]; for(let i=1;i<=S.horizon+2;i++) ws.push({time:K[K.length-1].t+tfs0*i});
  CS.setData(K.map(k=>({time:k.t,open:k.o,high:k.h,low:k.l,close:k.c})).concat(ws));
  ANCHOR=K.map(k=>({time:k.t})).concat(ws); HR_KEYS.forEach(k=>HR[k].an.setData(ANCHOR));
  TIDX=new Map(K.map((k,i)=>[k.t,i]));
  const up=cssv("--up"), dn=cssv("--down");
  LN.e1.setData(ov.ema?toLine(K,A.emaF):[]); LN.e2.setData(ov.ema?toLine(K,A.emaM):[]); LN.e3.setData(ov.ema?toLine(K,A.emaS):[]);
  LN.bu.setData(ov.bb?toLine(K,A.bb.up):[]); LN.bm.setData(ov.bb?toLine(K,A.bb.mid):[]); LN.bl.setData(ov.bb?toLine(K,A.bb.lo):[]);
  // waves
  const marks=[]; const ew=A.ew; const tfs=TF_SEC[S.tf];
  if(ov.ew && ew.ok){
    LN.ew.setData(ew.q.map(p=>({time:K[p.i].t, value:p.p})));
    const lp=ew.q[ew.q.length-1];
    LN.ewT.setData(ew.target? [{time:K[lp.i].t, value:lp.p}, {time:K[K.length-1].t+tfs*Math.max(6,Math.round(S.horizon*0.8)), value:ew.target}] : []);
    ew.q.forEach((p,i)=>marks.push({time:K[p.i].t, position:p.t==="H"?"aboveBar":"belowBar", color:cssv("--violet"), shape:"circle", size:0.6, text:EW_LABELS[i]+(i===ew.legs?"?":"")}));
  } else { LN.ew.setData([]); LN.ewT.setData([]); }
  if(ov.sig){
    const from=Math.max(0,K.length-400);
    A.bt.sigs.buy.forEach((b,i)=>{ if(b&&i>=from) marks.push({time:K[i].t, position:"belowBar", color:up, shape:"arrowUp", text:""}); });
    A.bt.sigs.sell.forEach((b,i)=>{ if(b&&i>=from) marks.push({time:K[i].t, position:"aboveBar", color:dn, shape:"arrowDown", text:""}); });
  }
  if(A.spike) marks.push({time:K[A.spike.i].t, position:A.spike.dir>0?"belowBar":"aboveBar", color:cssv("--accent"), shape:"square", size:0.6, text:"V×"+fn(A.spike.ratio,1)});
  marks.sort((a,b)=>a.time-b.time); CS.setMarkers(marks);
  // forecast cone
  const fc=A.fc;
  if(ov.fc){
    const t0=K[K.length-1].t, t1=t0+tfs*S.horizon, p=ST.price;
    LN.fb.setData([{time:t0,value:p},{time:t1,value:fc.bull}]); LN.fm.setData([{time:t0,value:p},{time:t1,value:fc.base}]); LN.fr.setData([{time:t0,value:p},{time:t1,value:fc.bear}]);
    const pu=Math.round(fc.pUp*100);
    LN.fb.applyOptions({lastValueVisible:true, title:"▲ "+pu+"%"}); LN.fr.applyOptions({lastValueVisible:true, title:"▼ "+(100-pu)+"%"}); LN.fm.applyOptions({lastValueVisible:true, title:t("base")});
    LN.fb.setMarkers([{time:t1, position:"aboveBar", color:up, shape:"arrowUp", text:t("probRise")+" "+pu+"%"}]);
    LN.fr.setMarkers([{time:t1, position:"belowBar", color:dn, shape:"arrowDown", text:t("probFall")+" "+(100-pu)+"%"}]);
  } else { [LN.fb,LN.fm,LN.fr].forEach(l=>{ l.setData([]); l.setMarkers([]); l.applyOptions({lastValueVisible:false,title:""}); }); }
  renderProbBadge();
  // price lines
  plines.forEach(l=>CS.removePriceLine(l)); plines=[];
  const PL=(price,color,title,style=2,w=1)=>{ if(price&&isFinite(price)) plines.push(CS.createPriceLine({price,color,lineWidth:w,lineStyle:style,axisLabelVisible:true,title})); };
  if(ov.sr){ A.sr.sup.slice(0,2).forEach(s=>PL(s.p,up,"S"+(s.n>1?"×"+s.n:""),0)); A.sr.res.slice(0,2).forEach(s=>PL(s.p,dn,"R"+(s.n>1?"×"+s.n:""),0)); }
  if(ov.fib){ A.fib.lv.forEach(l=>PL(l.p,cssv("--blue"),"Fib "+l.r,1)); }
  if(ov.walls && A.book){ A.book.walls.slice(0,6).forEach(w=>PL(w.p, w.s==="bid"?up:dn, (w.s==="bid"?"🐋 bid ":"🐋 ask ")+fbig(w.n),3)); }
  if(ov.liq && A.drv?.map){ A.drv.map.topL.slice(0,2).forEach(x=>PL(x.p,dn,"Liq L",3)); A.drv.map.topS.slice(0,2).forEach(x=>PL(x.p,up,"Liq S",3)); }
  if(ov.fc){ PL(fc.plan.stop,dn,"Stop",1); PL(fc.plan.tp1,up,"TP1",1); PL(fc.plan.tp2,up,"TP2",1); }
  renderPanes(); renderHeatRows();
  if(fit){ const n=K.length; CH.timeScale().setVisibleLogicalRange({from:Math.max(0,n-160), to:n+S.horizon+4}); }
  renderLegend();
}
/* ================= INDICATOR PANES =================
   Every indicator gets its own pane (own chart, own right-hand scale, own range and number format).
   All panes share the candle index set (anchor), so they line up exactly under the price chart. */
const PANE_ORDER=["vol","prob","heat","rsi","stoch","mfi","macd","adx","delta","cvd","obv"];
const RANGE={
  fixed100:()=>({priceRange:{minValue:0,maxValue:100}, margins:{above:6,below:6}}),
  sym:o=>{ const r=o(); if(!r) return r; const m=Math.max(Math.abs(r.priceRange.minValue),Math.abs(r.priceRange.maxValue))||1; return {priceRange:{minValue:-m,maxValue:m}, margins:{above:4,below:4}}; },
  zeroUp:o=>{ const r=o(); if(!r) return r; return {priceRange:{minValue:0,maxValue:Math.max(r.priceRange.maxValue,1e-12)}, margins:{above:6,below:0}}; },
  adx:o=>{ const r=o(); return {priceRange:{minValue:0,maxValue:Math.max(60,r?r.priceRange.maxValue:60)}, margins:{above:6,below:4}}; },
  auto:null
};
function fmtSmart(v){ if(v==null||!isFinite(v)) return ""; const a=Math.abs(v); if(a===0) return "0"; if(a>=1e4) return fbig(v); if(a>=100) return fn(v,0); if(a>=1) return fn(v,2); return fn(v, Math.min(10, Math.max(2, -Math.floor(Math.log10(a))+2))); }
const FMT={ n0:{type:"custom",formatter:v=>fn(v,0),minMove:0.01}, n1:{type:"custom",formatter:v=>fn(v,1),minMove:0.01}, big:{type:"custom",formatter:v=>fbig(v),minMove:1e-8}, smart:{type:"custom",formatter:fmtSmart,minMove:1e-12} };
function paneSpec(k){
  const A=ST.A, K=ST.k, up=cssv("--up"), dn=cssv("--down"), mu=cssv("--mute"), ac=cssv("--accent"), bl=cssv("--blue"), vi=cssv("--violet");
  const zc=(lo,hi,base)=>v=>v<=lo?up:v>=hi?dn:base;
  switch(k){
    case "vol": return {name:t("osc_vol"), range:"zeroUp", fmt:"big", s:[{kind:"hist", a:K.map(x=>x.v), color:i=>(K[i].c>=K[i].o?up:dn)+"aa", lab:"Vol"},{a:A.volSma, color:ac, w:1, lab:"SMA "+S.volSma}]};
    case "prob": return {name:t("osc_prob")+" %", range:"fixed100", fmt:"n0", lv:[[60,up],[50,mu],[40,dn]], s:[{a:A.prob, colorFn:v=>v>=60?up:v<=40?dn:mu, w:2, lab:"▲"}]};
    case "heat": return {name:"Heat "+S.tf, range:"fixed100", fmt:"n0", lv:[[S.heatSell,dn],[50,mu],[S.heatBuy,up]], s:[{a:A.heat, colorFn:v=>v<S.heatBuy?up:v>S.heatSell?dn:ac, w:2, lab:"Heat"}]};
    case "rsi": return {name:"RSI "+S.rsiP, range:"fixed100", fmt:"n1", lv:[[70,dn],[50,mu],[30,up]], s:[{a:A.rsi, colorFn:v=>v>=70?dn:v<=30?up:vi, w:2, lab:"RSI"}]};
    case "stoch": return {name:"Stoch RSI", range:"fixed100", fmt:"n0", lv:[[80,dn],[20,up]], s:[{a:A.srsi.k, color:bl, w:2, lab:"%K"},{a:A.srsi.d, color:ac, w:1, lab:"%D"}]};
    case "mfi": return {name:"MFI "+S.mfiP, range:"fixed100", fmt:"n0", lv:[[80,dn],[50,mu],[20,up]], s:[{a:A.mfi, colorFn:v=>v>=80?dn:v<=20?up:vi, w:2, lab:"MFI"}]};
    case "macd": { const h=A.macd.h; return {name:`MACD ${S.macdF}/${S.macdS}/${S.macdG}`, range:"sym", fmt:"smart", lv:[[0,mu]], s:[{kind:"hist", a:h, color:i=>{ const v=h[i], p=h[i-1]; const grow=p==null||Math.abs(v)>=Math.abs(p); return v>=0?(grow?up:up+"77"):(grow?dn:dn+"77"); }, lab:"Hist"},{a:A.macd.m, color:bl, w:2, lab:"MACD"},{a:A.macd.sig, color:ac, w:1, lab:"Signal"}]}; }
    case "adx": return {name:"ADX "+S.adxP, range:"adx", fmt:"n1", lv:[[25,mu]], s:[{a:A.adx.adx, color:ac, w:2, lab:"ADX"},{a:A.adx.pdi, color:up, w:1, lab:"+DI"},{a:A.adx.ndi, color:dn, w:1, lab:"−DI"}]};
    case "delta": return {name:t("osc_delta"), range:"sym", fmt:"big", lv:[[0,mu]], s:[{kind:"hist", a:A.delta, color:i=>(A.delta[i]>=0?up:dn)+"bb", lab:"Δ"}]};
    case "cvd": return {name:"CVD", range:"auto", fmt:"big", s:[{a:A.cvd, color:ac, w:2, lab:"CVD"}]};
    case "obv": return {name:"OBV", range:"auto", fmt:"big", s:[{a:A.obv, color:bl, w:2, lab:"OBV"}]};
  }
}
function wireChart(c){
  c.timeScale().subscribeVisibleLogicalRangeChange(r=>{ if(syncing||!r) return; syncing=true; CHARTS.forEach(x=>{ if(x!==c) x.timeScale().setVisibleLogicalRange(r); }); syncing=false; });
  c.subscribeCrosshairMove(p=>crossSync(c,p));
}
function rebuildCharts(){ CHARTS=[CH, ...PANE_ORDER.filter(k=>PN[k]).map(k=>PN[k].c), ...HR_KEYS.map(k=>HR[k].c)]; }
function ensurePane(k){
  if(PN[k]) return PN[k];
  const div=document.createElement("div"); div.className="pane2"; div.id="pn_"+k; div.innerHTML=`<div class="hlab" id="pl_${k}"></div>`;
  $("panes").appendChild(div);
  const o=chartOpts(); const c=LightweightCharts.createChart(div, {...o, timeScale:{...o.timeScale, visible:false}});
  const an=c.addLineSeries({visible:false, lastValueVisible:false, priceLineVisible:false});
  wireChart(c);
  return PN[k]={c, an, div, series:[], lines:[], spec:null};
}
function dropPane(k){ const P=PN[k]; if(!P) return; try{ P.c.remove(); }catch(e){} P.div.remove(); delete PN[k]; }
function renderPanes(){
  const K=ST.k, A=ST.A; if(!A) return;
  PANE_ORDER.forEach(k=>{ if(!S.panes[k]) dropPane(k); });
  PANE_ORDER.filter(k=>S.panes[k]).forEach(k=>{
    const P=ensurePane(k); $("panes").appendChild(P.div); // keeps the fixed order
    P.series.forEach(x=>P.c.removeSeries(x.s)); P.series=[]; P.lines=[];
    const sp=paneSpec(k); P.spec=sp;
    const prov=RANGE[sp.range];
    sp.s.forEach((d,si)=>{
      const opt={priceLineVisible:false, lastValueVisible:true, priceFormat:FMT[sp.fmt], ...(prov?{autoscaleInfoProvider:prov}:{})};
      const ser = d.kind==="hist"? P.c.addHistogramSeries({...opt, lastValueVisible:false}) : P.c.addLineSeries({...opt, color:d.color||cssv("--accent"), lineWidth:d.w||2, crosshairMarkerRadius:3});
      const data=[]; for(let i=0;i<K.length;i++){ const v=d.a[i]; if(v==null||!isFinite(v)) continue; const pt={time:K[i].t, value:v}; if(d.kind==="hist") pt.color=d.color(i); else if(d.colorFn) pt.color=d.colorFn(v); data.push(pt); }
      ser.setData(data); P.series.push({s:ser, a:d.a, d});
    });
    P.an.setData(ANCHOR);
    const first=P.series.find(x=>x.d.kind!=="hist")||P.series[0];
    (sp.lv||[]).forEach(([v,c])=>P.lines.push(first.s.createPriceLine({price:v,color:c,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:""})));
    paneLabel(k);
  });
  rebuildCharts(); updateTimeAxes();
  const r=CH.timeScale().getVisibleLogicalRange(); if(r){ syncing=true; CHARTS.forEach(c=>{ if(c!==CH) c.timeScale().setVisibleLogicalRange(r); }); syncing=false; }
}
function paneLabel(k, i){
  const P=PN[k]; if(!P||!P.spec) return; const n=ST.k.length;
  const vals=P.series.map(x=>{ const idx= i==null? n-1 : i; const v=x.a[idx]; const col = x.d.kind==="hist"? x.d.color(idx) : x.d.colorFn? x.d.colorFn(v) : x.d.color; return v==null||!isFinite(v)? "" : `<span style="color:${col}">${esc(x.d.lab)} <b>${FMT[P.spec.fmt].formatter(v)}</b></span>`; }).filter(Boolean).join(" ");
  $("pl_"+k).innerHTML=`<b>${esc(P.spec.name)}</b>${ib(k)} ${vals}`;
}
/* time axis only under the lowest visible chart */
function updateTimeAxes(){
  const order=[...PANE_ORDER.filter(k=>PN[k]).map(k=>PN[k].c), ...HR_KEYS.filter(k=>S.hrow[k]).map(k=>HR[k].c)];
  const lastC=order[order.length-1];
  CH.applyOptions({timeScale:{visible:!lastC}});
  Object.values(PN).forEach(p=>p.c.applyOptions({timeScale:{visible:p.c===lastC}}));
  HR_KEYS.forEach(k=>HR[k].c.applyOptions({timeScale:{visible:HR[k].c===lastC}}));
}
function zoneOf(v){ return v==null? null : v<S.heatBuy? "low" : v>S.heatSell? "high" : "mid"; }
function heatLabel(k, i){
  const A=ST.A, a=A.hzRows[k], v = i==null? a[a.length-1] : a[i], z=zoneOf(v);
  const nm={h1:"Heat 1h", h4:"Heat 4h", d1:"Heat 1d", avg:t("hzAvgRow")}[k];
  const zc= z==="low"?"up": z==="high"?"down":"n";
  const cov = k!=="avg" && A.hzCov[k]>0 && A.hzCov[k]<0.97 ? ` <span class="mute">· ${esc(t("covPart",{p:fn(A.hzCov[k]*100,0)}))}</span>` : (k!=="avg"&&A.hzCov[k]===0? ` <span class="mute">· ${esc(t("noData"))}</span>`:"");
  $("hl_"+k).innerHTML=`<i style="background:${HR_COL[k]}"></i><b>${esc(nm)}</b>${ib(k==="avg"?"hzAvg":"hz")} <span class="v">${fn(v,0)}</span>${z?` <span class="pill ${zc}">${esc(t(z==="low"?"heatLow":z==="high"?"heatHigh":"heatMid"))}</span>`:""}${cov}`;
}
function renderHeatRows(){
  const K=ST.k, A=ST.A, up=cssv("--up"), dn=cssv("--down"), mu=cssv("--mute");
  HR_KEYS.forEach(k=>{
    const R=HR[k], a=A.hzRows[k]; $("hr_"+k).classList.toggle("off", !S.hrow[k]);
    const pts=[]; for(let i=0;i<K.length;i++){ const v=a[i]; if(v==null) continue; const z=zoneOf(v); pts.push({time:K[i].t, value:v, color: z==="low"?up : z==="high"?dn : HR_COL[k]}); }
    R.s.setData(pts);
    const plain=pts.map(p=>({time:p.time,value:p.value}));
    R.zHi.applyOptions({baseValue:{type:"price",price:S.heatSell}, topFillColor1:dn+"66", topFillColor2:dn+"14"}); R.zHi.setData(plain);
    R.zLo.applyOptions({baseValue:{type:"price",price:S.heatBuy}, bottomFillColor1:up+"14", bottomFillColor2:up+"66"}); R.zLo.setData(plain);
    R.lines.forEach(l=>R.s.removePriceLine(l));
    R.lines=[[S.heatSell,dn,2],[50,mu,3],[S.heatBuy,up,2]].map(([v,c,st])=>R.s.createPriceLine({price:v,color:c,lineWidth:1,lineStyle:st,axisLabelVisible:v!==50,title:""}));
    const m=[];
    for(let i=Math.max(1,K.length-400);i<K.length;i++){ if(a[i]==null||a[i-1]==null) continue;
      if(a[i-1]<S.heatBuy&&a[i]>=S.heatBuy) m.push({time:K[i].t,position:"belowBar",color:up,shape:"arrowUp",size:0.8});
      if(a[i-1]>S.heatSell&&a[i]<=S.heatSell) m.push({time:K[i].t,position:"aboveBar",color:dn,shape:"arrowDown",size:0.8}); }
    R.s.setMarkers(S.ov.sig? m : []);
    heatLabel(k);
  });
  updateTimeAxes();
  const r=CH.timeScale().getVisibleLogicalRange(); if(r){ syncing=true; HR_KEYS.forEach(k=>HR[k].c.timeScale().setVisibleLogicalRange(r)); syncing=false; }
}
/* crosshair: one vertical line across the price chart, the oscillator and all Heat rows; row labels show the hovered values */
function crossSync(src, p){
  if(xsync||!ST.A) return; xsync=true;
  try{
    const i = p&&p.time!=null? TIDX.get(p.time) : undefined;
    CHARTS.forEach(c=>{ if(c===src) return;
      if(i===undefined){ c.clearCrosshairPosition(); return; }
      let ser=null, val=null;
      if(c===CH){ ser=CS; val=ST.k[i].c; }
      else { const hk=HR_KEYS.find(x=>HR[x].c===c);
        if(hk){ ser=HR[hk].s; val=ST.A.hzRows[hk][i]; }
        else { const pk=Object.keys(PN).find(x=>PN[x].c===c); const P=PN[pk]; const ref=P&&(P.series.find(x=>x.d.kind!=="hist")||P.series[0]); if(ref){ ser=ref.s; val=ref.a[i]; } } }
      if(ser&&val!=null&&isFinite(val)) c.setCrosshairPosition(val, p.time, ser); else c.clearCrosshairPosition();
    });
    HR_KEYS.forEach(k=>heatLabel(k, i)); Object.keys(PN).forEach(k=>paneLabel(k, i));
  }catch(e){} finally{ xsync=false; }
}
function renderProbBadge(){
  const el=$("pBadge"); if(!S.ov.prob||!ST.A){ el.innerHTML=""; return; }
  const fc=ST.A.fc, pu=Math.round(fc.pUp*100), pd=100-pu, vc= fc.score>0.13?"up":fc.score<-0.13?"down":"mute";
  el.innerHTML=`${ib("probB")}<div class="row"><span class="up big">▲ ${pu}%</span><span class="down big">▼ ${pd}%</span></div>
    <div class="split"><b style="width:${pu}%;background:var(--up)"></b><b style="width:${pd}%;background:var(--down)"></b></div>
    <div class="row"><span class="up">${esc(t("probRise"))}</span><span class="down">${esc(t("probFall"))}</span></div>
    <div class="sub">${esc(t("probOn",{h:S.horizon,tf:S.tf}))} · <span class="${vc}">${esc(t(fc.verdict))}</span></div>`;
}
function renderLegend(){
  const items=[];

const frame2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
async function chartShot(sel) {
  const prevP = { ...S.panes }, prevH = { ...S.hrow };
  PANE_ORDER.forEach(k => S.panes[k] = !!sel.p[k]); HR_KEYS.forEach(k => S.hrow[k] = !!sel.h[k]);
  renderPanes(); renderHeatRows(); await frame2();
  const parts = [], lab = id => { const el = $(id); return el ? el.innerText.replace(/\s+/g, " ").replace(/\bi\b/g, "").trim() : ""; };
  try {
    if (sel.main) parts.push({ cv: CH.takeScreenshot(), lab: `${$("hName").textContent} · ${$("hSub").textContent}` });
    PANE_ORDER.filter(k => sel.p[k] && PN[k]).forEach(k => parts.push({ cv: PN[k].c.takeScreenshot(), lab: lab("pl_" + k) }));
    HR_KEYS.filter(k => sel.h[k] && HR[k]).forEach(k => parts.push({ cv: HR[k].c.takeScreenshot(), lab: lab("hl_" + k) }));
  } finally {
    Object.assign(S.panes, prevP); Object.assign(S.hrow, prevH);
    PANE_ORDER.forEach(k => { if (!prevP[k]) delete S.panes[k]; });
    renderPanes(); renderHeatRows();
  }
  const ok = parts.filter(x => x.cv && x.cv.width && x.cv.height);
  if (!ok.length) throw new Error(SL("need"));
  const W = Math.max(...ok.map(x => x.cv.width)), gap = Math.round(W / 180), H = ok.reduce((a, x) => a + x.cv.height + gap, 0);
  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const g = out.getContext("2d"), bg = cssv("--panel") || cssv("--bg") || "#16181d", tx = cssv("--text") || "#e8eaed", fs = Math.round(W / 62);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  let y = 0;
  ok.forEach(x => {
    g.drawImage(x.cv, 0, y);
    if (x.lab) {   // the pane name and values, on a plate so they read on any chart
      g.font = `600 ${fs}px system-ui,sans-serif`; const tw = Math.min(W * 0.8, g.measureText(x.lab).width);
      g.globalAlpha = 0.82; g.fillStyle = bg; g.fillRect(fs * 0.4, y + fs * 0.35, tw + fs, fs * 1.6); g.globalAlpha = 1;
      g.fillStyle = tx; g.textBaseline = "middle"; g.fillText(x.lab, fs * 0.9, y + fs * 1.15, W * 0.8);
    }
    y += x.cv.height + gap;
    if (y < H) { g.fillStyle = cssv("--line") || "#2c3038"; g.fillRect(0, y - gap, W, Math.max(1, gap / 3)); }
  });
  return out;
}
document.addEventListener("click", async e => {

      if (m === "all") i.checked = true;

    toggleShotCfg(false);

});

/* ================= CORRELATION WITH BITCOIN =================
   Log returns of the coin and of BTCUSDT (Binance spot, same timeframe) over the last 120 candles. */
const CORR = { key: null, v: null, busy: false };
async function corrBtc(){
  const key = S.base + "|" + S.quote + "|" + S.tf + "|" + (ST.k && ST.k.length ? ST.k[ST.k.length-1].t : 0);
  if (CORR.key === key || CORR.busy || !window.CH || !ST.k || ST.k.length < 40) return;
  if (S.base === "BTC") { CORR.key = key; CORR.v = null; return; }
  CORR.busy = true;
  try {
    const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${S.tf}&limit=${Math.min(1000, ST.k.length)}`); if (!r.ok) throw 0;
    const b = (await r.json()).map(k => [+k[0] / 1000, +k[4]]), m = new Map(b);
    const a = [], c = []; ST.k.forEach(k => { const t0 = k.t ?? k.time; if (m.has(t0)) { a.push(k.c); c.push(m.get(t0)); } });
    CORR.v = window.CH.corr(a, c, 120); CORR.key = key;
    if (ST.A) renderHero();
  } catch (e) { CORR.key = key; CORR.v = null; } finally { CORR.busy = false; }
}

function closeWS(){ ST.ws.forEach(w=>{ try{ clearInterval(w._p); w.onclose=null; w.close(); }catch(e){} }); ST.ws=[]; }
function openWS(cfg, onItems){
  try{
    const w=new WebSocket(cfg.url);
    w.onopen=()=>{ if(cfg.sub) w.send(JSON.stringify(cfg.sub)); if(cfg.ping) w._p=setInterval(()=>{ try{ w.send(typeof cfg.ping==="string"?cfg.ping:JSON.stringify(cfg.ping)); }catch(e){} },20000); };
    w.onmessage=e=>{ if(e.data==="pong") return; let m; try{ m=JSON.parse(e.data); }catch(_){ return; } const it=cfg.parse(m); if(it&&it.length) onItems(it); };
    w.onclose=()=>{ clearInterval(w._p); setTimeout(()=>{ if(ST.ws.includes(w)){ ST.ws=ST.ws.filter(x=>x!==w); openWS(cfg,onItems); } }, 4000); };
    ST.ws.push(w);
  }catch(e){ console.warn(e); }
}

let tipFor=null, tipKey=null;
function showTip(key, anchor){
  const el=$("tip");
  if(tipKey===key && el.classList.contains("on")){ hideTip(); return; }
  let title, body;
  if(GUIDES[key]){ title=t(key==="@ov"?"guideOv":"guidePanes"); body=GUIDES[key].map(k=>{ const h=hint(k); return h? `<div class="gi"><b>${esc(h[0])}</b>${h[1].split("\n").map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""; }).join(""); }
  else { const h=hint(key); if(!h) return; title=h[0]; body=h[1].split("\n").map(x=>`<p>${esc(x)}</p>`).join(""); }
  el.innerHTML=`<h4><span>${esc(title)}</span><button type="button" aria-label="Close" data-tipclose>✕</button></h4>${body}`;
  el.classList.add("on");
  document.querySelectorAll('.ib[aria-expanded="true"]').forEach(b=>b.setAttribute("aria-expanded","false"));
  anchor.setAttribute("aria-expanded","true"); tipFor=anchor; tipKey=key;

function placeTip(){
  const el=$("tip"); if(!el.classList.contains("on")||!tipFor) return;
  if(window.innerWidth<700){ el.style.left=""; el.style.top=""; return; }
  if(!tipFor.isConnected){ hideTip(); return; }
  const r=tipFor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  if(r.bottom<0||r.top>window.innerHeight){ hideTip(); return; }
  let x=clamp(r.left+r.width/2-w/2, 8, window.innerWidth-w-8), y=r.bottom+8;
  if(y+h>window.innerHeight-8) y=Math.max(8, r.top-h-8);
  el.style.left=x+"px"; el.style.top=y+"px";
}
function hideTip(){ $("tip").classList.remove("on"); if(tipFor) tipFor.setAttribute("aria-expanded","false"); tipFor=null; tipKey=null; }

  $("openSet").onclick=openSettings; $("closeSet").onclick=closeSettings; $("scrim").onclick=closeSettings;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSettings(); });
  $("resetSet").onclick=()=>{ const keep={base:S.base,quote:S.quote,exch:S.exch,market:S.market,tf:S.tf,lang:S.lang,theme:S.theme,favs:S.favs,tgToken:S.tgToken,tgChat:S.tgChat}; S={...structuredClone(DEF),...keep}; save(); buildSettings(); buildToolbars(); setTimer(); applyRowH(); if(ST.k.length){ compute(); renderAll(false); } toast(t("resetDone")); };
  $("ovl").onclick=e=>{ const b=e.target.closest("[data-ov]"); if(!b) return; const k=b.dataset.ov; S.ov[k]=!S.ov[k]; b.setAttribute("aria-pressed",String(S.ov[k])); save(); if(ST.A) renderChart(false); };
  $("hrHead").onclick=e=>{ const b=e.target.closest("[data-hr]"); if(!b) return; const k=b.dataset.hr; S.hrow[k]=!S.hrow[k]; b.setAttribute("aria-pressed",String(S.hrow[k])); save(); if(ST.A) renderHeatRows(); };
  $("hrHead").addEventListener("change",e=>{ if(e.target.id!=="lvLow"&&e.target.id!=="lvHigh") return; setLevels(+$("lvLow").value, +$("lvHigh").value); });
  $("paneSel").onclick=e=>{ const b=e.target.closest("[data-pane]"); if(!b) return; const k=b.dataset.pane; S.panes[k]=!S.panes[k]; b.setAttribute("aria-pressed",String(S.panes[k])); save(); if(ST.A) renderPanes(); };
  $("tabs").onclick=e=>{ const b=e.target.closest("[data-t]"); if(!b) return; document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===b))); document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on", p.id==="p-"+b.dataset.t)); if(ST.A){ if(b.dataset.t==="wh") renderWhales(); if(b.dataset.t==="lq") renderDeriv(); if(b.dataset.t==="bt") drawEq(); if(b.dataset.t==="sh") renderShare(); } };
  $("btRun").onclick=()=>{ if(!ST.A) return; ST.A.bt=backtest(ST.k,ST.A,$("btSig").value); renderBt(); renderChart(false); };
  $("btSig").onchange=()=>$("btRun").click();
  $("dlCard").onclick=()=>{ const a=document.createElement("a"); a.download=`${S.base}_${S.tf}_cryptohunters.png`; a.href=$("shareCv").toDataURL("image/png"); a.click(); };
  $("tgCard").onclick=()=>tgSend("photo"); $("tgText").onclick=()=>tgSend("text");
  $("cpText").onclick=()=>navigator.clipboard?.writeText(postText()).then(()=>toast(t("copied")));
  let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(!ST.A) return; drawDepth(); drawLiq(); drawEq(); },200); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && ST.k.length && S.refresh>0) run(true); });
}

/* ================= INIT ================= */
(function init(){
  const tg=window.Telegram?.WebApp; if(tg&&tg.initData){ try{ tg.ready(); tg.expand(); }catch(e){} }
  const qs=new URLSearchParams(location.search); if(qs.get("coin")){ S.base=qs.get("coin").toUpperCase(); } if(qs.get("tf")&&TF_SEC[qs.get("tf")]) S.tf=qs.get("tf"); if(qs.get("ex")&&EX[qs.get("ex")]) S.exch=qs.get("ex"); if(qs.get("q")&&["USDT","BTC","USDC","FDUSD"].includes(qs.get("q").toUpperCase())) S.quote=qs.get("q").toUpperCase();
  if(window.CH) S.theme=window.CH.theme(S.theme); document.documentElement.dataset.theme=S.theme; applyRowH();
  if(!window.LightweightCharts){ setStatus("Chart library failed to load", true); return; }
  initCharts(); syncControls(); applyI18n(); bind(); setTimer(); loadSymbols(); run();
})();
</script>
