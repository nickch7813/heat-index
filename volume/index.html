<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<style id="ch-css">
/* CRYPTO HUNTERS: the shared look of every tool.
   The colors are the ones of Heat Index (the main app), so all tools read as one product.
   Each tool maps its own variable names to these tokens in a small <style id="ch-skin"> block. */
:root{
  --ch-bg:#fff;--ch-s1:#f4f4f2;--ch-tx:#1b1f24;--ch-t2:#5f6368;--ch-t3:#8a8f96;--ch-bd:#e3e3e0;--ch-bd2:#c9c9c4;
  --ch-acb:#e6f1fb;--ch-act:#0c447c;--ch-acd:#85b7eb;--ch-ac:#378add;
  --ch-okb:#eaf3de;--ch-okt:#27500a;--ch-erb:#fcebeb;--ch-ert:#791f1f;--ch-warn:#ba7517;
  --ch-up:#1d9e75;--ch-dn:#e24b4a;--ch-upb:rgba(29,158,117,.12);--ch-dnb:rgba(226,75,74,.12);
  --ch-brand:#c9820f;--ch-w:760px;--ch-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}}
:root[data-theme=dark]{
  --ch-bg:#16181d;--ch-s1:#1f2228;--ch-tx:#e8eaed;--ch-t2:#a0a4ab;--ch-t3:#6f747c;--ch-bd:#2c3038;--ch-bd2:#454a54;
  --ch-acb:#0c3a66;--ch-act:#b5d4f4;--ch-acd:#378add;--ch-ac:#378add;
  --ch-okb:#173404;--ch-okt:#c0dd97;--ch-erb:#501313;--ch-ert:#f7c1c1;--ch-warn:#ef9f27;
  --ch-up:#2bb58a;--ch-dn:#ec5f5e;--ch-upb:rgba(43,181,138,.14);--ch-dnb:rgba(236,95,94,.14);--ch-brand:#f5a524;color-scheme:dark}

/* ---- suite bar: brand, Telegram channel and the tools ---- */
.ch-top{background:var(--ch-bg);border-bottom:0.5px solid var(--ch-bd);font:14px/1.4 var(--ch-font);color:var(--ch-tx);position:relative;z-index:3}
.ch-in{max-width:var(--ch-w);margin:0 auto;padding:0 14px}
.ch-row{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.ch-brand{display:inline-flex;align-items:center;gap:8px;color:var(--ch-tx);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.ch-brand img,.ch-logo,.ch-logo svg{width:26px;height:26px;border-radius:8px;display:block;flex:0 0 auto}
.ch-brand span b{color:var(--ch-brand);font-weight:600}
.ch-sp{flex:1}
.ch-tg{display:inline-flex;align-items:center;gap:6px;color:var(--ch-act);background:var(--ch-acb);border:0.5px solid var(--ch-acd);border-radius:14px;padding:4px 10px 4px 8px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap;min-height:28px}
.ch-tg svg{width:15px;height:15px;flex:0 0 auto}
.ch-tg:hover{border-color:var(--ch-act)}
.ch-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.ch-nav::-webkit-scrollbar{display:none}
.ch-nav a,.ch-nav span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 10px;border-radius:8px;color:var(--ch-t2);text-decoration:none;font-size:13px}
.ch-nav a:hover{color:var(--ch-tx);background:var(--ch-s1)}
.ch-nav span{background:var(--ch-acb);color:var(--ch-act);font-weight:500}
.ch-nav svg,.ch-links svg{width:15px;height:15px;flex:0 0 auto}
.ch-top a:focus-visible,.ch-links a:focus-visible,.ch-foot a:focus-visible,.ch-cam:focus-visible,.ch-shot button:focus-visible,.ch-shot a:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:420px){.ch-brand{font-size:13px}.ch-tg span{display:none}.ch-tg{padding:4px 8px}}

/* ---- links from a coin card to the other tools ---- */
.ch-links{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font:12px/1.3 var(--ch-font)}
.ch-links>em{font-style:normal;color:var(--ch-t3);margin-right:2px}
.ch-links a{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);text-decoration:none;background:transparent;white-space:nowrap;min-height:26px}
.ch-links a:hover{border-color:var(--ch-acd);color:var(--ch-act);background:var(--ch-acb)}
.ch-links svg{width:13px;height:13px}
.ch-links:empty{display:none}

/* ---- screenshot: camera button and preview ---- */
:root .ch-cam{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--ch-bd2);background:var(--ch-bg);color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;white-space:nowrap}
:root .ch-cam:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-cam svg{width:16px;height:16px}
:root .ch-cam.ch-float{position:absolute;top:10px;right:10px;z-index:2}
.ch-shot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.5);font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-shot[hidden]{display:none}
.ch-shot .ch-pn{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.ch-shot img{display:block;width:100%;height:auto;border-radius:8px;border:0.5px solid var(--ch-bd)}
.ch-shot .ch-wait{padding:36px 0;text-align:center;color:var(--ch-t2)}
.ch-shot .ch-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
:root .ch-shot .ch-acts>*{flex:1 1 auto;text-align:center;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:6px 12px;font:13px/1.2 var(--ch-font);cursor:pointer;text-decoration:none;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
:root .ch-shot .ch-acts>.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-shot p{margin:8px 2px 0;font-size:12px;color:var(--ch-t3)}

/* ---- footer ---- */
.ch-foot{border-top:0.5px solid var(--ch-bd);margin-top:24px;font:12px/1.5 var(--ch-font);color:var(--ch-t3);background:var(--ch-bg)}
.ch-foot .ch-in{padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ch-foot b{color:var(--ch-t2);font-weight:600;letter-spacing:.04em}
.ch-foot a{color:var(--ch-act);text-decoration:none}
.ch-foot a:hover{text-decoration:underline}

/* ---- base skin of every tool (the class is set on the body by ch.js) ---- */
body.ch-skin{font-family:var(--ch-font)!important;font-size:14px;line-height:1.45;-webkit-font-smoothing:auto}
body.ch-skin :is(h1,h2,h3,h4,input,select,button,textarea,summary,.brand){font-family:inherit!important;font-stretch:normal!important}
body.ch-skin :is(input,select,textarea){border-width:0.5px!important}
body.ch-skin ::selection{background:var(--ch-acb);color:var(--ch-act)}

/* ---- notification log ---- */
:root .ch-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;padding:0;flex:0 0 auto}
:root .ch-bell:hover{color:var(--ch-tx);border-color:var(--ch-t3)}
:root .ch-bell svg{width:17px;height:17px}
.ch-bell b{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ch-dn);color:#fff;font:600 10px/17px var(--ch-font);text-align:center;box-sizing:border-box}
.ch-bell b[hidden]{display:none}
.ch-bell:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-lock,.ch-lock body{overflow:hidden}
.ch-log{position:fixed;inset:0;z-index:1001;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;font:14px/1.45 var(--ch-font);color:var(--ch-tx)}
.ch-log[hidden]{display:none}
.ch-lp{width:min(440px,100%);height:100%;background:var(--ch-bg);border-left:0.5px solid var(--ch-bd2);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.ch-lp>header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.ch-lp h2{flex:1;margin:0;font:500 17px/1.3 var(--ch-font)}
:root .ch-x{width:32px;height:32px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;cursor:pointer;font-size:13px}
.ch-lf{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px;border-bottom:0.5px solid var(--ch-bd)}
.ch-lf:empty{display:none}
.ch-lf::-webkit-scrollbar{display:none}
:root .ch-lf button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 10px;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:28px}
:root .ch-lf button svg{width:13px;height:13px}
:root .ch-lf button[aria-pressed=true]{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500}
.ch-ll{flex:1;overflow:auto;padding:4px 14px 14px;overscroll-behavior:contain}
.ch-le{border-bottom:0.5px solid var(--ch-bd);padding:11px 0 11px 10px;margin-left:-10px;border-left:2px solid transparent}
.ch-le.ch-new{border-left-color:var(--ch-ac)}
.ch-lm{display:flex;align-items:center;gap:6px;color:var(--ch-t3);font-size:12px;margin-bottom:3px}
.ch-lm svg{width:14px;height:14px}
.ch-lm em{font-style:normal;color:var(--ch-act);background:var(--ch-acb);border-radius:6px;padding:0 6px;font-size:11px}
.ch-lm time{margin-left:auto;white-space:nowrap}
.ch-le>b{display:block;font-weight:500;font-size:14px}
.ch-le p{margin:2px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-lc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.ch-lc span{font-size:11px;color:var(--ch-t3);border:0.5px solid var(--ch-bd);border-radius:6px;padding:1px 6px}
.ch-lc a{margin-left:auto;font-size:12px;color:var(--ch-act);text-decoration:none;padding:3px 0}
.ch-lc a:hover{text-decoration:underline}
.ch-l0{color:var(--ch-t2);padding:28px 4px;margin:0;text-align:center}
.ch-lp>footer{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:0.5px solid var(--ch-bd)}
.ch-lh{flex:1;font-size:11px;color:var(--ch-t3)}
:root .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:5px 12px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:30px}
.ch-lp :is(button,a):focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
@media (max-width:520px){.ch-lp{width:100%;border-left:0}}

/* ---- notification panel: tabs, rules, form, settings ---- */
:root .ch-log .ch-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:0.5px solid var(--ch-bd)}
:root .ch-log .ch-tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--ch-t2);font:500 13px/1.2 var(--ch-font);padding:9px 6px 8px;cursor:pointer;min-height:36px}
:root .ch-log .ch-tabs button[aria-selected=true]{color:var(--ch-tx);border-bottom-color:var(--ch-ac)}
.ch-log .ch-lf{padding-top:10px}
:root .ch-log .ch-add{display:block;width:100%;margin:12px 0 6px;border:0.5px dashed var(--ch-acd);background:var(--ch-acb);color:var(--ch-act);border-radius:12px;padding:10px;font:500 14px/1.2 var(--ch-font);cursor:pointer}
.ch-rule{border-bottom:0.5px solid var(--ch-bd);padding:11px 0}
.ch-rule.ch-offr>:not(.ch-rt){opacity:.6}
.ch-rt{display:flex;align-items:center;gap:8px}
.ch-rt b{font-weight:600;font-size:15px}
.ch-rt span{color:var(--ch-t3);font-size:12px;flex:1}
.ch-rule>p{margin:3px 0 0;font-size:14px}
.ch-rule>p.ch-note{color:var(--ch-t2);font-size:13px}
.ch-lc .ch-ok{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-lc .ch-err{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}
.ch-rm{display:flex;align-items:center;gap:6px;margin-top:7px}
.ch-rm small{flex:1;color:var(--ch-t3);font-size:12px}
:root .ch-log .ch-rm button,:root .ch-log .ch-quick button,:root .ch-log .ch-fh button,:root .ch-log .ch-lp>footer button{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t2);border-radius:14px;padding:4px 11px;font:12px/1.2 var(--ch-font);cursor:pointer;min-height:28px;font-weight:400}
:root .ch-log .ch-lp>footer button.on{background:var(--ch-acb);color:var(--ch-act);border-color:var(--ch-acd);font-weight:500;padding:6px 18px;font-size:13px}
.ch-sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
.ch-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ch-sw i{position:absolute;inset:0;border-radius:11px;background:var(--ch-bd2);transition:background .15s}
.ch-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.ch-sw input:checked+i{background:var(--ch-ac)}
.ch-sw input:checked+i::after{transform:translateX(16px)}
.ch-sw input:focus-visible+i{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-form{display:flex;flex-direction:column;gap:10px;padding:12px 0 4px}
.ch-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ch-t2);min-width:0}
:root .ch-log .ch-form :is(input:not([type=checkbox]),select){font:14px/1.3 var(--ch-font);color:var(--ch-tx);background:var(--ch-bg);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;box-sizing:border-box;margin:0}
:root .ch-log .ch-form :is(input,select):focus{outline:2px solid var(--ch-acd);outline-offset:0;border-color:var(--ch-acd)}
.ch-f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ch-f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch-f2>label:only-child{grid-column:1/-1}
.ch-now{font-size:13px;color:var(--ch-t2);background:var(--ch-s1);border-radius:8px;padding:7px 10px}
.ch-quick{display:flex;flex-wrap:wrap;gap:5px}
.ch-fh{margin:0;font-size:12px;color:var(--ch-t3);line-height:1.45}
.ch-ferr{margin:0;color:var(--ch-ert);background:var(--ch-erb);border-radius:8px;padding:7px 10px;font-size:13px}
.ch-ferr[hidden]{display:none}
.ch-chk{flex-direction:row!important;align-items:center;gap:10px!important;font-size:14px!important;color:var(--ch-tx)!important;cursor:pointer}
.ch-chk input{width:18px;height:18px;margin:0;accent-color:var(--ch-ac)}

/* ---- bell on a coin card ---- */
:root .ch-links .ch-al{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-acd);border-radius:14px;color:var(--ch-act);background:var(--ch-acb);font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-al svg{width:13px;height:13px}
:root .ch-links .ch-al:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}

/* ---- on-screen alerts ---- */
.ch-toasts{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:1002;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 24px));font:14px/1.4 var(--ch-font)}
.ch-toast{position:relative;background:var(--ch-bg);color:var(--ch-tx);border:0.5px solid var(--ch-bd2);border-left:3px solid var(--ch-ac);border-radius:12px;padding:10px 36px 10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:chIn .2s ease-out}
.ch-toast b{display:block;font-weight:600}
.ch-toast p{margin:3px 0 0;color:var(--ch-t2);font-size:13px;white-space:pre-line}
.ch-toast a{display:inline-block;margin-top:6px;font-size:12px;color:var(--ch-act);text-decoration:none}
:root .ch-toast button{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;background:none;color:var(--ch-t3);cursor:pointer;border-radius:8px;padding:0;min-height:0;font-size:12px}
@keyframes chIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ch-toast{animation:none}}

/* ---- hover hints ---- */
.ch-tip{position:fixed;z-index:1100;max-width:min(300px,calc(100vw - 12px));padding:7px 10px;border-radius:8px;background:var(--ch-tx);color:var(--ch-bg);font:12.5px/1.45 var(--ch-font);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;white-space:pre-line;animation:chTip .12s ease-out}
.ch-tip[hidden]{display:none}
@keyframes chTip{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ch-tip{animation:none}}

/* ---- version ---- */
.ch-ver{font:500 11px/1 var(--ch-font);color:var(--ch-t3);border:0.5px solid var(--ch-bd2);border-radius:8px;padding:3px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-ver.ch-old{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent}

/* ---- news ---- */
:root .ch-links .ch-nw{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border:0.5px solid var(--ch-bd2);border-radius:14px;color:var(--ch-t2);background:transparent;font:12px/1.3 var(--ch-font);cursor:pointer;min-height:26px;white-space:nowrap;font-weight:400}
.ch-links .ch-nw svg{width:13px;height:13px}
:root .ch-links .ch-nw.zero{color:var(--ch-t3)}
:root .ch-links .ch-nw.pos{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
:root .ch-links .ch-nw.neg{color:var(--ch-warn);border-color:var(--ch-warn)}
:root .ch-links .ch-nw.imp{color:var(--ch-ert);background:var(--ch-erb);border-color:transparent;font-weight:600}
:root .ch-links .ch-nw:focus-visible{outline:2px solid var(--ch-acd);outline-offset:2px}
.ch-nwi .ch-nh{display:block;color:var(--ch-tx);text-decoration:none;font-weight:500;font-size:14px;line-height:1.4}
.ch-nwi .ch-nh:hover{color:var(--ch-act)}
.ch-ni{font-size:11px;color:var(--ch-ert);background:var(--ch-erb);border-radius:6px;padding:0 6px}
.ch-nt{font-size:11px;border-radius:6px;padding:0 6px;color:var(--ch-t3);border:0.5px solid var(--ch-bd)}
.ch-nt.t-1{color:var(--ch-warn);border-color:var(--ch-warn)}
.ch-nt.t1{color:var(--ch-okt);background:var(--ch-okb);border-color:transparent}
.ch-sh{margin:10px 0 0;font:500 14px/1.3 var(--ch-font);color:var(--ch-tx)}

/* ---- favorites, events, install ---- */
:root .ch-links .ch-fv{border:0.5px solid var(--ch-bd2);background:none;color:var(--ch-t3);border-radius:14px;min-height:26px;min-width:30px;padding:2px 8px;font-size:14px;line-height:1;cursor:pointer}
:root .ch-links .ch-fv.on{color:var(--ch-brand);border-color:var(--ch-brand)}

<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --line:#D5DDE6; --text:#13202C; --muted:#5D6F80;
  --spike:#C98300; --spike-soft:rgba(201,131,0,.14); --up:#0E9A74; --down:#D2465A;
  --bar:#B7C4D2; --chip:#E3E9F0; --accent:#1F5F8B;

  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#142130; --surface:#1C2C3D; --line:#2C4054; --text:#E4ECF3; --muted:#8FA3B6;
    --spike:#F2B544; --spike-soft:rgba(242,181,68,.16); --up:#3FCB9F; --down:#F07384;
    --bar:#3C5268; --chip:#24374A; --accent:#7DB8E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#142130; --surface:#1C2C3D; --line:#2C4054; --text:#E4ECF3; --muted:#8FA3B6;

  --bar:#3C5268; --chip:#24374A; --accent:#7DB8E0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font:700 clamp(34px,6vw,56px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:-.01em}
h1 .bars{display:inline-flex;gap:3px;align-items:flex-end;height:.72em;margin-left:.2em}

h3{font:600 20px/1.2 "Barlow Condensed",sans-serif;margin:22px 2px 8px}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.topctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px}
.tabs{margin:0 0 14px}
.tabs .seg button{font-size:16px;padding:8px 18px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.field{display:grid;gap:5px}
.field > span{font-size:13px;color:var(--muted)}
.field input[type=number],.field input[type=text],.field input[type=password],.field select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:150px}
.field.wide input{width:min(340px,80vw)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;padding-bottom:6px}
.check input{width:18px;height:18px;accent-color:var(--spike)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.primary{border:0;background:var(--spike);color:#1A1204;font-weight:600;padding:10px 20px;border-radius:10px;font-size:16px;text-decoration:none;display:inline-block}
.secondary{border:1px solid var(--line);background:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;text-decoration:none;color:inherit;display:inline-block}
.secondary:disabled,.primary:disabled{opacity:.5;cursor:not-allowed}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--text)}

.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}

.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:16px 2px 10px;color:var(--muted);font-size:14px}
.progress{flex:1 1 200px;height:4px;background:var(--chip);border-radius:4px;overflow:hidden;max-width:320px}
.progress i{display:block;height:100%;width:0;background:var(--spike);transition:width .2s}
.errors{color:var(--down);font-size:14px;margin:0 2px 10px}
.errors:empty{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 2px 10px;font-size:14px;color:var(--muted)}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}

.sortwrap{display:none;gap:8px;align-items:center}

.capturing .nocap{display:none!important}

.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;font-size:13px;color:var(--muted);user-select:none}
th button{border:0;background:none;padding:0;color:inherit;font:inherit}
th[aria-sort] button{color:var(--text)}
th .arr{display:inline-block;width:1em}
#resTable tbody tr{cursor:pointer}
#resTable tbody tr:hover td{background:var(--spike-soft)}
.sym{font-weight:600;font-size:16px}
.sym small{font-weight:400;color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:2px;font-weight:500}
.badge.new{background:var(--spike);color:#1A1204;font-weight:600}
.badge.bu{background:rgba(14,154,116,.16);color:var(--up)}
.badge.bd{background:rgba(210,70,90,.16);color:var(--down)}
.star{border:0;background:none;padding:0 6px 0 0;font-size:17px;color:var(--muted);line-height:1;vertical-align:-1px}
.star[aria-pressed="true"]{color:var(--spike)}
.ratio{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.ratio b{font:700 22px/1 "Barlow Condensed",sans-serif;color:var(--spike);min-width:3.2em;text-align:right}
.ratio canvas{width:96px;height:28px;display:block}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted)}
.chip.hot{background:var(--spike-soft);color:var(--text)}
.chip.cur{box-shadow:inset 0 0 0 1px var(--spike)}
.up{color:var(--up)} .down{color:var(--down)}
.muted{color:var(--muted)}
.tag{font-size:12px;color:var(--muted)}
.shotbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:15px;line-height:1}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .sortwrap{display:flex}
  #shotArea .tablewrap{background:transparent;border:0;overflow:visible}
  #resTable thead{display:none}
  #resTable,#resTable tbody{display:block}
  #resTable tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  #resTable tbody tr:hover td{background:none}
  #resTable td{border:0;padding:0;text-align:left;white-space:normal;display:block}

dialog{border:0;padding:0;background:transparent;max-width:min(680px,94vw);width:100%;color:var(--text)}

.cardhead h2{margin:0;font:700 32px/1 "Barlow Condensed",sans-serif}
.cardhead .big{font:700 40px/1 "Barlow Condensed",sans-serif;color:var(--spike);text-align:right}
.cardhead .big small{display:block;font:400 13px "Barlow",sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;margin:16px 0}
.grid div{font-variant-numeric:tabular-nums}
.grid span{display:block;font-size:12px;color:var(--muted)}
.grid b{font-weight:600;font-size:17px}
.card canvas.chart{width:100%;height:210px;display:block}
.cap{font-size:12px;color:var(--muted);margin:6px 0 0}
.cstats{font-size:14px;margin:10px 0 0}
.wm{font-size:12px;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:10px}
.dlgbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
#previewImg{max-width:100%;border-radius:12px;display:block;margin:0 auto;border:1px solid var(--line)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0;text-align:center}
#offscreen{position:fixed;left:-10000px;top:0;width:600px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const nextAt = {};
const hostIdx = {};
async function throttle(ex){ const now=Date.now(), at=Math.max(now, nextAt[ex]||0); nextAt[ex]=at+EX[ex].gap; if(at>now) await sleep(at-now); }
async function req(ex, mk, path, signal){
  const list = EX[ex].hosts[mk], key = ex+mk, start = hostIdx[key]||0; let lastErr;
  for(let i=0;i<list.length;i++){
    const h = list[(start+i)%list.length];
    for(let attempt=0; attempt<3; attempt++){
      try{
        await throttle(ex);
        const r = await fetch(h+path, {signal});
        if(r.status===429||r.status===418){ await sleep(1500*(attempt+1)); continue; }
        if(!r.ok) throw new Error("HTTP "+r.status);
        const j = await r.json();
        if(ex==="bybit" && j.retCode!==0){ if(j.retCode===10006){ await sleep(1500); continue; } throw new Error(j.retMsg||"error"); }
        if(ex==="okx" && j.code!=="0"){ if(j.code==="50011"){ await sleep(1500); continue; } throw new Error(j.msg||("code "+j.code)); }
        hostIdx[key]=(start+i)%list.length;
        return j;
      }catch(e){ if(e.name==="AbortError") throw e; lastErr=e; break; }
    }
  }
  throw lastErr||new Error("network");
}

/* ===================== analysis ===================== */
function median(a){const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2}
function analyze(kl, minNorm=0){
  const n = kl.length; if(n<40) return null;
  const med = median(kl.slice(n-32,n-2).map(k=>k.v)); if(!(med>0) || med<minNorm) return null;
  const rL = kl[n-1].v/med, rC = kl[n-2].v/med, useLive = rL>=rC, idx = useLive?n-1:n-2, k = kl[idx];
  const prev = kl.slice(Math.max(0,idx-20), idx);
  const hi = Math.max(...prev.map(x=>x.h)), lo = Math.min(...prev.map(x=>x.l));
  const breakout = k.c>hi ? 1 : k.c<lo ? -1 : 0;
  const buyShare = Number.isFinite(k.bv) && k.v>0 ? k.bv/k.v*100 : null;
  return {ratio:useLive?rL:rC, spikeVol:k.v, norm:med, candle:(k.c-k.o)/k.o*100, live:useLive, time:k.t, idx, kl, breakout, buyShare};
}
async function pool(items, size, fn){ let i=0; await Promise.all(Array.from({length:Math.min(size,items.length)}, async()=>{ while(i<items.length){ await fn(items[i++]); } })); }
const exName = e => EX[e].name;
const baseOf = s => s.replace(/USDT$/,"");
const isFav = s => S.favs.includes(s);

/* ===================== scan ===================== */
async function scan(){
  if(scanning){ abortCtl?.abort(); return; }
  const exs = Object.keys(EX).filter(e=>S.ex[e]);
  if(!exs.length){ setErrors([t("noEx")]); return; }
  scanning=true; abortCtl=new AbortController(); const sg=abortCtl.signal;
  const mk=S.mk, tf=S.tf; errors=[]; setErrors(errors); updateScanBtn();
  const found=[]; let done=0, total=0, phase="scanning";
  const prog=$("#prog"), bar=prog.firstElementChild; prog.hidden=false;
  const tick=()=>{ $("#statusText").textContent=t(phase,{d:done,t:total}); bar.style.width=total?(done/total*100)+"%":"0"; };
  $("#foundText").textContent="";
  try{
    const lists = await Promise.all(exs.map(async ex=>{
      try{
        const rows = (await EX[ex].tickers(mk,sg)).filter(r=>r.symbol.endsWith("USDT") && !STABLE.test(r.symbol) && !LEVER.test(r.symbol) && r.price>0);
        const top = rows.filter(r=>r.vol24>=S.minVol).sort((a,b)=>b.vol24-a.vol24).slice(0,S.maxCoins);
        const inTop = new Set(top.map(r=>r.symbol));
        const favs = rows.filter(r=>isFav(r.symbol) && !inTop.has(r.symbol));
        return [...top,...favs].map(r=>({...r,ex}));
      }catch(e){ if(e.name!=="AbortError") errors.push(t("errFetch",{ex:exName(ex),msg:e.message})); return []; }
    }));
    total = lists.reduce((a,l)=>a+l.length,0); tick();
    await Promise.all(lists.map(list=>pool(list, 8, async r=>{
      if(sg.aborted) return;
      try{
        const a = analyze(await EX[r.ex].klines(mk,r,tf,60,sg), S.minNorm);
        const thr = isFav(r.symbol) ? Math.min(S.favThr,S.thr) : S.thr;
        if(a && a.ratio>=thr) found.push({...r,...a, mk, tf, price:a.kl[a.kl.length-1].c, key:`${r.ex}:${mk}:${tf}:${r.symbol}:${a.time}`});
      }catch(e){ if(e.name==="AbortError") return; }
      done++; if(done%5===0||done===total) tick();
    })));
    // enrichment
    phase="enriching"; done=0; total=found.length; tick();
    const byEx = exs.map(ex=>found.filter(f=>f.ex===ex));
    await Promise.all(byEx.map(list=>pool(list, 4, async f=>{
      if(sg.aborted) return;
      f.mtf = {[tf]:f.ratio};
      for(const o of TFS.filter(x=>x!==tf)){ try{ const a=analyze(await EX[f.ex].klines(mk,f,o,60,sg)); f.mtf[o]=a?a.ratio:null; }catch(e){ if(e.name==="AbortError") return; f.mtf[o]=null; } }
      if(S.ageDays>0){ try{ const d=await EX[f.ex].klines(mk,f,"1d",S.ageDays+1,sg); f.young = d.length<S.ageDays; }catch(e){} }
      if(mk==="futures"){
        try{ f.oi = await EX[f.ex].oi(f,tf,sg); }catch(e){ f.oi=null; }
        if(f.funding===undefined && EX[f.ex].funding){ try{ f.funding = await EX[f.ex].funding(f,sg); }catch(e){} }
      }
      done++; tick();
    })));
  }finally{
    scanning=false; prog.hidden=true; updateScanBtn(); setErrors(errors);
  }
  if(sg.aborted && !found.length){ renderStatus(); return; }
  const list = found.filter(f=>!f.young);
  list.forEach(f=>f.isNew = prevKeys.size>0 && !prevKeys.has(f.key));
  prevKeys = new Set(list.map(f=>f.key));
  results=list; scanMk=mk; lastScan=new Date();
  logHistory(list);
  render(); renderStatus();
  notify(list);
  evalHistory();
}

/* ===================== filters ===================== */
function passes(r, withSearch=true){
  if(S.dir==="up" && !(r.candle>0)) return false;
  if(S.dir==="down" && !(r.candle<0)) return false;
  if(S.onlyBreak && !r.breakout) return false;
  if(S.onlyFav && !isFav(r.symbol)) return false;
  if(withSearch && search && !r.symbol.includes(search)) return false;
  return true;
}

/* ===================== notifications ===================== */
async function notify(list){
  const now=Date.now(), cd=S.cooldown*60000, out=[];
  for(const f of list){
    if(!passes(f,false)) continue;
    const nk=`${f.ex}:${f.mk}:${f.symbol}`, prev=notified[nk];
    if(prev && (prev.key===f.key || now-prev.at<cd)) continue;
    notified[nk]={at:now,key:f.key}; out.push(f);
  }
  for(const k in notified) if(now-notified[k].at>86400000) delete notified[k];
  store.set("notified",notified);
  if(!out.length) return;
  if(window.CH){ const chs=[].concat(S.sound?["sound"]:[], S.tgOn&&S.tgToken&&S.tgChat?["telegram"]:[]); out.forEach(f=>window.CH.log({tool:"volume",kind:"spike",coin:baseOf(f.symbol),q:"USDT",ex:f.ex,mk:f.mk,tf:f.tf,r:+f.ratio.toFixed(2),c:+f.candle.toFixed(2),b:f.breakout||0,ch:chs})); }
  if(S.sound) beep();
  if(S.tgOn && S.tgToken && S.tgChat){
    for(const f of out.sort((a,b)=>b.ratio-a.ratio).slice(0,8)){
      try{ await sendTg(f); }catch(e){ $("#tgStatus").textContent=t("tgFail",{msg:e.message}); }
      await sleep(1100);
    }
  }
}
function tgCaption(f){
  const L=[`<b>${esc(baseOf(f.symbol))}/USDT</b> · ${exName(f.ex)} ${esc(t(f.mk))} ${f.tf}`,
    `${esc(t("spike"))}: ×${f.ratio.toFixed(1)} (${esc(t("norm"))} ${fmtVol(f.norm)})`,
    `${esc(t("candle"))}: ${fmtPct(f.candle)} · ${esc(t("ch24"))}: ${fmtPct(f.ch24)}`,
    `${esc(t("price"))}: ${fmtPrice(f.price)}`];
  if(f.breakout) L.push(esc(t(f.breakout>0?"brkUp":"brkDown")));
  if(f.buyShare!=null) L.push(`${esc(t("buy"))}: ${f.buyShare.toFixed(0)}%`);
  if(f.mk==="futures"){ const x=[]; if(f.oi!=null) x.push(`${esc(t("oi"))}: ${fmtPct(f.oi)}`); if(f.funding!=null) x.push(`${esc(t("funding"))}: ${f.funding.toFixed(4)}%`); if(x.length) L.push(x.join(" · ")); }
  L.push(`<a href="${EX[f.ex].url(f.mk,f)}">${esc(t("openEx",{ex:exName(f.ex)}))}</a>`);
  return L.join("\n");
}
async function tgCall(method, body){
  const r = await fetch(`https://api.telegram.org/bot${S.tgToken}/${method}`, {method:"POST", body});
  const j = await r.json().catch(()=>({ok:false,description:"HTTP "+r.status}));
  if(!j.ok) throw new Error(j.description||"error");
  return j;
}
async function sendTg(f){
  const fd = new FormData(); fd.append("chat_id",S.tgChat); fd.append("parse_mode","HTML");
  if(S.tgPhoto && window.html2canvas){
    try{
      const off=$("#offscreen"); off.innerHTML=""; const card=buildCard(f); off.appendChild(card); drawChart(card.querySelector("canvas.chart"),f);
      const blob = await renderBlob(card); off.innerHTML="";
      fd.append("photo", blob, "spike.png"); fd.append("caption", tgCaption(f));
      return await tgCall("sendPhoto", fd);
    }catch(e){ if(/chat|token|Unauthorized|Forbidden/i.test(e.message)) throw e; }
  }
  fd.append("text", tgCaption(f)); fd.append("disable_web_page_preview","true");
  return await tgCall("sendMessage", fd);
}

/* ===================== history ===================== */
function saveHist(){ if(hist.length>1500) hist=hist.slice(-1500); store.set("hist",hist); }
function logHistory(list){
  const keys = new Set(hist.map(h=>h.k)); const now=Date.now();
  for(const f of list){ if(keys.has(f.key)) continue;
    hist.push({k:f.key, ex:f.ex, mk:f.mk, tf:f.tf, s:f.symbol, i:f.inst, r:+f.ratio.toFixed(2), c:+f.candle.toFixed(3), b:f.breakout, at:now, p:f.price});
  }
  saveHist(); if(S.tab==="hist") renderHist();
}
const OFFS=[15,60,240];
let evaluating=false;
async function evalHistory(){
  if(evaluating) return; evaluating=true;
  try{
    const now=Date.now();
    hist.forEach(h=>{ if(!h.x && now-h.at>2*86400000) h.x=1; });
    const due = hist.filter(h=>!h.x && OFFS.some(o=>h["r"+o]===undefined && now>=h.at+(o+5)*60000)).slice(-30);
    const byEx = Object.keys(EX).map(ex=>due.filter(h=>h.ex===ex));
    await Promise.all(byEx.map(list=>pool(list, 3, async h=>{
      try{
        const s=h.at-300000, e=Math.min(now, h.at+245*60000);
        const kl = await EX[h.ex].range5m(h.mk,{inst:h.i,symbol:h.s},s,e);
        for(const o of OFFS){
          if(h["r"+o]!==undefined) continue;
          const tg=h.at+o*60000, c=kl.find(k=>k.t<=tg && tg<k.t+300000);
          if(c && c.t+300000<=now) h["r"+o]=+((c.c-h.p)/h.p*100).toFixed(3);
        }
        if(h.r240!==undefined) h.x=1;
      }catch(e){}
    })));
    saveHist(); if(S.tab==="hist") renderHist();
  }finally{ evaluating=false; }
}
const dirOf = h => h.c>=0?1:-1;
function stats(list){
  const out={n:list.length};
  for(const o of OFFS){ const v=list.filter(h=>typeof h["r"+o]==="number").map(h=>h["r"+o]*dirOf(h)); out["a"+o]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null; }
  const v60=list.filter(h=>typeof h.r60==="number"); out.hit = v60.length? v60.filter(h=>h.r60*dirOf(h)>0).length/v60.length*100 : null;
  return out;
}

    last.map(h=>`<tr><td>${fmtDateTime(new Date(h.at))}</td><td><b>${esc(baseOf(h.s))}</b>${h.b?`<span class="badge ${h.b>0?"bu":"bd"}">${esc(t(h.b>0?"brkUp":"brkDown"))}</span>`:""}</td><td>${exName(h.ex)} ${esc(t(h.mk))}</td><td>${h.tf}</td><td>×${h.r.toFixed(1)}</td><td class="${cls(h.c)}">${fmtPct(h.c)}</td><td>${fmtPrice(h.p)}</td><td>${fmtRes(h.r15,h)}</td><td>${fmtRes(h.r60,h)}</td><td>${fmtRes(h.r240,h)}</td></tr>`).join("")+"</tbody>" : "";

const fmtR = v => v==null ? "—" : `<span class="${cls(v)}">${fmtPct(v)}</span>`;

/* ===================== formatting ===================== */
function fmtPrice(p){ if(!Number.isFinite(p)) return "—"; if(p>=1000) return p.toLocaleString("en-US",{maximumFractionDigits:2}); if(p>=1) return p.toFixed(4).replace(/0+$/,"").replace(/\.$/,""); const d=Math.min(10,Math.max(4,3-Math.floor(Math.log10(p)))); return p.toFixed(d); }
function fmtVol(v){ for(const [s,n] of [["B",1e9],["M",1e6],["K",1e3]]) if(v>=n) return (v/n).toFixed(v/n>=100?0:v/n>=10?1:2)+s; return v.toFixed(0); }
const fmtPct = p => (p>0?"+":"")+p.toFixed(2)+"%";
const cls = p => p>0?"up":p<0?"down":"muted";
const loc = () => S.lang==="en"?"en-GB":S.lang;
const fmtTime = ms => new Date(ms).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"});
const fmtDateTime = d => d.toLocaleString(loc(),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const buyHtml = b => b==null ? `<span class="muted">—</span>` : `<span class="${b>=55?"up":b<=45?"down":""}">${b.toFixed(0)}%</span>`;
const mtfHtml = r => `<span class="chips">${TFS.map(tf=>{ const v=r.mtf?.[tf]; const c=(v!=null&&v>=S.thr?" hot":"")+(tf===r.tf?" cur":""); return `<span class="chip${c}">${tf} ${v===undefined?"…":v===null?"—":"×"+v.toFixed(1)}</span>`; }).join("")}</span>`;
const brkHtml = b => b ? `<span class="badge ${b>0?"bu":"bd"}">${esc(t(b>0?"brkUp":"brkDown"))}</span>` : "";

/* ===================== results rendering ===================== */
function cols(){
  const c=[{k:"symbol",l:"coin"},{k:"ratio",l:"spike"},{k:"price",l:"price"},{k:"candle",l:"candle"},{k:"ch24",l:"ch24"},{k:"buyShare",l:"buy"},{k:"mtf",l:"mtf",ns:1}];
  if(scanMk==="futures") c.push({k:"oi",l:"oi"},{k:"funding",l:"funding"});
  c.push({k:"spikeVol",l:"spikeVol"},{k:"vol24",l:"vol24"},{k:"time",l:"time"});
  return c;
}
function renderHead(){
  const C=cols();
  $("#headRow").innerHTML = C.map(c=>{
    if(c.ns) return `<th>${esc(t(c.l))}</th>`;
    const on=S.sort.key===c.k;
    return `<th ${on?`aria-sort="${S.sort.dir>0?"ascending":"descending"}"`:""}><button data-sort="${c.k}">${esc(t(c.l))}<span class="arr">${on?(S.sort.dir>0?"↑":"↓"):""}</span></button></th>`;
  }).join("")+`<th class="nocap"></th>`;
  const opts=[]; C.filter(c=>!c.ns).forEach(c=>{ opts.push([c.k+":-1",t(c.l)+" ↓"]); opts.push([c.k+":1",t(c.l)+" ↑"]); });
  $("#sortSel").innerHTML = opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("");
  $("#sortSel").value = S.sort.key+":"+S.sort.dir;
}
function visible(){
  const {key,dir}=S.sort;
  return results.filter(r=>passes(r)).sort((a,b)=>{
    const x=a[key], y=b[key];
    if(x==null && y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string"?x.localeCompare(y):x-y)*dir;
  });
}

      <td class="c-ratio"><div class="ratio"><canvas data-spark="${i}"></canvas><b>×${r.ratio.toFixed(1)}</b></div></td>
      <td data-l="${esc(t("price"))}">${fmtPrice(r.price)}</td>
      <td data-l="${esc(t("candle"))}" class="${cls(r.candle)}">${fmtPct(r.candle)}</td>
      <td data-l="${esc(t("ch24"))}" class="${cls(r.ch24)}">${fmtPct(r.ch24)}</td>
      <td data-l="${esc(t("buy"))}">${buyHtml(r.buyShare)}</td>
      <td class="c-mtf" data-l="${esc(t("mtf"))}">${mtfHtml(r)}</td>

      <td data-l="${esc(t("funding"))}">${r.funding==null?'<span class="muted">—</span>':`<span class="${cls(r.funding)}">${r.funding.toFixed(4)}%</span>`}</td>`:""}
      <td data-l="${esc(t("spikeVol"))}">${fmtVol(r.spikeVol)} <span class="tag">/ ${esc(t("norm"))} ${fmtVol(r.norm)}</span></td>
      <td data-l="${esc(t("vol24"))}">${fmtVol(r.vol24)}</td>

}

/* ===================== canvas ===================== */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function prepCanvas(c,w,h){ const d=Math.max(2,window.devicePixelRatio||1); c.width=w*d; c.height=h*d; const g=c.getContext("2d"); g.scale(d,d); return g; }
function drawSpark(c,r){
  if(!c) return; const w=96,h=28,g=prepCanvas(c,w,h);
  const kl=r.kl.slice(-30), off=r.kl.length-kl.length, max=Math.max(...kl.map(k=>k.v)), bw=w/kl.length;
  kl.forEach((k,i)=>{ const bh=Math.max(1,k.v/max*h); g.fillStyle=(off+i===r.idx)?css("--spike"):css("--bar"); g.fillRect(i*bw+.5,h-bh,Math.max(1,bw-1.2),bh); });
}
function drawChart(c,r){
  const w=c.clientWidth||560, h=210, g=prepCanvas(c,w,h);
  const kl=r.kl, n=kl.length, max=Math.max(...kl.map(k=>k.v)), padT=10, padB=18, ch=h-padT-padB, bw=w/n;
  kl.forEach((k,i)=>{ const bh=Math.max(1,k.v/max*ch); g.fillStyle=i===r.idx?css("--spike"):css("--bar"); g.fillRect(i*bw+1,padT+ch-bh,Math.max(1,bw-2),bh); });
  const ny=padT+ch-r.norm/max*ch;
  g.strokeStyle=css("--muted"); g.setLineDash([4,4]); g.lineWidth=1; g.beginPath(); g.moveTo(0,ny); g.lineTo(w,ny); g.stroke(); g.setLineDash([]);
  const ps=kl.map(k=>k.c), pmin=Math.min(...ps), pr=(Math.max(...ps)-pmin)||1;
  g.strokeStyle=css("--accent"); g.lineWidth=2; g.beginPath();
  ps.forEach((p,i)=>{ const x=i*bw+bw/2, y=padT+(1-(p-pmin)/pr)*ch*.85+ch*.05; i?g.lineTo(x,y):g.moveTo(x,y); }); g.stroke();
  g.fillStyle=css("--muted"); g.font="11px Barlow, sans-serif";
  g.textAlign="left"; g.fillText(fmtTime(kl[0].t),2,h-4); g.textAlign="right"; g.fillText(fmtTime(kl[n-1].t),w-2,h-4);
}

/* ===================== card ===================== */
function buildCard(r){
  const card=$("#cardTpl").content.firstElementChild.cloneNode(true);
  card.querySelector(".c-sym").textContent=baseOf(r.symbol)+"/USDT";
  card.querySelector(".c-ex").textContent=`${exName(r.ex)} · ${t(r.mk)} · ${r.tf}`;
  card.querySelector(".c-ratio").innerHTML="×"+r.ratio.toFixed(1)+`<small>${esc(t("vsNorm"))}</small>`;
  const cells=[["price",esc(fmtPrice(r.price))],["candle",`<span class="${cls(r.candle)}">${fmtPct(r.candle)}</span>`],["ch24",`<span class="${cls(r.ch24)}">${fmtPct(r.ch24)}</span>`],
    ["spikeVol",fmtVol(r.spikeVol)+" USDT"],["norm",fmtVol(r.norm)+" USDT"],["vol24",fmtVol(r.vol24)+" USDT"]];
  if(r.buyShare!=null) cells.push(["buy",buyHtml(r.buyShare)]);
  if(r.mk==="futures"){ if(r.oi!=null) cells.push(["oi",`<span class="${cls(r.oi)}">${fmtPct(r.oi)}</span>`]); if(r.funding!=null) cells.push(["funding",r.funding.toFixed(4)+"%"]); }
  let g=cells.map(([k,v])=>`<div><span>${esc(t(k))}</span><b>${v}</b></div>`).join("");
  g+=`<div style="grid-column:1/-1"><span>${esc(t("mtf"))}</span>${mtfHtml(r)} ${brkHtml(r.breakout)}</div>`;
  card.querySelector(".c-grid").innerHTML=g;
  card.querySelector(".c-cap").textContent=t("chartCap",{n:r.kl.length});
  card.querySelector(".c-stats").textContent=coinStats(r.symbol);
  card.querySelector(".c-time").textContent=t("candleOpen",{time:fmtTime(r.time)})+" ("+t(r.live?"live":"closed")+")";
  return card;
}
let current=null;
function openDetail(r){

  if(window.CH) CH.linksInto($("#chLinks"),{coin:baseOf(r.symbol),q:"USDT",ex:r.ex,from:"volume"});

/* ===================== screenshots ===================== */
let shotBlob=null, shotName="";
async function renderBlob(el){
  const bg=getComputedStyle(document.body).backgroundColor, sc=Math.max(2,window.devicePixelRatio||1);
  const c=watermark(await html2canvas(el,{backgroundColor:bg,scale:sc,logging:false}), sc);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
function watermark(src, s){
  const link=(S.wmLink||"").trim(), name=(S.wmName||"").trim();
  if(!S.wmOn || (!link && !name)) return src;
  const short=link.replace(/^https?:\/\//,"").replace(/\/$/,"");
  const bar=Math.round(46*s), pad=Math.round(16*s);
  const c=document.createElement("canvas"); c.width=src.width; c.height=src.height+bar;
  const g=c.getContext("2d"); g.drawImage(src,0,0);
  // faint diagonal pattern across the image
  const mark=short||name;
  g.save(); g.beginPath(); g.rect(0,0,c.width,src.height); g.clip();
  g.globalAlpha=.09; g.fillStyle=css("--text"); g.textAlign="center"; g.textBaseline="middle";
  g.font=`600 ${Math.round(17*s)}px Barlow, sans-serif`;
  g.translate(c.width/2, src.height/2); g.rotate(-Math.PI/8);
  const stepX=g.measureText(mark).width+Math.round(90*s), stepY=Math.round(84*s), R=Math.hypot(c.width,src.height)/2+stepX;
  for(let y=-R, row=0; y<=R; y+=stepY, row++) for(let x=-R+(row%2?stepX/2:0); x<=R; x+=stepX) g.fillText(mark,x,y);
  g.restore();
  // bottom strip
  g.fillStyle=css("--surface"); g.fillRect(0,src.height,c.width,bar);
  g.fillStyle=css("--line"); g.fillRect(0,src.height,c.width,Math.max(1,Math.round(s)));
  const mid=src.height+bar/2; g.textBaseline="middle";
  let x=pad; const bh=Math.round(18*s), bw=Math.round(3*s), hs=[.35,.25,.45,.3,1];
  hs.forEach((h,i)=>{ g.fillStyle=i===4?css("--spike"):css("--bar"); g.fillRect(x+i*(bw+Math.round(2*s)), mid+bh/2-bh*h, bw, bh*h); });
  x+=5*(bw+Math.round(2*s))+Math.round(10*s);
  if(name){ g.fillStyle=css("--text"); g.textAlign="left"; g.font=`700 ${Math.round(20*s)}px "Barlow Condensed", Barlow, sans-serif`; g.fillText(name,x,mid); }
  if(short){ g.fillStyle=css("--spike"); g.textAlign="right"; g.font=`600 ${Math.round(16*s)}px Barlow, sans-serif`; g.fillText(short,c.width-pad,mid); }
  return c;
}
async function capture(el,name){
  if(!window.html2canvas){ alert("html2canvas not loaded"); return; }
  shotBlob=await renderBlob(el); shotName=name;
  const url=URL.createObjectURL(shotBlob);
  $("#previewImg").src=url; const a=$("#pSave"); a.href=url; a.download=name;
  const file=new File([shotBlob],name,{type:"image/png"});
  $("#pShare").hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));
  $("#pCopy").hidden=!(navigator.clipboard&&window.ClipboardItem); $("#pCopy").textContent=t("copy");
  $("#preview").showModal();
}
async function shotTable(){
  const area=$("#shotArea");
  $("#shotCap").innerHTML=esc(t("title"))+` <small>${esc(Object.keys(EX).filter(e=>S.ex[e]).map(exName).join(" + "))}, ${esc(t(scanMk))}, ${S.tf}, ×${S.thr}+. ${esc(lastScan?fmtDateTime(lastScan):"")}</small>`;
  area.classList.add("capturing");
  try{ await capture(area,`volume-spikes-${stamp()}.png`); }finally{ area.classList.remove("capturing"); }
}
async function shotCard(){ if(current) await capture($("#detailCard").firstElementChild,`${baseOf(current.symbol)}-${current.ex}-${current.tf}-${stamp()}.png`); }
const stamp=()=>{ const d=new Date(),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };

/* ===================== CSV ===================== */
function downloadCSV(name, header, rows){
  const q=v=>{ const s=v==null?"":String(v); return /[",;\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const txt="\ufeff"+[header,...rows].map(r=>r.map(q).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function resultsCSV(){
  const r=visible();
  downloadCSV(`volume-spikes-${stamp()}.csv`,["exchange","market","tf","symbol","ratio","price","candle_pct","change24_pct","buy_share_pct","breakout","mtf_5m","mtf_15m","mtf_1h","mtf_4h","oi_change_pct","funding_pct","spike_volume","norm_volume","volume24","candle_time","candle_state"],
    r.map(x=>[exName(x.ex),x.mk,x.tf,x.symbol,x.ratio.toFixed(2),x.price,x.candle.toFixed(3),x.ch24.toFixed(3),x.buyShare?.toFixed(1),x.breakout,...TFS.map(tf=>x.mtf?.[tf]?.toFixed(2)),x.oi?.toFixed(3),x.funding?.toFixed(5),x.spikeVol.toFixed(0),x.norm.toFixed(0),x.vol24.toFixed(0),new Date(x.time).toISOString(),x.live?"forming":"closed"]));
}
function histCSV(){
  downloadCSV(`spike-history-${stamp()}.csv`,["spotted","exchange","market","tf","symbol","ratio","candle_pct","breakout","price","after_15m_pct","after_1h_pct","after_4h_pct"],
    hist.map(h=>[new Date(h.at).toISOString(),exName(h.ex),h.mk,h.tf,h.s,h.r,h.c,h.b,h.p,h.r15,h.r60,h.r240]));
}

/* ===================== sound ===================== */
function beep(){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)();
  [0,.18].forEach(d=>{ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.15,ac.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.15); o.connect(g).connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16); });
}catch(e){} }
